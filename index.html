<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://platform.twitter.com https://cdn.syndication.twimg.com https://www.gstatic.com https://apis.google.com;
  worker-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://pbs.twimg.com https://abs.twimg.com https://ton.twimg.com;
  font-src 'self' data:;
  connect-src 'self' https://cdn.syndication.twimg.com https://syndication.twitter.com https://twitter.com https://x.com https://api.open-meteo.com https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com;
  frame-src https://platform.twitter.com https://syndication.twitter.com https://www.google.com https://accounts.google.com https://boothlist-4589c.firebaseapp.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>けもケット ブース一覧</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --paper:#f2f0e6;
    --panel:#2b3a30;
    --panel-2:#3a4d3f;
    --ink:#22261f;
    --moss:#5c7a52;
    --moss-light:#8fae7c;
    --clay:#b5652f;
    --line:#c9c3ac;
    --card-bg:#fbfaf4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
  }

  /* 스크롤바를 사이트 테마 색상에 맞춤 */
  html{
    scrollbar-color:var(--moss) var(--paper);
    scrollbar-width:thin;
  }
  ::-webkit-scrollbar{
    width:12px;
    height:12px;
  }
  ::-webkit-scrollbar-track{
    background:var(--paper);
  }
  ::-webkit-scrollbar-thumb{
    background:var(--moss);
    border-radius:8px;
    border:3px solid var(--paper);
  }
  ::-webkit-scrollbar-thumb:hover{
    background:var(--clay);
  }
  .modal{
    scrollbar-color:rgba(255,255,255,.35) transparent;
  }
  .modal::-webkit-scrollbar-track{
    background:transparent;
  }
  .modal::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.3);
    border:3px solid var(--panel);
  }
  .modal::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.5);
  }

  header.top{
    background:var(--panel);
    color:var(--paper);
    padding:22px 20px 18px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .top-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand .mark{
    font-size:26px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .brand .sub{
    font-size:12px;
    color:var(--moss-light);
    letter-spacing:.04em;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:6px;
    padding:6px 10px;
  }
  .search-box input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-size:13px;
    width:180px;
  }
  .search-box input::placeholder{color:#c7d2c1;}

  .lang-switch{
    display:flex;
    gap:4px;
  }
  .lang-switch button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    padding:5px 10px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s;
  }
  .lang-switch button:hover{background:rgba(255,255,255,.12);}
  .lang-switch button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  .settings-wrap{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.35);
    background:transparent;
    color:var(--paper);
    padding:0 12px;
    height:34px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .header-btn:hover{background:rgba(255,255,255,.12);}
  .settings-btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    width:34px;
    height:34px;
    border-radius:6px;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    transition:background .15s;
  }
  .settings-btn:hover{background:rgba(255,255,255,.12);}
  .settings-menu{
    display:none;
    position:fixed;
    z-index:50;
    width:190px;
    max-width:calc(100vw - 20px);
    background:var(--panel);
    border-radius:10px;
    padding:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .settings-menu.open{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .settings-menu .lang-switch{
    justify-content:flex-end;
  }
  .settings-item{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    padding:7px 12px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    text-align:left;
    transition:background .15s;
  }
  .settings-item:hover{background:rgba(255,255,255,.12);}
  .settings-item:disabled{opacity:.5; cursor:default;}
  .settings-item:disabled:hover{background:transparent;}
  .settings-item.danger{
    border-color:rgba(214,69,69,.55);
    color:#ff9a9a;
  }
  .settings-item.danger:hover{background:rgba(214,69,69,.18);}
  .auth-status{
    font-size:11px;
    color:rgba(242,240,230,.75);
    padding:0 2px;
    word-break:break-all;
  }

  .help-body p{
    margin:0 0 12px;
    line-height:1.7;
  }
  .help-body p:last-child{margin-bottom:0;}
  .help-body a{color:inherit;}

  nav.rows{
    max-width:1180px;
    margin:0 auto;
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  nav.rows button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    width:36px;
    height:36px;
    border-radius:4px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  nav.rows button:hover{background:rgba(255,255,255,.12);}
  nav.rows button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }
  nav.rows button.empty{
    opacity:.35;
  }
  nav.rows button.memo-tab-btn{
    width:auto;
    padding:0 12px;
    font-size:13px;
    font-weight:600;
    border-color:rgba(255,255,255,.35);
  }
  nav.rows button.memo-tab-btn.active{
    background:#c9973b;
    border-color:#c9973b;
  }

  .second-row{
    max-width:1180px;
    margin:10px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .tab-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tab-group button{
    appearance:none;
    border:1px solid rgba(255,255,255,.35);
    background:transparent;
    color:var(--paper);
    padding:0 12px;
    height:36px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .tab-group button:hover{background:rgba(255,255,255,.12);}
  .tab-group button.active{
    background:#c9973b;
    border-color:#c9973b;
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:26px 20px 80px;
  }

  .row-heading{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .row-heading .big-letter{
    font-size:42px;
    font-weight:800;
    line-height:1;
    color:var(--clay);
  }
  .row-heading .count{
    font-size:13px;
    color:#5a5646;
  }
  .sort-priority-btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 10px;
    border-radius:4px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    margin-left:auto;
    transition:background .15s, border-color .15s;
  }
  .sort-priority-btn:hover{background:#efece0;}
  .sort-priority-btn.active{
    background:var(--panel);
    border-color:var(--panel);
    color:var(--paper);
  }
  .notes-extra{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin:-8px 0 18px;
  }
  .visit-filter{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .visit-filter button{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 10px;
    border-radius:4px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .visit-filter button:hover{background:#efece0;}
  .visit-filter button.active{
    background:var(--panel);
    border-color:var(--panel);
    color:var(--paper);
  }
  .budget-total{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 12px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    gap:14px;
  }

  .booth{
    position:relative;
    z-index:1;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 8px 12px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .12s;
  }
  .booth:hover{
    border-color:var(--moss);
    transform:translateY(-2px);
  }
  .booth .id{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    color:#8a8368;
    letter-spacing:.03em;
    margin-bottom:6px;
  }
  .avatar-wrap{
    width:64px;
    height:64px;
    margin:0 auto 8px;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar-wrap.avatar-link{
    outline-offset:2px;
    transition:outline .12s;
  }
  .avatar-wrap.avatar-link:hover{
    outline:2px solid var(--moss);
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-wrap .fallback{
    color:var(--moss-light);
    font-size:20px;
    font-weight:700;
  }
  .circle-name{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .rep-name{
    font-size:11px;
    color:#8a8368;
    margin-top:2px;
  }
  .no-tw-badge{
    position:absolute;
    top:6px;
    right:6px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#d9a24b;
    display:none;
  }
  .booth.no-tw .no-tw-badge{display:block;}

  /* 메모가 달린 부스 표시 */
  .booth.has-note{
    border-color:var(--clay);
    box-shadow:0 0 0 1px var(--clay) inset;
    background:#fce3d2;
  }
  .memo-flag{
    position:absolute;
    top:6px;
    left:6px;
    font-size:12px;
    line-height:1;
    display:none;
  }
  .booth.has-note .memo-flag{display:block;}

  /* 방문 예정/완료 부스 표시 (메모 표시보다 우선 적용) */
  .booth.visit-planned{
    border-color:#c99a1f;
    box-shadow:0 0 0 1px #c99a1f inset;
    background:#fff6d1;
  }
  .booth.visit-visited{
    border-color:#3f7a33;
    box-shadow:0 0 0 1px #3f7a33 inset;
    background:#e3f3df;
  }

  /* 우선순위 표시 (배경색과 겹치지 않도록 카드 테두리 outline으로 표시) */
  .booth.priority-1{ outline:3px solid #d64545; outline-offset:2px; }
  .booth.priority-2{ outline:3px solid #8b5fbf; outline-offset:2px; }
  .booth.priority-3{ outline:3px solid #3b82c4; outline-offset:2px; }

  /* 팝오버 안의 메모 입력 영역 */
  .memo-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .memo-box label{
    display:block;
    font-size:11px;
    color:var(--moss-light);
    margin-bottom:4px;
  }
  .memo-box textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    color:var(--paper);
    font-size:12px;
    font-family:inherit;
    padding:6px 8px;
    box-sizing:border-box;
  }
  .memo-box .memo-actions{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .memo-box button{
    font-size:11px;
    padding:4px 10px;
    border-radius:5px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
  }
  .memo-box button.save{
    background:#c9973b;
    border-color:#c9973b;
    color:#241b06;
    font-weight:600;
  }
  .memo-box .memo-status{
    font-size:10.5px;
    color:var(--moss-light);
    margin-left:auto;
    align-self:center;
  }

  /* hover / focus popover */
  .popover{
    display:none;
    position:absolute;
    z-index:200;
    left:50%;
    bottom:calc(100% + 10px);
    transform:translateX(-50%);
    width:300px;
    max-width:calc(100vw - 20px);
    background:var(--panel);
    color:var(--paper);
    border-radius:10px;
    padding:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    text-align:left;
  }
  .popover.below{
    bottom:auto;
    top:calc(100% + 10px);
  }
  .booth.show-pop{ z-index:200; }
  .booth.show-pop .popover{display:block;}
  .popover::before{
    content:"";
    position:absolute;
    bottom:-6px;
    left:var(--arrow-left, 50%);
    transform:translateX(-50%) rotate(45deg);
    width:12px;
    height:12px;
    background:var(--panel);
  }
  .popover.below::before{
    bottom:auto;
    top:-6px;
  }
  .pop-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .pop-head img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:var(--panel-2);
  }
  .pop-head img.avatar-link{
    cursor:pointer;
    outline-offset:2px;
    transition:outline .12s;
  }
  .pop-head img.avatar-link:hover{
    outline:2px solid var(--moss-light);
  }
  .pop-head .names{font-size:13px;}
  .pop-head .c-name{font-weight:700;}
  .pop-head .r-name{color:var(--moss-light);font-size:11px;}
  .pop-links{
    display:flex;
    gap:8px;
    margin-top:10px;
    font-size:11px;
  }
  .pop-links a{
    color:var(--moss-light);
    text-decoration:none;
    border:1px solid rgba(255,255,255,.25);
    padding:4px 8px;
    border-radius:5px;
  }
  .pop-links a:hover{background:rgba(255,255,255,.1);}

  /* 방문 예정/완료 표시 버튼 */
  .visit-box{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .visit-box button{
    flex:1;
    font-size:11.5px;
    font-weight:600;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .visit-box button.planned.active{
    background:#e0b12c;
    border-color:#e0b12c;
    color:#241b06;
  }
  .visit-box button.visited.active{
    background:#4a8f3c;
    border-color:#4a8f3c;
    color:#eafce6;
  }

  /* 우선순위 선택 버튼 */
  .priority-box{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .priority-box button{
    flex:1;
    font-size:11.5px;
    font-weight:600;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .priority-box button.p1.active{
    background:#d64545;
    border-color:#d64545;
    color:#fff;
  }
  .priority-box button.p2.active{
    background:#8b5fbf;
    border-color:#8b5fbf;
    color:#fff;
  }
  .priority-box button.p3.active{
    background:#3b82c4;
    border-color:#3b82c4;
    color:#fff;
  }

  /* 부스별 예산 입력 */
  .budget-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .budget-box label{
    display:block;
    font-size:11px;
    color:var(--moss-light);
    margin-bottom:4px;
  }
  .budget-input-row{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    padding:2px 8px;
  }
  .budget-input-row .yen{
    font-size:12px;
    color:var(--moss-light);
  }
  .budget-input-row input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-size:12px;
    font-family:inherit;
    padding:6px 0;
  }

  .tweet-slot{
    margin-top:2px;
    min-height:20px;
  }
  .tweet-slot .placeholder{
    font-size:11.5px;
    color:#c7d2c1;
    border:1px dashed rgba(255,255,255,.25);
    border-radius:6px;
    padding:8px;
    line-height:1.5;
  }
  .tweet-slot iframe{border-radius:6px;}

  .empty-state{
    padding:60px 0;
    text-align:center;
    color:#8a8368;
    font-size:14px;
  }

  /* 배치도(스키매틱 맵) */
  .map-grid{
    display:flex;
    gap:16px;
    overflow-x:auto;
    padding-bottom:16px;
  }
  .map-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
  }
  .map-col .map-col-label{
    font-weight:800;
    font-size:13px;
    color:var(--clay);
    margin-bottom:6px;
    position:sticky;
    top:0;
  }
  .map-col .map-cells{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .map-cells-pair{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .map-pair-row{
    display:flex;
    gap:2px;
  }
  .map-aisle-gap{
    height:7px;
  }
  .map-cell{
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:8.5px;
    font-family:"SFMono-Regular",Consolas,monospace;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:3px;
    color:#8a8368;
    cursor:pointer;
    user-select:none;
  }
  .map-cell.blank{
    border-color:transparent;
    background:transparent;
    cursor:default;
  }
  .map-cell:hover{ border-color:var(--moss); }
  .map-cell.has-note{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
    font-weight:700;
  }
  .map-cell.visit-planned{
    background:#e0b12c;
    border-color:#e0b12c;
    color:#241b06;
    font-weight:700;
  }
  .map-cell.visit-visited{
    background:#4a8f3c;
    border-color:#4a8f3c;
    color:#eafce6;
    font-weight:700;
  }
  .map-cell.priority-1{ outline:2px solid #d64545; outline-offset:1px; }
  .map-cell.priority-2{ outline:2px solid #8b5fbf; outline-offset:1px; }
  .map-cell.priority-3{ outline:2px solid #3b82c4; outline-offset:1px; }
  .map-legend{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:12px;
    color:#5a5646;
    margin-bottom:14px;
  }
  .map-legend .swatch{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:3px;
    vertical-align:-1px;
    margin-right:5px;
  }
  .map-legend .swatch.normal{ background:var(--card-bg); border:1px solid var(--line); }
  .map-legend .swatch.note{ background:var(--clay); }

  /* 행사 안내 */
  .info-view{
    display:flex;
    flex-direction:column;
    gap:24px;
    max-width:720px;
  }
  .info-section h2{
    font-size:16px;
    margin:0 0 10px;
    color:var(--ink);
  }
  .venue-name{
    font-weight:700;
    font-size:15px;
  }
  .venue-address{
    color:#5a5646;
    font-size:12.5px;
    margin-bottom:12px;
  }
  .transit-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  .transit-table tr{
    border-bottom:1px solid var(--line);
  }
  .transit-table tr:last-child{
    border-bottom:none;
  }
  .transit-table td{
    padding:8px 6px;
    vertical-align:middle;
  }
  .transit-table td.mode{
    font-size:18px;
    width:28px;
    text-align:center;
  }
  .transit-table td.time{
    color:#5a5646;
    text-align:right;
    white-space:nowrap;
  }
  .info-map-wrap{
    position:relative;
    width:100%;
    padding-top:56%;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .info-map-wrap iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  .info-map-link{
    display:inline-block;
    margin-top:8px;
    font-size:12.5px;
    color:var(--moss);
  }
  .weather-cards{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    font-size:13px;
    color:#5a5646;
  }
  .weather-card{
    flex:1;
    min-width:100px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 10px;
    text-align:center;
  }
  .weather-time{
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .weather-icon{
    font-size:30px;
    line-height:1.2;
  }
  .weather-temp{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    margin-top:4px;
  }
  .weather-hum{
    font-size:12px;
    margin-top:2px;
  }
  .weather-empty{
    font-size:13px;
    color:#5a5646;
  }

  /* 모달 */
  .modal-backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,20,16,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--panel);
    color:var(--paper);
    border-radius:12px;
    padding:18px;
    width:340px;
    max-width:100%;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .modal.modal-wide{
    width:560px;
  }
  .modal .modal-close{
    float:right;
    background:none;
    border:none;
    color:var(--paper);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .confirm-dialog{
    width:320px;
  }
  .confirm-dialog p{
    margin:0 0 18px;
    line-height:1.6;
    font-size:13.5px;
    white-space:pre-line;
  }
  .confirm-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .confirm-actions button{
    appearance:none;
    border:1px solid rgba(255,255,255,.3);
    background:transparent;
    color:var(--paper);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .confirm-actions button:hover{background:rgba(255,255,255,.12);}
  .confirm-actions button.danger{
    background:#d64545;
    border-color:#d64545;
    color:#fff;
  }
  .confirm-actions button.danger:hover{background:#c23b3b;}

  footer{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px 50px;
    font-size:11.5px;
    color:#8a8368;
  }

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
    .popover{width:250px;}
    .popover::before{left:var(--arrow-left, 24px); transform:translateX(-50%) rotate(45deg);}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark" id="brandMark">けもケット ブース一覧</div>
      <div class="sub" id="brandSub">サークル配置ビューア</div>
    </div>
    <div class="settings-wrap" id="settingsWrap">
      <button type="button" class="header-btn" id="loginBtn"></button>
      <button type="button" class="header-btn" id="logoutBtn" style="display:none;"></button>
      <button type="button" class="settings-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
      <div class="settings-menu" id="settingsMenu">
        <div class="lang-switch" id="langSwitch">
          <button type="button" data-lang="ko">KO</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="jp">JP</button>
        </div>
        <div class="auth-status" id="authStatus" style="display:none;"></div>
        <button type="button" class="settings-item" id="syncNowBtn" disabled></button>
        <button type="button" class="settings-item" id="helpBtn"></button>
        <button type="button" class="settings-item danger" id="resetBtn"></button>
      </div>
    </div>
  </div>
  <nav class="rows" id="rowNav"></nav>
  <div class="second-row">
    <div class="tab-group" id="tabNav"></div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="サークル名 / 代表者名 / 配置番号 検索">
    </div>
  </div>
</header>

<main>
  <div class="row-heading">
    <div class="big-letter" id="currentLetter">A</div>
    <div class="count" id="currentCount"></div>
    <button type="button" class="sort-priority-btn" id="sortPriorityBtn" style="display:none;"></button>
  </div>
  <div class="notes-extra" id="notesExtra" style="display:none;">
    <div class="visit-filter" id="visitFilter">
      <button type="button" data-filter="all"></button>
      <button type="button" data-filter="planned"></button>
      <button type="button" data-filter="visited"></button>
    </div>
    <div class="budget-total" id="budgetTotal"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="map-grid" id="mapGrid" style="display:none;"></div>
  <div class="info-view" id="infoView" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">검색 결과가 없어요.</div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<div class="modal-backdrop" id="confirmBackdrop">
  <div class="modal confirm-dialog" id="confirmDialog">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button type="button" id="confirmCancelBtn"></button>
      <button type="button" class="danger" id="confirmOkBtn"></button>
    </div>
  </div>
</div>

<footer id="siteFooter"></footer>

const byRow = {};
ALL_ROWS.forEach(r => byRow[r] = []);
BOOTHS.forEach(b => { if(byRow[b.block]) byRow[b.block].push(b); });

const CURRENT_ROW_KEY = "kemoket-current-row";
const VALID_ROWS = new Set([...ALL_ROWS, "ALL", "NOTES", "MAP1", "MAP2", "INFO"]);
let savedRow = null;
try { savedRow = localStorage.getItem(CURRENT_ROW_KEY); } catch {}
let currentRow = (savedRow && VALID_ROWS.has(savedRow))
  ? savedRow
  : (ALL_ROWS.find(r => byRow[r].length > 0) || "A");

function goToRow(row){
  currentRow = row;
  try { localStorage.setItem(CURRENT_ROW_KEY, row); } catch {}
  renderNav();
  renderGrid();
}

/* ---------- 설정 메뉴(톱니바퀴) ----------
   position:fixed로 띄우고 버튼 위치를 기준으로 화면 안쪽에 들어오도록 좌표를 계산함
   (해상도가 좁아 버튼이 화면 가장자리에 가까울 때도 메뉴가 화면 밖으로 잘리지 않게 함).
------------------------------------------------- */
function positionSettingsMenu(){
  const btn = document.getElementById("settingsBtn");
  const menu = document.getElementById("settingsMenu");
  const margin = 10;
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;
  const btnRect = btn.getBoundingClientRect();
  const menuWidth = menu.offsetWidth;
  const menuHeight = menu.offsetHeight;

  let left = btnRect.right - menuWidth;
  left = Math.max(margin, Math.min(left, viewportWidth - menuWidth - margin));

  let top = btnRect.bottom + 8;
  if(top + menuHeight + margin > viewportHeight){
    top = Math.max(margin, btnRect.top - menuHeight - 8);
  }

  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

function closeSettingsMenu(){
  document.getElementById("settingsMenu").classList.remove("open");
}

document.getElementById("settingsBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const menu = document.getElementById("settingsMenu");
  const willOpen = !menu.classList.contains("open");
  if(willOpen){
    menu.classList.add("open");
    positionSettingsMenu();
  } else {
    closeSettingsMenu();
  }
});
document.getElementById("settingsMenu").addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", () => closeSettingsMenu());
window.addEventListener("resize", () => {
  if(document.getElementById("settingsMenu").classList.contains("open")){
    positionSettingsMenu();
  }
});

function mergeField(local, cloud){
  // 같은 부스에 로컬/클라우드 값이 둘 다 있으면 로컬을 우선(현재 기기에서 방금 한 작업을 덮어쓰지 않기 위함)
  return Object.assign({}, cloud || {}, local || {});
}

function pushToCloud(uid){
  return firebase.firestore().collection("users").doc(uid).set({
    notes, visitStatus, budgets, priority,
    updatedAt: new Date().toISOString(),
  });
}

function pullAndMergeFromCloud(uid){
  return firebase.firestore().collection("users").doc(uid).get().then((doc) => {
    const cloud = doc.exists ? doc.data() : {};
    notes = mergeField(notes, cloud.notes);
    visitStatus = mergeField(visitStatus, cloud.visitStatus);
    budgets = mergeField(budgets, cloud.budgets);
    priority = mergeField(priority, cloud.priority);
    saveNotes();
    saveVisitStatus();
    saveBudgets();
    savePriority();
    renderNav();
    renderGrid();
    updateBudgetTotalDisplay();
  });
}

  // 로그인 시 1회만 자동으로 병합 + 재업로드함(그 외에는 "지금 동기화" 버튼을 눌러야만 동기화됨.
  // Firestore 무료 플랜의 일일 읽기/쓰기 쿼터를 아끼기 위해 편집할 때마다 자동으로 올리지 않음).
  pullAndMergeFromCloud(uid).then(() => pushToCloud(uid)).catch(() => {
    // 오프라인 등으로 실패해도 로컬 데이터로 계속 사용 가능
  });
}

/* ---------- "지금 동기화" 버튼 ----------
   자동 동기화 대신 사용자가 직접 누를 때만 클라우드와 주고받도록 함.
   연타로 무료 플랜 일일 쿼터를 낭비하지 않도록 클릭 후 일정 시간 버튼을 잠금.
------------------------------------------------ */
const SYNC_COOLDOWN_SECONDS = 10;
let syncCooldownUntil = 0;
let syncCooldownTimer = null;

function startSyncCooldown(){
  const btn = document.getElementById("syncNowBtn");
  if(!btn) return;
  syncCooldownUntil = Date.now() + SYNC_COOLDOWN_SECONDS * 1000;
  btn.disabled = true;
  clearInterval(syncCooldownTimer);
  const tick = () => {
    const remaining = Math.ceil((syncCooldownUntil - Date.now()) / 1000);
    if(remaining <= 0){
      clearInterval(syncCooldownTimer);
      btn.disabled = !currentUser;
      btn.textContent = t("syncNowBtn");
      return;
    }
    btn.textContent = t("syncNowCooldown", { s: remaining });
  };
  tick();
  syncCooldownTimer = setInterval(tick, 1000);
}

function syncNow(){
  if(!firebaseReady || !currentUser) return;
  if(Date.now() < syncCooldownUntil) return;
  startSyncCooldown();
  pullAndMergeFromCloud(currentUser.uid)
    .then(() => pushToCloud(currentUser.uid))
    .then(() => alert(t("syncSuccess")))
    .catch(() => alert(t("syncFail")));
}

    if(err && (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request")) return;
    alert(t("loginFail", { code: (err && err.code) || "unknown" }));
  });
}

function signOutUser(){

  firebase.auth().signOut();
}

    updateAuthUI();
    if(user) syncFromCloudOnLogin(user.uid);

}

let confirmResolve = null;

function showConfirmDialog(message, okLabel){
  return new Promise((resolve) => {
    confirmResolve = resolve;
    document.getElementById("confirmMessage").textContent = message;
    document.getElementById("confirmOkBtn").textContent = okLabel;
    document.getElementById("confirmCancelBtn").textContent = t("cancel");
    document.getElementById("confirmBackdrop").classList.add("open");
    document.getElementById("confirmCancelBtn").focus();
  });
}

function closeConfirmDialog(result){
  document.getElementById("confirmBackdrop").classList.remove("open");
  if(confirmResolve){
    confirmResolve(result);
    confirmResolve = null;
  }
}

document.getElementById("confirmOkBtn").addEventListener("click", () => closeConfirmDialog(true));
document.getElementById("confirmCancelBtn").addEventListener("click", () => closeConfirmDialog(false));
document.getElementById("confirmBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "confirmBackdrop") closeConfirmDialog(false);
});

   메모/방문상태/예산/우선순위를 전부 삭제함(로그인 중이면 클라우드에도 반영됨).
------------------------------------------------- */
async function resetAllData(){
  if(!Object.keys(notes).length && !Object.keys(visitStatus).length && !Object.keys(budgets).length && !Object.keys(priority).length){
    return;
  }
  const confirmed = await showConfirmDialog(t("resetConfirm"), t("delete"));
  if(!confirmed) return;

  notes = {};
  visitStatus = {};
  budgets = {};
  priority = {};
  saveNotes();
  saveVisitStatus();
  saveBudgets();
  savePriority();
  renderNav();
  renderGrid();
  alert(t("resetDone"));
}

function ensureTwitterWidgets(cb){
  if(window.twttr && window.twttr.widgets){ cb(); return; }
  if(widgetsLoaded){ setTimeout(()=>cb(), 300); return; }
  widgetsLoaded = true;
  const s = document.createElement("script");
  s.src = "https://platform.twitter.com/widgets.js";
  s.async = true;
  s.onload = cb;
  document.body.appendChild(s);
}

function localAvatarUrl(handle){
  // 직접 크롤링/API로 저장해둔 프로필 사진 경로.
  // avatars/ 폴더에 X 핸들명.jpg 로 저장해두면 이 경로로 그대로 표시됨.
  // 파일이 없으면 img.onerror에서 서클명 첫 글자 placeholder로 대체됨.
  return `avatars/${handle}.jpg`;
}

  const priorityBox = document.createElement("div");

    btn.addEventListener("click", () => {

  const budgetBox = document.createElement("div");

    <label>${escapeHtml(t("budgetLabel"))}</label>

      <span class="yen">¥</span>
      <input type="number" min="0" step="100" inputmode="numeric" value="${getBudget(booth.id) || ""}" placeholder="0">
    </div>
  `;
  const budgetInput = budgetBox.querySelector("input");
  budgetBox.addEventListener("click", (e) => e.stopPropagation());
  budgetInput.addEventListener("input", () => {
    setBudget(booth.id, budgetInput.value);
    updateBudgetTotalDisplay();
  });
  pop.appendChild(budgetBox);

  const memoBox = document.createElement("div");
  memoBox.className = "memo-box";
  memoBox.innerHTML = `
    <label>${escapeHtml(t("memoLabel"))}</label>
    <textarea maxlength="1000" placeholder="${escapeHtml(t("memoPlaceholder"))}">${escapeHtml(getNote(booth.id))}</textarea>
    <div class="memo-actions">
      <button type="button" class="save">${escapeHtml(t("save"))}</button>
      <button type="button" class="delete">${escapeHtml(t("delete"))}</button>
      <span class="memo-status"></span>

/* ---------- 팝오버 위치 보정 ----------
   화면 폭이 애매해서 카드가 왼쪽/오른쪽 가장자리에 있을 때, 가운데 정렬된
   팝오버가 화면 밖으로 잘려나가지 않도록 뷰포트 안쪽으로 위치를 조정함.
   세로 공간이 부족하면 카드 위 대신 아래로 펼침.
------------------------------------------------- */
function positionPopover(card, pop){
  const margin = 10;
  pop.style.left = "";
  pop.style.transform = "";
  pop.style.removeProperty("--arrow-left");
  pop.classList.remove("below");

  // innerWidth/innerHeight can include scrollbar gutters that aren't actually
  // visible content area, so use clientWidth/clientHeight for the real bounds.
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;

  const cardRect = card.getBoundingClientRect();
  const popWidth = pop.offsetWidth;
  const popHeight = pop.offsetHeight;
  const cardCenter = cardRect.left + cardRect.width / 2;

  if(cardRect.top < popHeight + margin * 2 && (viewportHeight - cardRect.bottom) > cardRect.top){
    pop.classList.add("below");
  }

  const desired = cardCenter - popWidth / 2;
  const minLeft = margin - cardRect.left;
  const maxLeft = viewportWidth - margin - popWidth - cardRect.left;
  const left = Math.max(minLeft, Math.min(desired - cardRect.left, maxLeft));

  pop.style.left = `${left}px`;
  pop.style.transform = "none";
  pop.style.setProperty("--arrow-left", `${cardCenter - cardRect.left - left}px`);
}

window.addEventListener("resize", () => {
  document.querySelectorAll(".booth.show-pop").forEach(card => {
    const pop = card.querySelector(".popover");
    if(pop) positionPopover(card, pop);
  });
});

function loadTimelineInto(slot, handle){
  ensureTwitterWidgets(() => {
    slot.innerHTML = "";
    const container = document.createElement("div");
    slot.appendChild(container);
    window.twttr.widgets.createTimeline(
      { sourceType: "profile", screenName: handle },
      container,
      { tweetLimit: 1, theme: "dark", dnt: true, chrome: "noheader nofooter noborders transparent" }
    ).catch(() => {
      slot.innerHTML = `<div class="placeholder">${escapeHtml(t("tweetLoadFail"))}</div>`;
    });
  });
}

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderGrid(){
  const grid = document.getElementById("grid");
  const mapGrid = document.getElementById("mapGrid");
  const infoView = document.getElementById("infoView");
  const emptyState = document.getElementById("emptyState");

  const isMapView = currentRow === "MAP1" || currentRow === "MAP2";
  const isInfoView = currentRow === "INFO";
  grid.style.display = (isMapView || isInfoView) ? "none" : "";
  mapGrid.style.display = isMapView ? "flex" : "none";
  infoView.style.display = isInfoView ? "block" : "none";
  emptyState.style.display = "none";

  if(isInfoView){
    document.getElementById("currentLetter").textContent = "🎪";
    document.getElementById("currentCount").textContent = t("infoHint");
    document.getElementById("notesExtra").style.display = "none";
    document.getElementById("sortPriorityBtn").style.display = "none";
    renderInfoView();
    return;
  }

  if(isMapView){
    document.getElementById("currentLetter").textContent = "🗺️";
    document.getElementById("currentCount").textContent = currentRow === "MAP1"
      ? `展示室A・B — ${t("mapHint")}`
      : `展示室C・D — ${t("mapHint")}`;
    document.getElementById("notesExtra").style.display = "none";
    document.getElementById("sortPriorityBtn").style.display = "none";
    renderMapView(currentRow);
    return;
  }

  grid.innerHTML = "";
  document.getElementById("sortPriorityBtn").style.display = "";
  document.getElementById("sortPriorityBtn").classList.toggle("active", sortByPriority);

  const isNotesView = currentRow === "NOTES";
  const isAllView = currentRow === "ALL";
  document.getElementById("currentLetter").textContent = isNotesView ? "📝" : isAllView ? "📋" : currentRow;
  document.getElementById("notesExtra").style.display = isNotesView ? "flex" : "none";
  updateBudgetTotalDisplay();

  let list;
  if(isNotesView){
    const trackedIds = new Set([
      ...Object.keys(notes),
      ...Object.keys(visitStatus),
      ...Object.keys(budgets),
      ...Object.keys(priority),
    ]);
    list = BOOTHS.filter(b => trackedIds.has(b.id));
    if(notesVisitFilter !== "all"){
      list = list.filter(b => getVisitStatus(b.id) === notesVisitFilter);
    }
    document.querySelectorAll("#visitFilter button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.filter === notesVisitFilter);
    });
  } else if(isAllView){
    list = BOOTHS;
  } else {
    list = byRow[currentRow] || [];
  }

  if(currentQuery){
    const q = currentQuery.toLowerCase();
    list = list.filter(b =>
      b.name.toLowerCase().includes(q) ||
      b.rep.toLowerCase().includes(q) ||
      b.id.toLowerCase().includes(q) ||
      (b.twitter||"").toLowerCase().includes(q)
    );
  }

  if(sortByPriority){
    // Array#sort는 안정 정렬이라, 같은 우선순위(혹은 둘 다 없음)끼리는 원래 순서가 유지됨
    list = list.slice().sort((a, b) => (getPriority(a.id) || 4) - (getPriority(b.id) || 4));
  }

  document.getElementById("currentCount").textContent = isNotesView
    ? t("notesCount", { n: list.length })
    : t("circleCount", { n: list.length });
  document.getElementById("emptyState").style.display = list.length ? "none" : "block";
  document.getElementById("emptyState").textContent = isNotesView
    ? t("emptyNotes")
    : t("emptyDefault");

  list.forEach(booth => {
    const card = document.createElement("div");
    const visitCls = getVisitStatus(booth.id) === "planned" ? " visit-planned"
      : getVisitStatus(booth.id) === "visited" ? " visit-visited" : "";
    const priorityCls = getPriority(booth.id) ? ` priority-${getPriority(booth.id)}` : "";
    card.className = "booth" + (booth.twitter ? "" : " no-tw") + (getNote(booth.id) ? " has-note" : "") + visitCls + priorityCls;
    card.dataset.boothId = booth.id;

    const memoFlag = document.createElement("div");
    memoFlag.className = "memo-flag";
    memoFlag.textContent = "📝";
    card.appendChild(memoFlag);

    const badge = document.createElement("div");
    badge.className = "no-tw-badge";
    card.appendChild(badge);

    const idEl = document.createElement("div");
    idEl.className = "id";
    idEl.textContent = booth.id;
    card.appendChild(idEl);

    const avatarWrap = document.createElement("div");
    avatarWrap.className = "avatar-wrap";
    if(booth.twitter){
      // 프로필 사진을 클릭하면 팝오버를 열지 않고 바로 X 프로필로 이동 (모든 탭 공통)
      avatarWrap.classList.add("avatar-link");
      avatarWrap.title = t("openProfile");
      avatarWrap.addEventListener("click", (e) => {
        e.stopPropagation();
        window.open(`https://x.com/${booth.twitter}`, "_blank", "noopener");
      });
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = localAvatarUrl(booth.twitter);
      img.alt = booth.name;
      img.onerror = () => {
        // 로컬에 저장된 이미지 파일이 없으면 서클명 첫 글자로 대체
        avatarWrap.innerHTML = "";
        const fb = document.createElement("div");
        fb.className = "fallback";
        fb.textContent = (booth.name[0] || "?");
        avatarWrap.appendChild(fb);
      };
      avatarWrap.appendChild(img);
    } else {
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = (booth.name[0] || "?");
      avatarWrap.appendChild(fb);
    }
    card.appendChild(avatarWrap);

    const nameEl = document.createElement("div");
    nameEl.className = "circle-name";
    nameEl.textContent = booth.name;
    card.appendChild(nameEl);

    const repEl = document.createElement("div");
    repEl.className = "rep-name";
    repEl.textContent = booth.rep;
    card.appendChild(repEl);

    const { pop, slot } = makePopover(booth);
    card.appendChild(pop);

    let timelineLoaded = false;
    const open = () => {
      // 새 부스 팝오버를 열 때는 열려 있던 다른 팝오버를 먼저 닫음(동시에 하나만 열림).
      closeAllPopovers(card);
      card.classList.add("show-pop");
      positionPopover(card, pop);
      if(booth.twitter && !timelineLoaded){
        timelineLoaded = true;
        loadTimelineInto(slot, booth.twitter);
      }
    };
    // 스크롤로 화면을 벗어나 자동으로 닫힐 때는 작성 중인 메모 초안을 유지함(다시 열면 그대로 남아있음).
    const closeSoft = () => card.classList.remove("show-pop");
    // 사용자가 직접 닫을 때(카드 재클릭, 바깥 클릭)는 저장하지 않은 메모 초안을 버림.
    const close = () => {
      closeSoft();
      const textarea = pop.querySelector(".memo-box textarea");
      if(textarea) textarea.value = getNote(booth.id);
    };

    // 클릭(탭)으로 토글: PC/모바일 공통
    card.addEventListener("click", (e) => {
      e.stopPropagation();
      card.classList.contains("show-pop") ? close() : open();
    });

    grid.appendChild(card);
  });
}

// 열려 있는 모든 부스 팝오버를 닫음. exceptCard를 지정하면 해당 카드는 건너뜀
// (새 팝오버를 열기 직전에 다른 팝오버들만 닫을 때 사용).
function closeAllPopovers(exceptCard){
  document.querySelectorAll(".booth.show-pop").forEach(el => {
    if(el === exceptCard) return;
    el.classList.remove("show-pop");
    const textarea = el.querySelector(".memo-box textarea");
    if(textarea) textarea.value = getNote(el.dataset.boothId);
  });
}

document.addEventListener("click", () => {
  closeAllPopovers();
});

// 스크롤로 부스 카드가 화면 밖으로 벗어나면 팝오버를 자동으로 닫음(메모 초안은 유지).
let scrollCloseQueued = false;
window.addEventListener("scroll", () => {
  if(scrollCloseQueued) return;
  scrollCloseQueued = true;
  requestAnimationFrame(() => {
    scrollCloseQueued = false;
    const viewportHeight = document.documentElement.clientHeight;
    document.querySelectorAll(".booth.show-pop").forEach(card => {
      const rect = card.getBoundingClientRect();
      if(rect.bottom < 0 || rect.top > viewportHeight){
        card.classList.remove("show-pop");
      }
    });
  });
}, { passive: true });

document.getElementById("searchInput").addEventListener("input", (e) => {

  renderGrid();
});

/* ---------- 배치도(스키매틱 맵) ----------
   실제 회장 전체도(첨부 이미지) 두 장을 기준으로 페이지를 나눔:
   - 배치도1 = 展示室A・B (C,B,S,R,Q,P,O,N,M열)
   - 배치도2 = 展示室C・D (L,K,J,I,H,G,F,E,D,A열)
   각 열은 사진처럼 "왼쪽은 큰 번호부터 내려오고 오른쪽은 1번부터 올라오는"
   두 줄 마주보기 구조 + 4개마다 통로 틈으로 표현함(정확한 픽셀 좌표는 아니고
   사진 속 형태를 본뜬 스키매틱임).
------------------------------------------------------------- */
const MAP_PAGE_1 = ["C","B","S","R","Q","P","O","N","M"];     // 展示室A・B
const MAP_PAGE_2 = ["L","K","J","I","H","G","F","E","D","A"]; // 展示室C・D

function buildPairedColumn(list){
  const n = list.length;
  const half = Math.ceil(n / 2);
  const rightAsc = list.slice(0, half);           // 1 ~ half (오름차순, 오른쪽 줄)
  const leftDesc = list.slice(half).reverse();     // n ~ half+1 (내림차순, 왼쪽 줄)
  const rowCount = Math.max(leftDesc.length, rightAsc.length);

  const wrap = document.createElement("div");
  wrap.className = "map-cells-pair";

  const makeCell = (booth) => {
    if(!booth){
      const blank = document.createElement("div");
      blank.className = "map-cell blank";
      return blank;
    }
    const num = booth.id.split("-")[1];
    const cell = document.createElement("div");
    const visitCls = getVisitStatus(booth.id) === "planned" ? " visit-planned"
      : getVisitStatus(booth.id) === "visited" ? " visit-visited" : "";
    const priorityCls = getPriority(booth.id) ? ` priority-${getPriority(booth.id)}` : "";
    cell.className = "map-cell" + (getNote(booth.id) ? " has-note" : "") + visitCls + priorityCls;
    cell.dataset.boothId = booth.id;
    cell.textContent = num;
    cell.title = `${booth.id} ${booth.name}`;
    cell.addEventListener("click", () => openBoothModal(booth.id));
    return cell;
  };

  for(let i = 0; i < rowCount; i++){
    if(i > 0 && i % 4 === 0){
      const gap = document.createElement("div");
      gap.className = "map-aisle-gap";
      wrap.appendChild(gap);
    }
    const rowEl = document.createElement("div");
    rowEl.className = "map-pair-row";
    rowEl.appendChild(makeCell(leftDesc[i]));
    rowEl.appendChild(makeCell(rightAsc[i]));
    wrap.appendChild(rowEl);
  }

  return wrap;
}

function renderMapView(page){
  const mapGrid = document.getElementById("mapGrid");
  mapGrid.innerHTML = "";

  const order = page === "MAP2" ? MAP_PAGE_2 : MAP_PAGE_1;

  order.forEach(r => {
    const list = byRow[r];
    if(!list || !list.length) return;

    const col = document.createElement("div");
    col.className = "map-col";

    const label = document.createElement("div");
    label.className = "map-col-label";
    label.textContent = r;
    col.appendChild(label);

    col.appendChild(buildPairedColumn(list));
    mapGrid.appendChild(col);
  });

  if(!mapGrid.querySelector(".map-col")){
    mapGrid.innerHTML = `<div class="empty-state" style="display:block;">${escapeHtml(t("noBoothData"))}</div>`;
  }
}

/* ---------- 행사 안내 (약도 · 교통편 · 날씨) ----------
   날씨는 Open-Meteo(API 키 불필요)에서 행사 당일 예보를 그때그때 받아와 표시함.
   예보는 대략 행사 2주 전부터 제공되므로, 그 전에는 안내 문구만 보여줌.
------------------------------------------------- */
const EVENT_DATE = "2026-09-20";
const VENUE_LAT = 35.5808129;
const VENUE_LON = 139.7481420;
const VENUE_NAME = "東京流通センター(TRC)";
const VENUE_ADDRESS = "東京都大田区平和島6-1-1";

const TRANSIT_ROUTES = [
  { mode: "🚝", from: { ko: "도쿄 모노레일 「流通センター」역", en: "Tokyo Monorail \"Ryutsu Center\" Sta.", jp: "東京モノレール「流通センター」駅" }, time: { ko: "도보 1분 (역 바로 앞)", en: "1 min walk (right by the station)", jp: "徒歩1分（駅前）" } },
  { mode: "🚝", from: { ko: "하마마쓰초역에서 모노레일", en: "Monorail from Hamamatsucho Sta.", jp: "浜松町駅からモノレール" }, time: { ko: "약 10분", en: "approx. 10 min", jp: "約10分" } },
  { mode: "🚝", from: { ko: "하네다공항에서 모노레일", en: "Monorail from Haneda Airport", jp: "羽田空港からモノレール" }, time: { ko: "약 5~11분", en: "approx. 5–11 min", jp: "約5〜11分" } },
  { mode: "🚌", from: { ko: "오모리역(JR)에서 버스", en: "Bus from Omori Sta. (JR)", jp: "大森駅（JR）からバス" }, time: { ko: "약 12분", en: "approx. 12 min", jp: "約12分" } },
  { mode: "🚌", from: { ko: "헤이와지마역(케이큐)에서 버스", en: "Bus from Heiwajima Sta. (Keikyu)", jp: "平和島駅（京急）からバス" }, time: { ko: "약 4분", en: "approx. 4 min", jp: "約4分" } },
];

function weatherIcon(code){
  if(code === 0) return "☀️";
  if(code === 1) return "🌤️";
  if(code === 2) return "⛅";
  if(code === 3) return "☁️";
  if(code === 45 || code === 48) return "🌫️";
  if([51,53,55,56,57].includes(code)) return "🌦️";
  if([61,63,65,66,67,80,81,82].includes(code)) return "🌧️";
  if([71,73,75,77,85,86].includes(code)) return "🌨️";
  if([95,96,99].includes(code)) return "⛈️";
  return "🌡️";
}

let weatherCache = null;
function fetchEventWeather(){
  if(weatherCache) return weatherCache;
  weatherCache = fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${VENUE_LAT}&longitude=${VENUE_LON}` +
    `&hourly=temperature_2m,relative_humidity_2m,weathercode&timezone=Asia%2FTokyo` +
    `&start_date=${EVENT_DATE}&end_date=${EVENT_DATE}`
  ).then((res) => {
    if(!res.ok) throw new Error("weather fetch failed");
    return res.json();
  });
  return weatherCache;
}

function renderInfoView(){
  const el = document.getElementById("infoView");
  el.innerHTML = `
    <section class="info-section">
      <h2>${escapeHtml(t("infoTransitTitle"))}</h2>
      <div class="venue-name">${escapeHtml(VENUE_NAME)}</div>
      <div class="venue-address">${escapeHtml(VENUE_ADDRESS)}</div>
      <table class="transit-table">
        ${TRANSIT_ROUTES.map(r => `
          <tr>
            <td class="mode">${r.mode}</td>
            <td>${escapeHtml(r.from[currentLang] || r.from.ko)}</td>
            <td class="time">${escapeHtml(r.time[currentLang] || r.time.ko)}</td>
          </tr>
        `).join("")}
      </table>
    </section>

    <section class="info-section">
      <h2>${escapeHtml(t("infoMapTitle"))}</h2>
      <div class="info-map-wrap">
        <iframe src="https://www.google.com/maps?q=${encodeURIComponent(VENUE_NAME)}&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <a class="info-map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(VENUE_NAME)}" target="_blank" rel="noopener">${escapeHtml(t("infoOpenMap"))}</a>
    </section>

    <section class="info-section">
      <h2>${escapeHtml(t("infoWeatherTitle"))}</h2>
      <div class="weather-cards" id="weatherCards">${escapeHtml(t("infoWeatherLoading"))}</div>
    </section>
  `;

  const weatherCards = document.getElementById("weatherCards");
  fetchEventWeather().then((data) => {
    const times = (data && data.hourly && data.hourly.time) || [];
    const temps = (data && data.hourly && data.hourly.temperature_2m) || [];
    const hums = (data && data.hourly && data.hourly.relative_humidity_2m) || [];
    const codes = (data && data.hourly && data.hourly.weathercode) || [];

    const cards = [9, 12, 15].map((hour) => {
      const idx = times.indexOf(`${EVENT_DATE}T${String(hour).padStart(2, "0")}:00`);
      if(idx === -1) return null;
      return { hour, temp: temps[idx], hum: hums[idx], code: codes[idx] };
    }).filter(Boolean);

    if(!cards.length){
      weatherCards.innerHTML = `<div class="weather-empty">${escapeHtml(t("infoWeatherUnavailable", { date: EVENT_DATE }))}</div>`;
      return;
    }

    weatherCards.innerHTML = cards.map((c) => `
      <div class="weather-card">
        <div class="weather-time">${String(c.hour).padStart(2, "0")}:00</div>
        <div class="weather-icon">${weatherIcon(c.code)}</div>
        <div class="weather-temp">${Math.round(c.temp)}°C</div>
        <div class="weather-hum">💧 ${Math.round(c.hum)}%</div>
      </div>
    `).join("");
  }).catch(() => {
    weatherCards.innerHTML = `<div class="weather-empty">${escapeHtml(t("infoWeatherError"))}</div>`;
  });
}

/* ---------- 부스 상세 모달 (배치도에서 부스를 눌렀을 때) ---------- */
function openBoothModal(boothId){
  const booth = BOOTHS.find(b => b.id === boothId);
  if(!booth) return;

  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";
  content.classList.remove("modal-wide");

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const head = document.createElement("div");
  head.className = "pop-head";
  head.style.marginTop = "6px";
  const img = document.createElement("img");
  if(booth.twitter){
    img.src = localAvatarUrl(booth.twitter);
    img.onerror = () => { img.style.visibility = "hidden"; };
    img.classList.add("avatar-link");
    img.title = t("openProfile");
    img.addEventListener("click", (e) => {
      e.stopPropagation();
      window.open(`https://x.com/${booth.twitter}`, "_blank", "noopener");
    });
  } else {
    img.style.visibility = "hidden";
  }
  const names = document.createElement("div");
  names.className = "names";
  names.innerHTML = `<div class="c-name">${escapeHtml(booth.name)}</div><div class="r-name">${escapeHtml(booth.rep)} ・ ${booth.id}</div>`;
  head.appendChild(img);
  head.appendChild(names);
  content.appendChild(head);

  const slot = document.createElement("div");
  slot.className = "tweet-slot";
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = booth.twitter ? t("tweetLoadHint") : t("noTwitterHint");
  slot.appendChild(ph);
  content.appendChild(slot);
  if(booth.twitter){
    loadTimelineInto(slot, booth.twitter);
  }

  const links = document.createElement("div");
  links.className = "pop-links";
  if(booth.twitter){
    links.innerHTML = `<a href="https://x.com/${booth.twitter}" target="_blank" rel="noopener">${escapeHtml(t("openProfile"))}</a>`;
  }
  content.appendChild(links);

  const visitBox = document.createElement("div");
  visitBox.className = "visit-box";
  visitBox.innerHTML = `
    <button type="button" class="visit-btn planned">${escapeHtml(t("visitPlanned"))}</button>
    <button type="button" class="visit-btn visited">${escapeHtml(t("visitVisited"))}</button>
  `;
  const plannedBtn = visitBox.querySelector(".planned");
  const visitedBtn = visitBox.querySelector(".visited");
  const syncVisitButtons = () => {
    const status = getVisitStatus(booth.id);
    plannedBtn.classList.toggle("active", status === "planned");
    visitedBtn.classList.toggle("active", status === "visited");
  };
  syncVisitButtons();
  const refreshVisitViews = () => {
    updateVisitVisuals(booth.id);
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
  };
  plannedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "planned" ? null : "planned");
    refreshVisitViews();
    syncVisitButtons();
  });
  visitedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "visited" ? null : "visited");
    refreshVisitViews();
    syncVisitButtons();
  });
  content.appendChild(visitBox);

  const priorityBox = document.createElement("div");
  priorityBox.className = "priority-box";
  priorityBox.innerHTML = `
    <button type="button" class="p1">${escapeHtml(t("priority1"))}</button>
    <button type="button" class="p2">${escapeHtml(t("priority2"))}</button>
    <button type="button" class="p3">${escapeHtml(t("priority3"))}</button>
  `;
  const p1Btn = priorityBox.querySelector(".p1");
  const p2Btn = priorityBox.querySelector(".p2");
  const p3Btn = priorityBox.querySelector(".p3");
  const syncPriorityButtons = () => {
    const level = getPriority(booth.id);
    p1Btn.classList.toggle("active", level === 1);
    p2Btn.classList.toggle("active", level === 2);
    p3Btn.classList.toggle("active", level === 3);
  };
  syncPriorityButtons();
  const refreshPriorityViews = () => {
    updatePriorityVisuals(booth.id);
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
  };
  [[p1Btn, 1], [p2Btn, 2], [p3Btn, 3]].forEach(([btn, level]) => {
    btn.addEventListener("click", () => {
      setPriority(booth.id, getPriority(booth.id) === level ? null : level);
      refreshPriorityViews();
      syncPriorityButtons();
    });
  });
  content.appendChild(priorityBox);

  const budgetBox = document.createElement("div");
  budgetBox.className = "budget-box";
  budgetBox.innerHTML = `
    <label>${escapeHtml(t("budgetLabel"))}</label>
    <div class="budget-input-row">
      <span class="yen">¥</span>
      <input type="number" min="0" step="100" inputmode="numeric" value="${getBudget(booth.id) || ""}" placeholder="0">
    </div>
  `;
  const budgetInput = budgetBox.querySelector("input");
  budgetInput.addEventListener("input", () => {
    setBudget(booth.id, budgetInput.value);
    updateBudgetTotalDisplay();
  });
  content.appendChild(budgetBox);

  const memoBox = document.createElement("div");
  memoBox.className = "memo-box";
  memoBox.innerHTML = `
    <label>${escapeHtml(t("memoLabel"))}</label>
    <textarea maxlength="1000" placeholder="${escapeHtml(t("memoPlaceholder"))}">${escapeHtml(getNote(booth.id))}</textarea>
    <div class="memo-actions">
      <button type="button" class="save">${escapeHtml(t("save"))}</button>
      <button type="button" class="delete">${escapeHtml(t("delete"))}</button>
      <span class="memo-status"></span>
    </div>
  `;
  const textarea = memoBox.querySelector("textarea");
  const saveBtn = memoBox.querySelector(".save");
  const deleteBtn = memoBox.querySelector(".delete");
  const status = memoBox.querySelector(".memo-status");

  saveBtn.addEventListener("click", () => {
    setNote(booth.id, textarea.value);
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("savedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });
  deleteBtn.addEventListener("click", () => {
    textarea.value = "";
    setNote(booth.id, "");
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP1" || currentRow === "MAP2") renderMapView(currentRow);
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("deletedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });

  content.appendChild(memoBox);

  backdrop.classList.add("open");
}

function openHelpModal(){
  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";
  content.classList.add("modal-wide");

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const title = document.createElement("h2");
  title.style.margin = "6px 0 14px";
  title.textContent = t("helpTitle");
  content.appendChild(title);

  const body = document.createElement("div");
  body.className = "help-body";
  const link = `<a href="https://skypalette.jp/kemoket/" target="_blank" rel="noopener">https://skypalette.jp/kemoket/</a>`;
  const paragraphs = (I18N[currentLang] && I18N[currentLang].helpBody) || I18N.ko.helpBody;
  body.innerHTML = paragraphs
    .map(line => `<p>${escapeHtml(line).replace("{link}", link).replace(/\n/g, "<br>")}</p>`)
    .join("");

  backdrop.classList.add("open");
}

}

});
