<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  default-src 'self';

  connect-src 'self' https://api.fxtwitter.com https://cdn.syndication.twimg.com https://syndication.twitter.com https://twitter.com https://x.com https://api.open-meteo.com https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com;
  frame-src https://platform.twitter.com https://syndication.twitter.com https://www.google.com https://accounts.google.com https://boothlist-4589c.firebaseapp.com;

">
<title>Furst Class 부스 목록</title>
<link rel="icon" type="image/png" href="favicon.png">
<script>
  // 테마(라이트/다크): 설정 메뉴에서 고른 값이 있으면 그걸, 없으면 브라우저(OS) 다크 모드 설정을 따름.
  // 화면이 그려지기 전에 정해야 다크 모드에서 밝은 화면이 잠깐 번쩍이지 않음.
  (function(){
    var saved = null;
    try { saved = localStorage.getItem("furstclass-theme"); } catch (e) {}
    var dark = saved === "dark" || (saved !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
  /* 테마: 라이트(모던 미니멀)가 기본, 다크(카지노 나이트)는 html[data-theme="dark"]일 때.
     data-theme은 <head>의 작은 스크립트가 저장된 설정 또는 브라우저 다크 모드 여부로 정함.
     상단바·부스 카드처럼 테마마다 모양이 다른 곳은 모두 아래 변수로만 바뀜. */
  :root{
    color-scheme:light;
    --paper:#f6f4f3;      /* 페이지 배경: 따뜻한 오프화이트 */
    --page-glow:none;     /* 페이지 상단 은은한 빛(다크에서만) */
    --ink:#1d1a1c;        /* 본문 글자 */
    --text-2:#6b6265;     /* 보조 글자 */
    --muted:#8a8285;      /* 흐린 글자 */
    --line:#e7e2e1;
    --card-bg:#ffffff;
    --hover-tint:#f3efee; /* 밝은 버튼 마우스 오버 */
    --moss:#c8102e;       /* 주 강조색: Furst Class 로고 크림슨 */
    --clay:#c8102e;       /* 메모 표시 */
    --accent:#c8102e;     /* 저장 버튼 등 */
    --display-font:inherit; /* 사이트 제목·열 글자 글꼴 */

    /* 상단바 */
    --header-bg:rgba(255,255,255,.88);
    --header-fg:#1d1a1c;
    --header-sub:#8a8285;
    --header-border:1px solid #e7e2e1;
    --chip-bg:#f0ecea;            /* 열·탭 버튼 */
    --chip-border:transparent;
    --chip-hover:#e6e0de;
    --chip-active-bg:#1d1a1c;
    --chip-active-fg:#ffffff;
    --chip-active-glow:none;
    --chip-radius:10px;
    --search-bg:#f0ecea;
    --search-border:transparent;
    --search-ph:#9c9396;

    /* 부스 카드 */
    --card-border:transparent;
    --card-border-hover:transparent;
    --card-radius:16px;
    --card-shadow:0 1px 2px rgba(29,26,28,.06), 0 4px 14px rgba(29,26,28,.05);
    --card-shadow-hover:0 2px 4px rgba(29,26,28,.06), 0 14px 28px rgba(29,26,28,.12);
    --id-color:#1d1a1c;
    --id-bg:#f3efee;
    --big-letter:#1d1a1c;
    --heading-rule:transparent;
    --pill-active-bg:#1d1a1c;     /* 우선순위 정렬·방문 필터 켜짐 */
    --pill-active-fg:#ffffff;
    --note-bg:#fff0f2;
    --planned-bg:#fff6d1;
    --visited-bg:#e3f3df;

    /* 팝오버·모달·설정 메뉴(두 테마 모두 어두운 패널) */
    --panel:#1d1a1c;
    --panel-2:#2c2729;
    --panel-border:transparent;
    --on-panel:#f4eef0;   /* 패널 위 글자 */
    --moss-light:#f2a0ad; /* 패널 위 보조 글자: 연핑크 */

    /* 배치도 */
    --map-wall:#c8102e;        /* 홀 벽 */
    --map-room-line:#1d1a1c;   /* 탈의실 칸 */
    --map-zone-a:#ecebeb;      /* A구역 바닥 */
    --map-zone-bc:#fbe8ea;     /* B·C구역 바닥 */
    --map-booth-a:#1d1a1c;     /* A구역 부스 테두리·글자 */
    --map-booth-bc:#c8102e;    /* B·C구역 부스 테두리·글자 */
    --map-stage:#1d1a1c;
    --map-stage-fg:#ffffff;
    --map-arrow:#f2a0ad;       /* 출입구 화살표 */
    --map-pill-dark:#1d1a1c;   /* 주성홀 이름표 */
    --map-pill-fg:#ffffff;
    --map-planned:#e0b12c;
    --map-planned-fg:#241b06;
    --map-visited:#4a8f3c;
    --map-visited-fg:#eafce6;
    --map-prio-1:#d64545;
    --map-prio-2:#8b5fbf;
    --map-prio-3:#3b82c4;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#121013;
    --page-glow:radial-gradient(1200px 500px at 50% -100px, #2a1219 0%, transparent 70%);
    --ink:#f2e8ea;
    --text-2:#b3a3aa;
    --muted:#9a8890;
    --line:#2e252c;
    --card-bg:#1b161a;
    --hover-tint:#2a2027;
    --moss:#e0344f;
    --clay:#e0344f;
    --accent:#e0344f;
    --display-font:Georgia,"Times New Roman","Noto Serif KR",serif;

    --header-bg:linear-gradient(180deg,#0a080a,#140d11);
    --header-fg:#f2e8ea;
    --header-sub:#d6b46a;
    --header-border:1px solid rgba(214,180,106,.45);
    --chip-bg:transparent;
    --chip-border:rgba(214,180,106,.3);
    --chip-hover:rgba(255,255,255,.08);
    --chip-active-bg:#e0344f;
    --chip-active-fg:#ffffff;
    --chip-active-glow:0 0 18px rgba(224,52,79,.45);
    --chip-radius:999px;
    --search-bg:rgba(255,255,255,.05);
    --search-border:rgba(214,180,106,.3);
    --search-ph:#b3a3aa;

    --card-border:#2e252c;
    --card-border-hover:#d6b46a;
    --card-radius:12px;
    --card-shadow:none;
    --card-shadow-hover:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(214,180,106,.4);
    --id-color:#d6b46a;
    --id-bg:transparent;
    --big-letter:#d6b46a;
    --heading-rule:rgba(214,180,106,.35);
    --pill-active-bg:#e0344f;
    --pill-active-fg:#ffffff;
    --note-bg:#2a1820;
    --planned-bg:#2a2414;
    --visited-bg:#172417;

    --panel:#0d0a0c;
    --panel-2:#221b21;
    --panel-border:rgba(214,180,106,.3);
    --on-panel:#f2e8ea;
    --moss-light:#e8c98a; /* 패널 위 보조 글자: 골드 */

    --map-wall:#e0344f;
    --map-room-line:#b3a3aa;
    --map-zone-a:#211b20;
    --map-zone-bc:#2a1820;
    --map-booth-a:#e8dfe2;
    --map-booth-bc:#ff5a73;
    --map-stage:#2e252c;
    --map-stage-fg:#f2e8ea;
    --map-arrow:#e8899a;
    --map-pill-dark:#2e252c;
    --map-pill-fg:#f2e8ea;
    --map-planned:#e0b12c;
    --map-planned-fg:#241b06;
    --map-visited:#4a8f3c;
    --map-visited-fg:#eafce6;
    --map-prio-1:#d64545;
    --map-prio-2:#a77fdc;
    --map-prio-3:#5aa0e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-glow), var(--paper);
    background-color:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
  }

  /* 스크롤바를 사이트 테마 색상에 맞춤 */
  html{
    scrollbar-color:var(--panel-2) var(--paper);
    scrollbar-width:thin;
  }
  ::-webkit-scrollbar{
    width:12px;
    height:12px;
  }
  ::-webkit-scrollbar-track{
    background:var(--paper);
  }
  ::-webkit-scrollbar-thumb{
    background:var(--panel-2);
    border-radius:8px;
    border:3px solid var(--paper);
  }
  ::-webkit-scrollbar-thumb:hover{
    background:var(--panel);
  }
  .modal{
    scrollbar-color:rgba(255,255,255,.35) transparent;
  }
  .modal::-webkit-scrollbar-track{
    background:transparent;
  }
  .modal::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.3);
    border:3px solid var(--panel);
  }
  .modal::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.5);
  }

  header.top{
    background:var(--header-bg);
    color:var(--header-fg);
    padding:18px 20px 14px;
    border-bottom:var(--header-border);
    /* PC에서는 스크롤해도 상단바가 위에 붙어 있음(모바일은 화면을 많이 가려서 제외) */
    position:sticky;
    top:0;
    z-index:100;
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
  }
  @media (max-width:700px){
    header.top{ position:static; }
  }
  .top-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand .mark{
    font-family:var(--display-font);
    font-size:24px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .brand .mark::before{
    content:"";
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--accent);
    margin-right:10px;
    vertical-align:middle;
  }
  .brand .sub{
    font-size:12px;
    color:var(--header-sub);
    letter-spacing:.04em;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:var(--search-bg);
    border:1px solid var(--search-border);
    border-radius:var(--chip-radius);
    padding:6px 12px;
  }
  .search-box input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--header-fg);
    font-size:13px;
    width:180px;
  }
  .search-box input::placeholder{color:var(--search-ph);}

  .lang-switch{
    display:flex;
    gap:4px;
  }
  .lang-switch button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--on-panel);
    padding:5px 10px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s;
  }
  .lang-switch button:hover{background:rgba(255,255,255,.12);}
  .lang-switch button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  .settings-wrap{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--header-fg);
    padding:0 12px;
    height:34px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .header-btn:hover{background:var(--hover-tint);}
  .settings-btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--header-fg);
    width:34px;
    height:34px;
    border-radius:10px;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    transition:background .15s;
  }
  .settings-btn:hover{background:var(--hover-tint);}
  .settings-menu{
    display:none;
    position:fixed;
    z-index:50;
    width:190px;
    max-width:calc(100vw - 20px);
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .settings-menu.open{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .settings-menu .lang-switch{
    justify-content:flex-end;
  }
  .settings-item{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--on-panel);
    padding:7px 12px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    text-align:left;
    transition:background .15s;
  }
  .settings-item:hover{background:rgba(255,255,255,.12);}
  .settings-item:disabled{opacity:.5; cursor:default;}
  .settings-item:disabled:hover{background:transparent;}
  .settings-item.danger{
    border-color:rgba(214,69,69,.55);
    color:#ff9a9a;
  }
  .settings-item.danger:hover{background:rgba(214,69,69,.18);}
  .auth-status{
    font-size:11px;
    color:rgba(248,240,242,.75);
    padding:0 2px;
    word-break:break-all;
  }

  .help-body p{
    margin:0 0 12px;
    line-height:1.7;
  }
  .help-body p:last-child{margin-bottom:0;}
  .help-body a{color:inherit;}

  nav.rows{
    max-width:1180px;
    margin:0 auto;
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  nav.rows button{
    appearance:none;
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--header-fg);
    width:36px;
    height:36px;
    border-radius:var(--chip-radius);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  nav.rows button:hover{background:var(--chip-hover);}
  nav.rows button.active{
    background:var(--chip-active-bg);
    border-color:var(--chip-active-bg);
    color:var(--chip-active-fg);
    box-shadow:var(--chip-active-glow);
  }
  nav.rows button.empty{
    opacity:.35;
  }
  nav.rows button.memo-tab-btn{
    width:auto;
    padding:0 12px;
    font-size:13px;
    font-weight:700;
  }

  .second-row{
    max-width:1180px;
    margin:10px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .tab-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tab-group button{
    appearance:none;
    border:1px solid var(--chip-border);
    background:var(--chip-bg);
    color:var(--header-fg);
    padding:0 12px;
    height:36px;
    border-radius:var(--chip-radius);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .tab-group button:hover{background:var(--chip-hover);}
  .tab-group button.active{
    background:var(--chip-active-bg);
    border-color:var(--chip-active-bg);
    color:var(--chip-active-fg);
    box-shadow:var(--chip-active-glow);
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:26px 20px 80px;
  }

  .row-heading{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:20px;
    border-bottom:1px solid var(--heading-rule);
    padding-bottom:10px;
  }
  .row-heading .big-letter{
    font-family:var(--display-font);
    font-size:44px;
    font-weight:800;
    line-height:1;
    letter-spacing:-.03em;
    color:var(--big-letter);
  }
  .row-heading .count{
    font-size:13px;
    color:var(--text-2);
  }
  .sort-priority-btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    margin-left:auto;
    transition:background .15s, border-color .15s;
  }
  .sort-priority-btn:hover{background:var(--hover-tint);}
  .sort-priority-btn.active{
    background:var(--pill-active-bg);
    border-color:var(--pill-active-bg);
    color:var(--pill-active-fg);
  }
  .notes-extra{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin:-8px 0 18px;
  }
  .visit-filter{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .visit-filter button{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 12px;
    border-radius:999px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .visit-filter button:hover{background:var(--hover-tint);}
  .visit-filter button.active{
    background:var(--pill-active-bg);
    border-color:var(--pill-active-bg);
    color:var(--pill-active-fg);
  }
  .budget-total{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(136px,1fr));
    gap:16px;
  }

  .booth{
    position:relative;
    z-index:1;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:var(--card-radius);
    padding:10px 10px 14px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--card-shadow);
    transition:border-color .15s, box-shadow .15s, transform .12s;
  }
  .booth:hover{
    border-color:var(--card-border-hover);
    box-shadow:var(--card-shadow-hover);
    transform:translateY(-3px);
  }
  .booth .id{
    display:inline-block;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    font-weight:600;
    color:var(--id-color);
    background:var(--id-bg);
    border-radius:999px;
    padding:1px 8px;
    letter-spacing:.06em;
    margin-bottom:6px;
  }
  .cut-thumb{
    width:100%;
    aspect-ratio:3/4;
    margin:0 auto 8px;
    border-radius:10px;
    overflow:hidden;
    background:var(--panel-2);
  }
  .cut-thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .avatar-wrap{
    width:64px;
    height:64px;
    margin:0 auto 8px;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar-wrap.avatar-link{
    outline-offset:2px;
    transition:outline .12s;
  }
  .avatar-wrap.avatar-link:hover{
    outline:2px solid var(--moss);
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-wrap .fallback{
    color:var(--moss-light);
    font-size:20px;
    font-weight:700;
  }
  /* 부스명·대표 이름은 글자 중간이 아니라 띄어쓰기 단위로 줄바꿈 (띄어쓰기 없는 아주 긴 단어만 글자 단위로) */
  .circle-name, .rep-name, .pop-head .names, .modal .names{
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  .circle-name{

  /* 메모가 달린 부스 표시 */

  /* 팝오버 안의 메모 입력 영역 */

  /* 부스원 목록 (리더 + 부스원) */

  /* 방문 예정/완료 표시 버튼 */

  }

  /* 부스별 예산 입력 */

  .tweet-slot{

  .tweet-slot .placeholder{

  .tweet-slot iframe{border-radius:6px;}
  .booth-posts{ margin-top:10px; }
  .booth-posts-title{ font-size:13px; font-weight:700; margin-bottom:2px; }

  .official-feed{
    height:520px;
    overflow-y:auto;

  /* 배치도(공식 일요일 부스 안내를 SVG로 다시 그림) */
  .map-legend{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px 16px;
    font-size:12px;
    color:var(--text-2);
    margin-bottom:12px;
  }
  .map-legend .swatch{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:3px;
    vertical-align:-1px;
    margin-right:5px;
  }
  .map-legend .swatch.note{ background:var(--clay); }
  .map-legend .swatch.planned{ background:var(--map-planned); }
  .map-legend .swatch.visited{ background:var(--map-visited); }
  .map-legend .swatch.ring{ background:transparent; border:2px solid; margin-right:3px; }
  .map-legend .swatch.ring:last-of-type{ margin-right:5px; }
  .map-legend .swatch.p1{ border-color:var(--map-prio-1); }
  .map-legend .swatch.p2{ border-color:var(--map-prio-2); }
  .map-legend .swatch.p3{ border-color:var(--map-prio-3); }
  /* 좁은 화면에서는 글자가 너무 작아지지 않도록 최소 폭을 두고 가로 스크롤 */
  .venue-map-scroll{
    overflow-x:auto;
    padding-bottom:12px;
    -webkit-overflow-scrolling:touch;
  }
  .venue-map{
    display:block;
    width:100%;
    min-width:960px;
    height:auto;
    font-family:inherit;
  }
  /* 구역 하나만 볼 때: 화면 폭에 맞추되 너무 길어지지 않게 높이 제한 */
  .venue-map.zoomed{ min-width:0; width:auto; max-width:100%; height:min(68vh, 660px); margin:0 auto; }
  /* 휴대폰: 구역 하나도 글자가 읽히는 크기로(폭 520px 이상, 넘치면 옆으로 밀어서 봄) */
  @media (max-width:640px){
    .venue-map.zoomed{ width:100%; max-width:none; min-width:520px; height:auto; }
  }
  .map-zone-filter{ margin-bottom:12px; }
  .map-zone-filter button{ font-size:13px; padding:6px 16px; }
  .venue-map text{ text-anchor:middle; dominant-baseline:central; }
  .venue-map .map-wall{ fill:none; stroke:var(--map-wall); stroke-width:3; stroke-linejoin:round; }
  .venue-map .map-room{ fill:none; stroke:var(--map-room-line); stroke-width:3; }
  .venue-map .map-room-text{ fill:var(--ink); font-size:26px; font-weight:800; }
  .venue-map .map-zone.zone-a{ fill:var(--map-zone-a); }
  .venue-map .map-zone.zone-b, .venue-map .map-zone.zone-c{ fill:var(--map-zone-bc); }
  .venue-map .map-zone-text{ font-size:40px; font-weight:900; pointer-events:none; }
  .venue-map .map-zone-text.zone-a{ fill:var(--map-booth-a); }
  .venue-map .map-zone-text.zone-b, .venue-map .map-zone-text.zone-c{ fill:var(--map-booth-bc); }
  .venue-map .map-stage{ fill:var(--map-stage); }
  .venue-map .map-stage-text{ fill:var(--map-stage-fg); font-size:30px; font-weight:900; }
  .venue-map .map-arrow{ stroke:var(--map-arrow); stroke-width:7; stroke-linecap:round; }
  .venue-map .map-arrow-head{ fill:none; stroke:var(--map-arrow); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .venue-map .map-hall-label rect{ fill:var(--map-pill-dark); }
  .venue-map .map-hall-label.accent rect{ fill:var(--map-booth-bc); }
  .venue-map .map-hall-label text{ fill:var(--map-pill-fg); font-size:24px; font-weight:800; }
  /* 부스 칸: 기본은 구역 색 테두리, 메모·방문 상태·우선순위는 부스 탭 카드와 같은 의미의 색 */
  .venue-map .map-booth{ cursor:pointer; outline:none; }
  .venue-map .map-booth-box{ fill:var(--card-bg); stroke-width:2; }
  .venue-map .map-booth-ring{ fill:none; stroke:none; stroke-width:3; }
  .venue-map .map-booth-text{ font-size:15px; font-weight:800; pointer-events:none; }
  .venue-map .map-booth-split{ stroke-width:1.5; stroke-dasharray:3 3; pointer-events:none; }
  .venue-map .map-booth.zone-a .map-booth-box, .venue-map .map-booth.zone-a .map-booth-split{ stroke:var(--map-booth-a); }
  .venue-map .map-booth.zone-a .map-booth-text{ fill:var(--map-booth-a); }
  .venue-map .map-booth.zone-b .map-booth-box, .venue-map .map-booth.zone-c .map-booth-box,
  .venue-map .map-booth.zone-b .map-booth-split, .venue-map .map-booth.zone-c .map-booth-split{ stroke:var(--map-booth-bc); }
  .venue-map .map-booth.zone-b .map-booth-text, .venue-map .map-booth.zone-c .map-booth-text{ fill:var(--map-booth-bc); }
  .venue-map .map-booth:hover .map-booth-box, .venue-map .map-booth:focus-visible .map-booth-box{ stroke-width:4; }
  .venue-map .map-booth.has-note .map-booth-box{ fill:var(--clay); stroke:var(--clay); }
  .venue-map .map-booth.visit-planned .map-booth-box{ fill:var(--map-planned); stroke:var(--map-planned); }
  .venue-map .map-booth.visit-visited .map-booth-box{ fill:var(--map-visited); stroke:var(--map-visited); }
  .venue-map .map-booth.has-note .map-booth-text{ fill:#fff; }
  .venue-map .map-booth.visit-planned .map-booth-text{ fill:var(--map-planned-fg); }
  .venue-map .map-booth.visit-visited .map-booth-text{ fill:var(--map-visited-fg); }
  .venue-map .map-booth.has-note .map-booth-split,
  .venue-map .map-booth.visit-planned .map-booth-split,
  .venue-map .map-booth.visit-visited .map-booth-split{ stroke:rgba(255,255,255,.7); }
  .venue-map .map-booth.priority-1 .map-booth-ring{ stroke:var(--map-prio-1); }
  .venue-map .map-booth.priority-2 .map-booth-ring{ stroke:var(--map-prio-2); }
  .venue-map .map-booth.priority-3 .map-booth-ring{ stroke:var(--map-prio-3); }
  .venue-map .map-booth.empty{ cursor:default; }
  .venue-map .map-booth.empty .map-booth-box{ stroke:var(--line); stroke-dasharray:4 3; }
  .venue-map .map-booth.empty .map-booth-text{ fill:var(--muted); }

  /* 모달 */
  .modal-backdrop{

  .modal.booth-modal{

    line-height:1;

  .confirm-dialog{
    width:320px;
  }
  .confirm-dialog p{
    margin:0 0 18px;
    line-height:1.6;
    font-size:13.5px;
    white-space:pre-line;
  }
  .confirm-actions{

    gap:8px;
    justify-content:flex-end;
  }

    border:1px solid rgba(255,255,255,.3);
    background:transparent;
    color:var(--on-panel);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .confirm-actions button:hover{background:rgba(255,255,255,.12);}
  .confirm-actions button.danger{
    background:#d64545;
    border-color:#d64545;
    color:#fff;
  }
  .confirm-actions button.danger:hover{background:#c23b3b;}

  footer{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px 50px;
    font-size:11.5px;
    color:var(--muted);
  }

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
  }

  /* 모바일(좁은 화면이거나 손가락·펜으로 누른 경우)에서는 부스 상세 모달을 화면을 거의 채우는
     큰 창으로 띄움(JS의 useBoothModal()이 booth-modal-full 클래스를 붙임). 폴드처럼 펼치면 폭이 넓은
     기기도 손가락으로 누르면 이쪽으로 옴. 바깥 여백을 조금 남겨 두어 창 밖을 터치해 닫을 수 있게 함. */
  .modal-backdrop.booth-full{ padding:12px; }
  .modal.booth-modal.booth-modal-full{
    width:100%;
    max-width:720px;
    height:calc(100vh - 24px);
    height:calc(100dvh - 24px);
    max-height:none;
    padding:16px;
  }
  /* 부스컷은 스크롤하지 않아도 한 화면에 통째로 보이도록 화면 높이에 맞춰 크게 */
  .modal.booth-modal-full .booth-cut img{ max-height:62vh; max-height:62dvh; }
  /* 스크롤해도 닫기 버튼이 항상 보이도록 위쪽에 고정하고, 누르기 쉽게 키움(PC·모바일 공통) */
  .modal.booth-modal .modal-close{
    position:sticky;
    top:0;
    z-index:1;
    width:40px;
    height:40px;
    margin:-6px -6px 0 8px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--panel-border);
    font-size:20px;
  }
  /* 모달이 열려 있는 동안 뒤 페이지가 같이 스크롤되지 않게 함 */
  /* (body까지 막으면 body가 스크롤 기준이 되어 PC 상단바 sticky 고정이 풀리고 사라지므로 html에만 적용) */
  html.modal-open{ overflow:hidden; }
</style>

// 부스 번호 앞 글자(A, B, C ...)로 열을 나눔. 데이터에 있는 열만 탭으로 보여줌
const ALL_ROWS = [...new Set(BOOTHS.map(b => b.block))].sort();

const BOOTH_IDS = new Set(BOOTHS.map(b => b.id));
const byRow = {};
ALL_ROWS.forEach(r => byRow[r] = []);
BOOTHS.forEach(b => { if(byRow[b.block]) byRow[b.block].push(b); });

// 새로고침해도 보고 있던 탭(부스 열/전체/메모/배치도)이 유지되도록 저장해둠
// 브라우저(localStorage)에 저장하는 모든 키의 앞부분.
const STORAGE_PREFIX = "furstclass";

// 지난 행사(케모켓, 2026-09-20 종료) 때 이 브라우저에 저장된 "kemoket-*" 데이터는 더 이상
// 쓰지 않으므로 접속할 때 지움.
try {
  Object.keys(localStorage)
    .filter(key => key.startsWith("kemoket-"))
    .forEach(key => localStorage.removeItem(key));
} catch {}

const CURRENT_ROW_KEY = `${STORAGE_PREFIX}-current-row`;
const VALID_ROWS = new Set([...ALL_ROWS, "ALL", "NOTES", "MAP", "INFO"]);
let savedRow = null;
try { savedRow = localStorage.getItem(CURRENT_ROW_KEY); } catch {}
let currentRow = (savedRow && VALID_ROWS.has(savedRow))
  ? savedRow
  : (ALL_ROWS.find(r => byRow[r].length > 0) || "A");

function goToRow(row){
  currentRow = row;
  try { localStorage.setItem(CURRENT_ROW_KEY, row); } catch {}
  renderNav();
  renderGrid();
}

let currentQuery = "";
let widgetsLoaded = false;
let notesVisitFilter = "all"; // "all" | "planned" | "visited" — 메모 탭에서 방문 상태로 필터링

// 부스 목록을 우선순위(1→2→3→없음) 순으로 정렬할지 여부 (새로고침해도 유지)
const SORT_PRIORITY_KEY = `${STORAGE_PREFIX}-sort-priority`;
let sortByPriority = false;
try { sortByPriority = localStorage.getItem(SORT_PRIORITY_KEY) === "1"; } catch {}

function toggleSortByPriority(){
  sortByPriority = !sortByPriority;
  try { localStorage.setItem(SORT_PRIORITY_KEY, sortByPriority ? "1" : "0"); } catch {}
  renderGrid();
}

/* ---------- 설정 메뉴(톱니바퀴) ----------
   position:fixed로 띄우고 버튼 위치를 기준으로 화면 안쪽에 들어오도록 좌표를 계산함
   (해상도가 좁아 버튼이 화면 가장자리에 가까울 때도 메뉴가 화면 밖으로 잘리지 않게 함).
------------------------------------------------- */
function positionSettingsMenu(){
  const btn = document.getElementById("settingsBtn");
  const menu = document.getElementById("settingsMenu");
  const margin = 10;
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;
  const btnRect = btn.getBoundingClientRect();
  const menuWidth = menu.offsetWidth;
  const menuHeight = menu.offsetHeight;

  let left = btnRect.right - menuWidth;
  left = Math.max(margin, Math.min(left, viewportWidth - menuWidth - margin));

  let top = btnRect.bottom + 8;
  if(top + menuHeight + margin > viewportHeight){
    top = Math.max(margin, btnRect.top - menuHeight - 8);
  }

  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

function closeSettingsMenu(){
  document.getElementById("settingsMenu").classList.remove("open");
}

document.getElementById("settingsBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const menu = document.getElementById("settingsMenu");
  const willOpen = !menu.classList.contains("open");
  if(willOpen){
    menu.classList.add("open");
    positionSettingsMenu();
  } else {
    closeSettingsMenu();
  }
});
document.getElementById("settingsMenu").addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", () => closeSettingsMenu());
window.addEventListener("resize", () => {
  if(document.getElementById("settingsMenu").classList.contains("open")){
    positionSettingsMenu();
  }
});

const MERGED_BOOTH_ALIASES = {};
BOOTHS.forEach(b => {
  if((b.nums || []).length > 1) b.nums.forEach(n => { MERGED_BOOTH_ALIASES[b.block + n] = b.id; });

function migrateMergedBoothIds(obj){
  let changed = false;
  Object.entries(MERGED_BOOTH_ALIASES).forEach(([oldId, newId]) => {
    if(!(oldId in obj)) return;
    if(!(newId in obj)) obj[newId] = obj[oldId];
    delete obj[oldId];
    changed = true;
  });
  return changed;
}

function mergeField(local, cloud){
  // 같은 부스에 로컬/클라우드 값이 둘 다 있으면 로컬을 우선(현재 기기에서 방금 한 작업을 덮어쓰지 않기 위함)
  return Object.assign({}, cloud || {}, local || {});
}

// users/{uid} 문서 안의 행사별 필드(furstclass)에 저장함.
// merge 없이 문서 전체를 덮어쓰므로, 지난 행사(케모켓) 때 문서 최상위에 저장했던
// notes/visitStatus/budgets/priority 필드는 처음 동기화할 때 함께 지워짐.
function pushToCloud(uid){
  return firebase.firestore().collection("users").doc(uid).set({
    [STORAGE_PREFIX]: {
      notes, visitStatus, budgets, priority,
      updatedAt: new Date().toISOString(),
    },
  });
}

function pullAndMergeFromCloud(uid){
  return firebase.firestore().collection("users").doc(uid).get().then((doc) => {
    const cloud = (doc.exists && doc.data()[STORAGE_PREFIX]) || {};
    notes = mergeField(notes, cloud.notes);
    visitStatus = mergeField(visitStatus, cloud.visitStatus);
    budgets = mergeField(budgets, cloud.budgets);
    priority = mergeField(priority, cloud.priority);
    migrateAllMergedBoothIds();
    saveNotes();
    saveVisitStatus();
    saveBudgets();
    savePriority();
    renderNav();
    renderGrid();
    updateBudgetTotalDisplay();
  });
}

function syncFromCloudOnLogin(uid){

  // Firestore 무료 플랜의 일일 읽기/쓰기 쿼터를 아끼기 위해 편집할 때마다 자동으로 올리지 않음).
  pullAndMergeFromCloud(uid).then(() => pushToCloud(uid)).catch(() => {
    // 오프라인 등으로 실패해도 로컬 데이터로 계속 사용 가능
  });
}

/* ---------- "지금 동기화" 버튼 ----------
   자동 동기화 대신 사용자가 직접 누를 때만 클라우드와 주고받도록 함.
   연타로 무료 플랜 일일 쿼터를 낭비하지 않도록 클릭 후 일정 시간 버튼을 잠금.
------------------------------------------------ */
const SYNC_COOLDOWN_SECONDS = 10;
let syncCooldownUntil = 0;
let syncCooldownTimer = null;

function startSyncCooldown(){
  const btn = document.getElementById("syncNowBtn");
  if(!btn) return;
  syncCooldownUntil = Date.now() + SYNC_COOLDOWN_SECONDS * 1000;
  btn.disabled = true;
  clearInterval(syncCooldownTimer);
  const tick = () => {
    const remaining = Math.ceil((syncCooldownUntil - Date.now()) / 1000);
    if(remaining <= 0){
      clearInterval(syncCooldownTimer);
      btn.disabled = !currentUser;
      btn.textContent = t("syncNowBtn");
      return;
    }
    btn.textContent = t("syncNowCooldown", { s: remaining });
  };
  tick();
  syncCooldownTimer = setInterval(tick, 1000);
}

function syncNow(){
  if(!firebaseReady || !currentUser) return;
  if(Date.now() < syncCooldownUntil) return;
  startSyncCooldown();
  pullAndMergeFromCloud(currentUser.uid)
    .then(() => pushToCloud(currentUser.uid))
    .then(() => alert(t("syncSuccess")))
    .catch(() => alert(t("syncFail")));
}

    alert(t("loginFail", { code: (err && err.code) || "unknown" }));
  });
}

   브라우저 기본 confirm()은 기본 포커스가 "확인" 쪽이라 엔터를 잘못 누르면
   실수로 확정될 수 있어서, 대신 "취소"에 기본 포커스가 가는 커스텀 대화상자를 사용함.
------------------------------------------------- */
let confirmResolve = null;

function showConfirmDialog(message, okLabel){
  return new Promise((resolve) => {
    confirmResolve = resolve;
    document.getElementById("confirmMessage").textContent = message;
    document.getElementById("confirmOkBtn").textContent = okLabel;
    document.getElementById("confirmCancelBtn").textContent = t("cancel");
    document.getElementById("confirmBackdrop").classList.add("open");
    document.getElementById("confirmCancelBtn").focus();
  });
}

function closeConfirmDialog(result){
  document.getElementById("confirmBackdrop").classList.remove("open");
  if(confirmResolve){
    confirmResolve(result);
    confirmResolve = null;
  }
}

document.getElementById("confirmOkBtn").addEventListener("click", () => closeConfirmDialog(true));
document.getElementById("confirmCancelBtn").addEventListener("click", () => closeConfirmDialog(false));
document.getElementById("confirmBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "confirmBackdrop") closeConfirmDialog(false);
});

function ensureTwitterWidgets(cb){
  if(window.twttr && window.twttr.widgets){ cb(); return; }
  if(widgetsLoaded){ setTimeout(()=>cb(), 300); return; }
  widgetsLoaded = true;
  const s = document.createElement("script");
  s.src = "https://platform.twitter.com/widgets.js";
  s.async = true;
  s.onload = cb;
  document.body.appendChild(s);
}

function localAvatarUrl(handle){
  // 직접 크롤링/API로 저장해둔 프로필 사진 경로.
  // avatars/ 폴더에 X 핸들명.jpg 로 저장해두면 이 경로로 그대로 표시됨.
  // 파일이 없으면 img.onerror에서 서클명 첫 글자 placeholder로 대체됨.
  return `avatars/${handle}.jpg`;
}

/* ---------- 부스컷 ----------
   booth-cuts/ 폴더에 "부스번호.jpg"(예: booth-cuts/A01.jpg) 로 넣어두면 팝오버/모달 위쪽에 표시됨.
   파일이 아직 없으면 "부스컷 준비 중"(시트 I열이 O) 또는 "부스컷 미제출" 문구로 대신 표시함.
   이미지를 누르면 화면 전체 크기로 크게 볼 수 있음.
------------------------------------------------- */
function buildCardAvatar(booth){
  const avatarWrap = document.createElement("div");
  avatarWrap.className = "avatar-wrap";
  const cardAvatar = booth.avatar || booth.twitter;
  if(cardAvatar){
    // 사진 주인(리더)이 잠금 계정이면 다른 부스원 프로필로 넘어가지 않도록 링크를 걸지 않음
    if(booth.twitter && booth.twitter === cardAvatar){
      // 프로필 사진을 클릭하면 팝오버를 열지 않고 바로 X 프로필로 이동 (모든 탭 공통)
      avatarWrap.classList.add("avatar-link");
      avatarWrap.title = t("openProfile");
      avatarWrap.addEventListener("click", (e) => {
        e.stopPropagation();
        window.open(`https://x.com/${booth.twitter}`, "_blank", "noopener");
      });
    }
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = localAvatarUrl(cardAvatar);
    img.alt = booth.name;
    img.onerror = () => {
      // 로컬에 저장된 이미지 파일이 없으면 서클명 첫 글자로 대체
      avatarWrap.innerHTML = "";
      const fb = document.createElement("div");
      fb.className = "fallback";
      fb.textContent = (booth.name[0] || "?");
      avatarWrap.appendChild(fb);
    };
    avatarWrap.appendChild(img);
  } else {
    const fb = document.createElement("div");
    fb.className = "fallback";
    fb.textContent = (booth.name[0] || "?");
    avatarWrap.appendChild(fb);
  }
  return avatarWrap;
}

function boothCutUrl(booth){
  return `booth-cuts/${booth.id}.jpg`;
}

function closeCutLightbox(){
  document.querySelectorAll(".cut-lightbox").forEach(el => el.remove());
}

function openCutLightbox(src, alt){
  closeCutLightbox();
  const box = document.createElement("div");
  box.className = "cut-lightbox";
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  box.appendChild(img);
  box.addEventListener("click", (e) => {
    e.stopPropagation();
    closeCutLightbox();
  });
  document.body.appendChild(box);
}

function buildBoothCut(booth){
  const wrap = document.createElement("div");
  wrap.className = "booth-cut";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.alt = t("boothCutAlt", { id: booth.id });
  img.src = boothCutUrl(booth);
  img.onerror = () => {
    wrap.innerHTML = `<div class="cut-placeholder">${escapeHtml(t(booth.cut ? "boothCutPending" : "boothCutNotSubmitted"))}</div>`;
  };
  img.addEventListener("click", (e) => {
    e.stopPropagation();
    openCutLightbox(img.src, img.alt);
  });
  wrap.appendChild(img);
  return wrap;
}

}

function buildMemberList(booth){
  const list = document.createElement("ul");
  list.className = "member-list";
  (booth.members || []).forEach(member => {
    const row = document.createElement("li");
    row.className = "member-row";

    const avatar = document.createElement("div");
    avatar.className = "member-avatar";
    const setFallback = () => {
      avatar.innerHTML = "";
      avatar.textContent = (member.name[0] || "?");
    };
    // 잠금(비공개) 계정은 프로필 사진(avatar)만 보이고 X 링크·아이디(twitter)는 없음
    const avatarHandle = member.avatar || member.twitter;
    if(avatarHandle){
      if(member.twitter){
        avatar.classList.add("avatar-link");
        avatar.title = t("openProfile");
        avatar.addEventListener("click", () => openXProfile(member.twitter));
      }
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = member.name;
      img.src = localAvatarUrl(avatarHandle);
      img.onerror = setFallback;
      avatar.appendChild(img);
    } else {
      setFallback();
    }
    row.appendChild(avatar);

    const text = document.createElement("div");
    text.className = "member-text";
    text.innerHTML = `
      <div class="member-name">${escapeHtml(member.name)}</div>
      ${member.twitter
        ? `<div class="member-handle"><a href="https://x.com/${encodeURIComponent(member.twitter)}" target="_blank" rel="noopener">@${escapeHtml(member.twitter)}</a></div>`
        : ""}
    `;
    row.appendChild(text);
    list.appendChild(row);
  });
  // 목록 안을 눌러도 부스 카드 클릭(팝오버 닫힘)으로 처리되지 않도록 막음
  list.addEventListener("click", (e) => e.stopPropagation());
  return list;
}

/* ---------- 부스 상품 정보 ----------
   운영자가 관리 화면(admin.html)에서 "반영"한 X 글을 부스 상세 창에 보여줌.
   반영 목록은 Firestore boothPosts/main 문서의 approved 필드: { 글id: { booth: "A02", handle, at } }.
   방문자마다 한 번만 읽고(첫 부스 상세를 열 때), 행사장처럼 오프라인일 때를 위해 마지막 값을 localStorage 에 둠.
------------------------------------------------- */
const BOOTH_POSTS_CACHE_KEY = `${STORAGE_PREFIX}-booth-posts`;
let boothPostsPromise = null;

function loadApprovedBoothPosts(){
  if(boothPostsPromise) return boothPostsPromise;
  let cached = {};
  try { cached = JSON.parse(localStorage.getItem(BOOTH_POSTS_CACHE_KEY) || "{}") || {}; } catch {}
  if(!firebaseReady) return (boothPostsPromise = Promise.resolve(cached));
  boothPostsPromise = firebase.firestore().collection("boothPosts").doc("main").get()
    .then(doc => {
      const approved = (doc.exists && doc.data().approved) || {};
      try { localStorage.setItem(BOOTH_POSTS_CACHE_KEY, JSON.stringify(approved)); } catch {}
      return approved;
    })
    .catch(() => {
      boothPostsPromise = null;   // 다음에 부스를 열 때 다시 시도
      return cached;
    });
  return boothPostsPromise;
}

function buildBoothPosts(booth){
  const box = document.createElement("div");
  box.className = "booth-posts";
  box.hidden = true;
  loadApprovedBoothPosts().then(approved => {
    // 글 id 는 시간이 지날수록 커지는 숫자라 길이 → 사전순 비교로 최신 글이 위로 옴
    const ids = Object.keys(approved)
      .filter(id => approved[id] && approved[id].booth === booth.id)
      .sort((a, b) => b.length - a.length || (b > a ? 1 : b < a ? -1 : 0));
    if(!ids.length || !box.isConnected) return;
    box.hidden = false;
    box.innerHTML = `<div class="booth-posts-title">${escapeHtml(t("boothPostsTitle"))}</div>`;
    ensureTwitterWidgets(function start(){
      if(!box.isConnected) return;
      if(!window.twttr || !window.twttr.widgets){ setTimeout(start, 300); return; }
      ids.reduce((prev, id) => prev.then(() => {
        const item = document.createElement("div");
        item.className = "booth-post";
        box.appendChild(item);
        return window.twttr.widgets.createTweet(id, item, { theme: currentTheme(), dnt: true, lang: currentLang, conversation: "none" })
          .then(el => { if(!el) item.remove(); }, () => item.remove());
      }), Promise.resolve());
    });
  });
  // 상자 안을 눌러도 부스 카드 클릭(팝오버 닫힘)으로 처리되지 않도록 막음
  box.addEventListener("click", (e) => e.stopPropagation());
  return box;
}

function loadTimelineInto(slot, handle){
  ensureTwitterWidgets(() => {
    // X 스크립트가 막혀 불러와지지 않은 경우(광고 차단 등)에도 오류 없이 실패 문구만 보여줌
    if(!window.twttr || !window.twttr.widgets){
      slot.innerHTML = `<div class="placeholder">${escapeHtml(t("tweetLoadFail"))}</div>`;
      return;
    }
    slot.innerHTML = "";
    const container = document.createElement("div");
    slot.appendChild(container);
    window.twttr.widgets.createTimeline(
      { sourceType: "profile", screenName: handle },
      container,
      { tweetLimit: 1, theme: "dark", dnt: true, chrome: "noheader nofooter noborders transparent" }
    ).catch(() => {
      slot.innerHTML = `<div class="placeholder">${escapeHtml(t("tweetLoadFail"))}</div>`;
    });
  });
}

// 행사 안내 탭: 공식 X 계정(@FURSTCLASS_KR)의 글을 정해진 높이 안에서 스크롤로 보여줌.
// X 타임라인 위젯은 로그인하지 않은 방문자에게 막혀(429) 빈 상자만 보이므로 쓰지 않음.
// 1) FxTwitter 공개 JSON(무료·키 없음)에서 OFFICIAL_POST_SINCE 이후 글을 페이지를 넘겨 가며 받고
//    리트윗·답글(번역 글)·숨김 글을 거름
// 2) 글마다 X 개별 글 임베드(createTweet, 로그인 불필요)로 그림. 한 번에 다 그리면 무거우므로
//    처음 몇 개만 그리고, 상자 안에서 아래로 스크롤하면 이어서 그림.
// FxTwitter 가 실패하면 OFFICIAL_POST_FALLBACK_IDS(2026-10-02 기준 최근 글)를 대신 씀.
const OFFICIAL_POST_SINCE = Date.parse("2026-06-16T00:00:00+09:00");
const OFFICIAL_POST_MAX_PAGES = 8;   // 페이지당 약 20개
const OFFICIAL_POST_BATCH = 4;       // 한 번에 그리는 글 수
// 사이트에 보여주지 않을 글 (2026-10-02 사용자 요청: 8/21 게스트 관련 글)
const OFFICIAL_POST_HIDDEN_IDS = new Set(["2090723233784099271"]);
const OFFICIAL_POST_FALLBACK_IDS = [
  "2104521337406726510", "2103382992215560409", "2102277349509050694",
  "2097718475032809727", "2091465987191136588", "2089244521016197369",
];

function fetchOfficialPostIds(){
  // FxTwitter 는 프로필 글 목록에서 대문자 아이디를 넣으면 빈 결과(404)를 주므로 소문자로 요청함 (2026-10-04 확인)
  const base = `https://api.fxtwitter.com/2/profile/${OFFICIAL_X_HANDLE.toLowerCase()}/statuses`;
  const ids = [];
  const seen = new Set();
  const page = (cursor, n) => fetch(cursor ? `${base}?cursor=${encodeURIComponent(cursor)}` : base)
    .then(res => res.ok ? res.json() : Promise.reject(res.status))
    .then(data => {
      const results = data.results || [];
      let reachedOld = false;
      results.forEach(p => {
        const ts = p.created_timestamp ? p.created_timestamp * 1000 : Date.parse(p.created_at);
        if(ts && ts < OFFICIAL_POST_SINCE){ reachedOld = true; return; }
        const id = String(p.id);
        if(seen.has(id) || p.reposted_by || p.replying_to || OFFICIAL_POST_HIDDEN_IDS.has(id)) return;
        if(String((p.author && p.author.screen_name) || "").toLowerCase() !== OFFICIAL_X_HANDLE.toLowerCase()) return;
        seen.add(id);
        ids.push(id);
      });
      const next = data.cursor && data.cursor.bottom;
      if(!reachedOld && next && results.length && n < OFFICIAL_POST_MAX_PAGES) return page(next, n + 1);
    });
  return page(null, 1)
    .catch(() => {})   // 중간 페이지가 실패해도 그때까지 받은 글은 보여줌
    .then(() => ids.length ? ids : OFFICIAL_POST_FALLBACK_IDS);
}

function loadOfficialFeed(box){
  if(!box) return;
  const showFail = () => {
    box.innerHTML = `<div class="placeholder">${escapeHtml(t("infoNewsFail"))}</div>`;
  };
  // widgets.js 자체가 막혀 있으면(광고 차단 등) 아무 응답이 없으므로 일정 시간 뒤 안내 문구로 바꿈
  setTimeout(() => {
    if(box.isConnected && !box.querySelector("iframe")) showFail();
  }, 15000);
  fetchOfficialPostIds().then(ids => {
    ensureTwitterWidgets(function start(){
      if(!box.isConnected) return;
      // widgets.js 를 부스 팝오버에서 먼저 불러오는 중이면 준비될 때까지 잠깐 기다림
      if(!window.twttr || !window.twttr.widgets){ setTimeout(start, 300); return; }
      box.innerHTML = "";
      const sentinel = document.createElement("div");
      sentinel.className = "official-feed-more";
      box.appendChild(sentinel);
      let next = 0, shown = 0, busy = false;
      // 화면에 나오는 순서를 지키려고 한 글씩 차례로 그림
      const renderBatch = () => {
        if(busy || next >= ids.length || !box.isConnected) return;
        busy = true;
        const batch = ids.slice(next, next + OFFICIAL_POST_BATCH);
        next += batch.length;
        batch.reduce((prev, id) => prev.then(() => {
          const item = document.createElement("div");
          item.className = "official-post";
          box.insertBefore(item, sentinel);
          return window.twttr.widgets.createTweet(id, item, { theme: currentTheme(), dnt: true, lang: currentLang, conversation: "none" })
            .then(el => { if(el) shown++; else item.remove(); }, () => item.remove());
        }), Promise.resolve()).then(() => {
          busy = false;
          if(next >= ids.length){
            sentinel.remove();
            if(box.isConnected && !shown) showFail();
            return;
          }
          // 그린 글이 상자 높이를 다 채우지 못했으면 바로 이어서 그림
          if(box.scrollTop + box.clientHeight > box.scrollHeight - 400) renderBatch();
        });
      };
      box.addEventListener("scroll", () => {
        if(box.scrollTop + box.clientHeight > box.scrollHeight - 400) renderBatch();
      }, { passive: true });
      renderBatch();
    });
  });
}

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderGrid(){
  const grid = document.getElementById("grid");
  const mapGrid = document.getElementById("mapGrid");
  const infoView = document.getElementById("infoView");
  const emptyState = document.getElementById("emptyState");

  const isMapView = currentRow === "MAP";
  const isInfoView = currentRow === "INFO";
  grid.style.display = (isMapView || isInfoView) ? "none" : "";
  mapGrid.style.display = isMapView ? "block" : "none";
  infoView.style.display = isInfoView ? "block" : "none";
  emptyState.style.display = "none";

  if(isInfoView){
    document.getElementById("currentLetter").textContent = "🎪";
    document.getElementById("currentCount").textContent = t("infoHint");
    document.getElementById("notesExtra").style.display = "none";
    document.getElementById("sortPriorityBtn").style.display = "none";
    renderInfoView();
    return;
  }

  if(isMapView){
    document.getElementById("currentLetter").textContent = "🗺️";
    document.getElementById("currentCount").textContent = t("mapHint");
    document.getElementById("notesExtra").style.display = "none";
    document.getElementById("sortPriorityBtn").style.display = "none";
    renderMapView();
    return;
  }

  grid.innerHTML = "";
  document.getElementById("sortPriorityBtn").style.display = "";
  document.getElementById("sortPriorityBtn").classList.toggle("active", sortByPriority);

  const isNotesView = currentRow === "NOTES";
  const isAllView = currentRow === "ALL";
  document.getElementById("currentLetter").textContent = isNotesView ? "📝" : isAllView ? "📋" : currentRow;
  document.getElementById("notesExtra").style.display = isNotesView ? "flex" : "none";
  updateBudgetTotalDisplay();

  let list;
  if(isNotesView){
    const trackedIds = new Set([
      ...Object.keys(notes),
      ...Object.keys(visitStatus),
      ...Object.keys(budgets),
      ...Object.keys(priority),
    ]);
    list = BOOTHS.filter(b => trackedIds.has(b.id));
    if(notesVisitFilter !== "all"){
      list = list.filter(b => getVisitStatus(b.id) === notesVisitFilter);
    }
    document.querySelectorAll("#visitFilter button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.filter === notesVisitFilter);
    });
  } else if(isAllView){
    list = BOOTHS;
  } else {
    list = byRow[currentRow] || [];
  }

  if(currentQuery){
    const q = currentQuery.toLowerCase();
    list = list.filter(b =>
      b.name.toLowerCase().includes(q) ||
      b.id.toLowerCase().includes(q) ||
      (b.members || []).some(m =>
        m.name.toLowerCase().includes(q) ||
        (m.twitter || "").toLowerCase().includes(q)
      )
    );
  }

  if(sortByPriority){
    // Array#sort는 안정 정렬이라, 같은 우선순위(혹은 둘 다 없음)끼리는 원래 순서가 유지됨
    list = list.slice().sort((a, b) => (getPriority(a.id) || 4) - (getPriority(b.id) || 4));
  }

  document.getElementById("currentCount").textContent = isNotesView
    ? t("notesCount", { n: list.length })
    : t("circleCount", { n: list.length });
  document.getElementById("emptyState").style.display = list.length ? "none" : "block";
  document.getElementById("emptyState").textContent = isNotesView
    ? t("emptyNotes")
    : t("emptyDefault");

  list.forEach(booth => {
    const card = document.createElement("div");
    const visitCls = getVisitStatus(booth.id) === "planned" ? " visit-planned"
      : getVisitStatus(booth.id) === "visited" ? " visit-visited" : "";
    const priorityCls = getPriority(booth.id) ? ` priority-${getPriority(booth.id)}` : "";
    card.className = "booth" + (booth.twitter ? "" : " no-tw") + (getNote(booth.id) ? " has-note" : "") + visitCls + priorityCls;
    card.dataset.boothId = booth.id;

    const memoFlag = document.createElement("div");
    memoFlag.className = "memo-flag";
    memoFlag.textContent = "📝";
    card.appendChild(memoFlag);

    const badge = document.createElement("div");
    badge.className = "no-tw-badge";
    card.appendChild(badge);

    const idEl = document.createElement("div");

/* ---------- 배치도 ----------
   공식 "일요일 부스 안내" 이미지(2026-10-04 사용자 제공)를 보고 SVG로 다시 그린 배치도.
   왼쪽 주성홀(탈의실 + C구역), 오른쪽 그랜드볼룸(무대 + A구역 + B구역), 출입구는 분홍 화살표.
   칸 좌표는 MAP_SLOTS 에 부스 번호(예: "A1")별로 적어두고, BOOTHS 의 nums 와 맞춰 부스를 찾음.
   두 칸 부스(A11-12 등)는 칸이 붙어 있으면 한 도형으로 합치고, 떨어져 있으면(A37·A38) 칸마다 그림.
   색은 모두 CSS 토큰(--map-*)이라 라이트/다크 테마를 따라감.
------------------------------------------------------------- */
const MAP_W = 40, MAP_H = 32, MAP_STEP = 34;
const MAP_SLOTS = (() => {
  const slots = {};
  // 세로 줄: 위→아래 순서로 번호 목록을 받음
  const col = (block, nums, x, y0, step = MAP_STEP, h = MAP_H, w = MAP_W) =>
    nums.forEach((n, i) => { slots[block + n] = { block, x, y: y0 + i * step, w, h }; });
  // 가로 줄: 왼쪽→오른쪽 순서
  const row = (block, nums, x0, y, w, step) =>
    nums.forEach((n, i) => { slots[block + n] = { block, x: x0 + i * step, y, w, h: MAP_H }; });
  const range = (a, b) => { const r = []; for(let i = a; a <= b ? i <= b : i >= b; i += a <= b ? 1 : -1) r.push(i); return r; };

  // C구역(주성홀)
  row("C", range(17, 24), 193, 462, MAP_W, 42);
  col("C", range(16, 9), 146, 506);
  col("C", range(25, 28), 534, 506);
  row("C", range(8, 1), 193, 790, MAP_W, 42);
  // A구역(그랜드볼룸 왼쪽)
  col("A", range(1, 9), 832, 440);
  col("A", range(18, 10), 900, 440);
  col("A", range(19, 23), 1040, 440, 40, 36);
  col("A", range(28, 24), 1082, 440, 40, 36);
  col("A", range(29, 37), 1312, 440);
  row("A", range(41, 38), 1020, 790, 80, 84);
  // B구역(그랜드볼룸 오른쪽)
  col("B", range(1, 9), 1414, 440);
  col("B", range(34, 30), 1540, 440, 40, 36);
  col("B", range(25, 29), 1582, 440, 40, 36);
  col("B", range(24, 15), 1734, 440);
  row("B", range(10, 14), 1470, 790, 52, 56);
  return slots;
})();

// 출입구 화살표(위·아래 또는 오른쪽·왼쪽 한 쌍)
function mapDoorArrows(cx, cy, horizontal){
  const a = (x1, y1, x2, y2) => `<line class="map-arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#mapArrowHead)"/>`;
  return horizontal
    ? a(cx - 20, cy - 22, cx + 20, cy - 22) + a(cx + 20, cy + 22, cx - 20, cy + 22)
    : a(cx - 16, cy + 16, cx - 16, cy - 16) + a(cx + 16, cy - 16, cx + 16, cy + 16);
}

function mapHallLabel(text, cx, cy, cls){
  const w = Math.max(110, text.length * 22 + 40);
  return `<g class="map-hall-label ${cls}"><rect x="${cx - w / 2}" y="${cy - 19}" width="${w}" height="38" rx="19"/>` +
    `<text x="${cx}" y="${cy + 1}">${escapeHtml(text)}</text></g>`;
}

// 구역 필터: "ALL"(전체) / "A" / "B" / "C". 고른 구역만 크게 보이도록 SVG viewBox 를 그 구역으로 잘라냄. 새로고침해도 유지
const MAP_ZONE_KEY = `${STORAGE_PREFIX}-map-zone`;
const MAP_ZONE_VIEWBOX = {
  ALL: "100 200 1720 663",
  A: "690 330 705 533",   // 무대 + A구역
  B: "1375 330 445 533",  // B구역
  C: "100 200 560 663",   // 주성홀(탈의실 + C구역)
};
let mapZone = "ALL";
try { const z = localStorage.getItem(MAP_ZONE_KEY); if(z && MAP_ZONE_VIEWBOX[z]) mapZone = z; } catch {}

function setMapZone(zone){
  mapZone = zone;
  try { localStorage.setItem(MAP_ZONE_KEY, zone); } catch {}
  renderMapView();
}

function buildMapSvg(){
  const L = key => escapeHtml(t(key));
  const vb = (MAP_ZONE_VIEWBOX[mapZone] || MAP_ZONE_VIEWBOX.ALL).split(" ").map(Number);
  let s = `<svg class="venue-map${mapZone === "ALL" ? "" : " zoomed"}" viewBox="${vb.join(" ")}" role="group" aria-label="${L("mapTitle")}" xmlns="http://www.w3.org/2000/svg">` +
    `<defs><marker id="mapArrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">` +
    `<path d="M1,1 L7,5 L1,9" class="map-arrow-head"/></marker>` +
    // 구역만 볼 때 viewBox 바깥(옆 구역)이 화면 여백으로 비쳐 보이지 않게 잘라냄
    `<clipPath id="mapClip"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}"/></clipPath></defs>` +
    `<g clip-path="url(#mapClip)">`;

  // 주성홀: 탈의실 두 칸 + 복도 + C구역, 오른쪽 벽에 출입구
  s += `<rect class="map-room" x="120" y="230" width="480" height="170"/>` +
    `<line class="map-room" x1="360" y1="230" x2="360" y2="400"/>` +
    `<text class="map-room-text" x="240" y="318">${L("mapMaleRoom")}</text>` +
    `<text class="map-room-text" x="480" y="318">${L("mapFemaleRoom")}</text>` +
    `<line class="map-wall" x1="120" y1="430" x2="600" y2="430"/>` +
    `<path class="map-wall" d="M120,400 V848 H600 V780 H628 M628,670 H600 V400"/>` +
    `<rect class="map-zone zone-c" x="132" y="450" width="456" height="386" rx="16"/>` +
    `<text class="map-zone-text zone-c" x="360" y="650">${L("mapZoneC")}</text>` +
    mapDoorArrows(645, 725, true) +
    mapHallLabel(t("mapHallJusung"), 360, 230, "dark");

  // 그랜드볼룸: 위쪽 벽에 출입구 두 곳, 무대, A·B구역(사이 칸막이)
  s += `<path class="map-wall" d="M960,355 V380 H680 V848 H1800 V380 H1760 V355 M1640,355 V380 H1080 V355"/>` +
    mapDoorArrows(1020, 372, false) + mapDoorArrows(1700, 372, false) +
    `<rect class="map-stage" x="700" y="440" width="94" height="320" rx="14"/>` +
    `<text class="map-stage-text" x="747" y="602">${L("mapStage")}</text>` +
    `<rect class="map-zone zone-a" x="815" y="420" width="555" height="416" rx="16"/>` +
    `<line class="map-wall" x1="1385" y1="420" x2="1385" y2="848"/>` +
    `<rect class="map-zone zone-b" x="1400" y="420" width="388" height="416" rx="16"/>` +
    `<text class="map-zone-text zone-a" x="1180" y="715">${L("mapZoneA")}</text>` +
    `<text class="map-zone-text zone-b" x="1640" y="715">${L("mapZoneB")}</text>` +
    mapHallLabel(t("mapHallGrand"), 1250, 380, "accent");

  // 부스 칸: 부스 번호("A1")별 칸을 부스 단위로 묶음
  const used = new Set();
  BOOTHS.forEach(booth => {
    const parts = (booth.nums || [booth.num])
      .map(n => ({ n, slot: MAP_SLOTS[booth.block + parseInt(n, 10)] }))
      .filter(p => p.slot);
    if(!parts.length) return;
    parts.forEach(p => used.add(booth.block + parseInt(p.n, 10)));
    const status = getVisitStatus(booth.id);
    const level = getPriority(booth.id);
    const cls = "map-booth zone-" + booth.block.toLowerCase() +
      (getNote(booth.id) ? " has-note" : "") +
      (status === "planned" ? " visit-planned" : status === "visited" ? " visit-visited" : "") +
      (level ? ` priority-${level}` : "");
    const label = `${booth.id} ${booth.name}`;
    const open = `<g class="${cls}" data-booth-id="${escapeHtml(booth.id)}" tabindex="0" role="button" aria-label="${escapeHtml(label)}"><title>${escapeHtml(label)}</title>`;

    // 붙어 있는 칸(위아래·좌우로 4px 이내)이면 한 도형으로 합침
    const touching = (a, b) =>
      (a.x === b.x && (Math.abs(a.y + a.h - b.y) <= 4 || Math.abs(b.y + b.h - a.y) <= 4)) ||
      (a.y === b.y && (Math.abs(a.x + a.w - b.x) <= 4 || Math.abs(b.x + b.w - a.x) <= 4));
    const groups = parts.length === 2 && touching(parts[0].slot, parts[1].slot) ? [parts] : parts.map(p => [p]);
    groups.forEach(g => {
      const x1 = Math.min(...g.map(p => p.slot.x)), y1 = Math.min(...g.map(p => p.slot.y));
      const x2 = Math.max(...g.map(p => p.slot.x + p.slot.w)), y2 = Math.max(...g.map(p => p.slot.y + p.slot.h));
      s += open + `<rect class="map-booth-ring" x="${x1 - 3.5}" y="${y1 - 3.5}" width="${x2 - x1 + 7}" height="${y2 - y1 + 7}" rx="8"/>` +
        `<rect class="map-booth-box" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="6"/>`;
      if(g.length > 1){
        const vertical = g[0].slot.x === g[1].slot.x;
        const mid = vertical ? (y1 + y2) / 2 : (x1 + x2) / 2;
        s += vertical
          ? `<line class="map-booth-split" x1="${x1 + 4}" y1="${mid}" x2="${x2 - 4}" y2="${mid}"/>`
          : `<line class="map-booth-split" x1="${mid}" y1="${y1 + 4}" x2="${mid}" y2="${y2 - 4}"/>`;
      }
      g.forEach(p => {
        s += `<text class="map-booth-text" x="${p.slot.x + p.slot.w / 2}" y="${p.slot.y + p.slot.h / 2 + 1}">${escapeHtml(booth.block + parseInt(p.n, 10))}</text>`;
      });
      s += `</g>`;
    });
  });
  // 배치도에는 있는데 부스 데이터에 없는 칸은 회색 빈 칸으로(누를 수 없음)
  Object.entries(MAP_SLOTS).forEach(([key, slot]) => {
    if(used.has(key)) return;
    s += `<g class="map-booth empty"><rect class="map-booth-box" x="${slot.x}" y="${slot.y}" width="${slot.w}" height="${slot.h}" rx="6"/>` +
      `<text class="map-booth-text" x="${slot.x + slot.w / 2}" y="${slot.y + slot.h / 2 + 1}">${key}</text></g>`;
  });
  return s + `</g></svg>`;
}

function renderMapView(){
  const mapGrid = document.getElementById("mapGrid");
  mapGrid.innerHTML = "";
  if(!BOOTHS.length){
    mapGrid.innerHTML = `<div class="empty-state" style="display:block;">${escapeHtml(t("noBoothData"))}</div>`;
    return;
  }

  const zoneFilter = document.createElement("div");
  zoneFilter.className = "visit-filter map-zone-filter";
  [["ALL", "mapZoneAll"], ["A", "mapZoneA"], ["B", "mapZoneB"], ["C", "mapZoneC"]].forEach(([zone, key]) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = t(key);
    btn.classList.toggle("active", mapZone === zone);
    btn.setAttribute("aria-pressed", mapZone === zone ? "true" : "false");
    btn.addEventListener("click", () => setMapZone(zone));
    zoneFilter.appendChild(btn);
  });
  mapGrid.appendChild(zoneFilter);

  const legend = document.createElement("div");
  legend.className = "map-legend";
  legend.innerHTML =
    `<span><i class="swatch note"></i>${escapeHtml(t("mapLegendNote"))}</span>` +
    `<span><i class="swatch planned"></i>${escapeHtml(t("mapLegendPlanned"))}</span>` +
    `<span><i class="swatch visited"></i>${escapeHtml(t("mapLegendVisited"))}</span>` +
    `<span><i class="swatch ring p1"></i><i class="swatch ring p2"></i><i class="swatch ring p3"></i>${escapeHtml(t("mapLegendPriority"))}</span>`;
  mapGrid.appendChild(legend);

  const scroller = document.createElement("div");
  scroller.className = "venue-map-scroll";
  scroller.innerHTML = buildMapSvg();
  mapGrid.appendChild(scroller);
  // 홀 이름표는 언어마다 글자 길이가 달라서, 그려진 글자 폭에 맞춰 둥근 바탕을 다시 잡음
  scroller.querySelectorAll(".map-hall-label").forEach(g => {
    const rect = g.querySelector("rect"), text = g.querySelector("text");
    let w = 0;
    try { w = text.getBBox().width; } catch {}
    if(!w) return;
    const cx = parseFloat(text.getAttribute("x"));
    rect.setAttribute("width", w + 48);
    rect.setAttribute("x", cx - (w + 48) / 2);
  });

  // 부스 칸을 누르면(또는 Enter/스페이스) 부스 탭의 카드와 같은 상세 창을 띄움
  const svg = scroller.querySelector("svg");
  svg.addEventListener("click", (e) => {
    const g = e.target.closest("[data-booth-id]");
    if(!g) return;
    e.stopPropagation();
    openBoothModal(g.dataset.boothId);
  });
  svg.addEventListener("keydown", (e) => {
    if(e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest("[data-booth-id]");
    if(!g) return;
    e.preventDefault();
    openBoothModal(g.dataset.boothId);
  });
}

/* ---------- 행사 안내 (일정 · 약도 · 날씨) ----------
   일정/장소는 공식 사이트(furst-class.com/event) 기준.
   날씨는 Open-Meteo(API 키 불필요)에서 행사 기간 예보를 그때그때 받아와 표시함.

function weatherIcon(code){
  if(code === 0) return "☀️";
  if(code === 1) return "🌤️";
  if(code === 2) return "⛅";
  if(code === 3) return "☁️";
  if(code === 45 || code === 48) return "🌫️";
  if([51,53,55,56,57].includes(code)) return "🌦️";
  if([61,63,65,66,67,80,81,82].includes(code)) return "🌧️";
  if([71,73,75,77,85,86].includes(code)) return "🌨️";
  if([95,96,99].includes(code)) return "⛈️";
  return "🌡️";
}

let weatherCache = null;
function fetchEventWeather(){
  if(weatherCache) return weatherCache;
  weatherCache = fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${VENUE_LAT}&longitude=${VENUE_LON}` +
    `&hourly=temperature_2m,relative_humidity_2m,weathercode&timezone=Asia%2FSeoul` +
    `&start_date=${EVENT_DATES[0]}&end_date=${EVENT_DATES[EVENT_DATES.length - 1]}`
  ).then((res) => {
    if(!res.ok) throw new Error("weather fetch failed");
    return res.json();
  }).catch((err) => {
    // 실패한 결과를 계속 캐시해두지 않도록 해서, 탭을 다시 열면 재시도되게 함
    weatherCache = null;
    throw err;
  });
  return weatherCache;
}

    ).join("");
  };
  // Open-Meteo 예보는 오늘부터 약 16일 뒤까지만 제공됨. 그보다 먼 날짜를 요청하면 에러가 나므로
  // 미리 "아직 제공되지 않음" 안내만 보여줌.
  const daysUntilEvent = (new Date(`${EVENT_DATES[0]}T00:00:00+09:00`) - Date.now()) / 86400000;
  if(daysUntilEvent > 15){
    renderUnavailable();
    return;
  }
  fetchEventWeather().then((data) => {
    const times = (data && data.hourly && data.hourly.time) || [];
    const temps = (data && data.hourly && data.hourly.temperature_2m) || [];
    const hums = (data && data.hourly && data.hourly.relative_humidity_2m) || [];
    const codes = (data && data.hourly && data.hourly.weathercode) || [];

    weatherDays.innerHTML = EVENT_DATES.map((date) => {
      const cards = WEATHER_HOURS.map((hour) => {
        const idx = times.indexOf(`${date}T${String(hour).padStart(2, "0")}:00`);
        if(idx === -1 || temps[idx] == null) return null;
        return { hour, temp: temps[idx], hum: hums[idx], code: codes[idx] };
      }).filter(Boolean);

      const body = cards.length
        ? `<div class="weather-cards">${cards.map((c) => `
            <div class="weather-card">
              <div class="weather-time">${String(c.hour).padStart(2, "0")}:00</div>
              <div class="weather-icon">${weatherIcon(c.code)}</div>
              <div class="weather-temp">${Math.round(c.temp)}°C</div>
              <div class="weather-hum">💧 ${Math.round(c.hum)}%</div>
            </div>
          `).join("")}</div>`
        : `<div class="weather-empty">${escapeHtml(t("infoWeatherUnavailable", { date }))}</div>`;
      return `<div class="venue-address" style="margin-top:10px;">${escapeHtml(date)}</div>${body}`;
    }).join("");
  }).catch(() => {
    weatherDays.innerHTML = `<div class="weather-empty">${escapeHtml(t("infoWeatherError"))}</div>`;
  });
}

/* ---------- 부스 상세 모달 (부스 카드나 배치도의 부스를 눌렀을 때) ---------- */
function openBoothModal(boothId){
  const booth = BOOTHS.find(b => b.id === boothId);
  if(!booth) return;

  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";
  content.classList.remove("modal-wide");
  content.classList.add("booth-modal");
  const full = useBoothModal();
  content.classList.toggle("booth-modal-full", full);
  backdrop.classList.toggle("booth-full", full);

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const head = document.createElement("div");
  head.className = "pop-head";
  head.style.marginTop = "6px";
  const names = document.createElement("div");
  names.className = "names";
  names.innerHTML = `<div class="c-name">${escapeHtml(booth.name)}</div><div class="r-name">${boothSubLine(booth)}</div>`;
  head.appendChild(names);
  content.appendChild(head);
  content.appendChild(buildBoothCut(booth));
  content.appendChild(buildMemberList(booth));
  content.appendChild(buildBoothPosts(booth));

  const slot = document.createElement("div");
  slot.className = "tweet-slot";
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = booth.twitter ? t("tweetLoadHint") : t("noTwitterHint");
  slot.appendChild(ph);
  content.appendChild(slot);
  if(booth.twitter){
    loadTimelineInto(slot, booth.twitter);
  }

  const links = document.createElement("div");
  links.className = "pop-links";
  if(booth.twitter){
    links.innerHTML = `<a href="https://x.com/${booth.twitter}" target="_blank" rel="noopener">${escapeHtml(t("openProfile"))}</a>`;
  }
  content.appendChild(links);

  const visitBox = document.createElement("div");
  visitBox.className = "visit-box";
  visitBox.innerHTML = `
    <button type="button" class="visit-btn planned">${escapeHtml(t("visitPlanned"))}</button>
    <button type="button" class="visit-btn visited">${escapeHtml(t("visitVisited"))}</button>
  `;
  const plannedBtn = visitBox.querySelector(".planned");
  const visitedBtn = visitBox.querySelector(".visited");
  const syncVisitButtons = () => {
    const status = getVisitStatus(booth.id);
    plannedBtn.classList.toggle("active", status === "planned");
    visitedBtn.classList.toggle("active", status === "visited");
  };
  syncVisitButtons();
  const refreshVisitViews = () => {
    updateVisitVisuals(booth.id);
    if(currentRow === "MAP") renderMapView();
  };
  plannedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "planned" ? null : "planned");
    refreshVisitViews();
    syncVisitButtons();
  });
  visitedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "visited" ? null : "visited");
    refreshVisitViews();
    syncVisitButtons();
  });
  content.appendChild(visitBox);

  const priorityBox = document.createElement("div");
  priorityBox.className = "priority-box";
  priorityBox.innerHTML = `
    <button type="button" class="p1">${escapeHtml(t("priority1"))}</button>
    <button type="button" class="p2">${escapeHtml(t("priority2"))}</button>
    <button type="button" class="p3">${escapeHtml(t("priority3"))}</button>
  `;
  const p1Btn = priorityBox.querySelector(".p1");
  const p2Btn = priorityBox.querySelector(".p2");
  const p3Btn = priorityBox.querySelector(".p3");
  const syncPriorityButtons = () => {
    const level = getPriority(booth.id);
    p1Btn.classList.toggle("active", level === 1);
    p2Btn.classList.toggle("active", level === 2);
    p3Btn.classList.toggle("active", level === 3);
  };
  syncPriorityButtons();
  const refreshPriorityViews = () => {
    updatePriorityVisuals(booth.id);
    if(currentRow === "MAP") renderMapView();
  };
  [[p1Btn, 1], [p2Btn, 2], [p3Btn, 3]].forEach(([btn, level]) => {
    btn.addEventListener("click", () => {
      setPriority(booth.id, getPriority(booth.id) === level ? null : level);
      refreshPriorityViews();
      syncPriorityButtons();
    });
  });
  content.appendChild(priorityBox);

  const budgetBox = document.createElement("div");
  budgetBox.className = "budget-box";
  budgetBox.innerHTML = `
    <label>${escapeHtml(t("budgetLabel"))}</label>
    <div class="budget-input-row">
      <span class="yen">₩</span>
      <input type="number" min="0" step="1000" inputmode="numeric" value="${getBudget(booth.id) || ""}" placeholder="0">
    </div>
  `;
  const budgetInput = budgetBox.querySelector("input");
  budgetInput.addEventListener("input", () => {
    setBudget(booth.id, budgetInput.value);
    updateBudgetTotalDisplay();
  });
  content.appendChild(budgetBox);

  const memoBox = document.createElement("div");
  memoBox.className = "memo-box";
  memoBox.innerHTML = `
    <label>${escapeHtml(t("memoLabel"))}</label>
    <textarea maxlength="1000" placeholder="${escapeHtml(t("memoPlaceholder"))}">${escapeHtml(getNote(booth.id))}</textarea>
    <div class="memo-actions">
      <button type="button" class="save">${escapeHtml(t("save"))}</button>
      <button type="button" class="delete">${escapeHtml(t("delete"))}</button>
      <span class="memo-status"></span>
    </div>
  `;
  const textarea = memoBox.querySelector("textarea");
  const saveBtn = memoBox.querySelector(".save");
  const deleteBtn = memoBox.querySelector(".delete");
  const status = memoBox.querySelector(".memo-status");

  saveBtn.addEventListener("click", () => {
    setNote(booth.id, textarea.value);
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP") renderMapView();
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("savedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });
  deleteBtn.addEventListener("click", () => {
    textarea.value = "";
    setNote(booth.id, "");
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP") renderMapView();
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("deletedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });

  content.appendChild(memoBox);

  backdrop.classList.add("open");
  document.documentElement.classList.add("modal-open");
  content.scrollTop = 0;
}

function openHelpModal(){
  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";
  content.classList.remove("booth-modal", "booth-modal-full");
  backdrop.classList.remove("booth-full");
  content.classList.add("modal-wide");

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const title = document.createElement("h2");
  title.style.margin = "6px 0 14px";
  title.textContent = t("helpTitle");
  content.appendChild(title);

  const body = document.createElement("div");
  body.className = "help-body";
  const link = `<a href="https://furst-class.com/" target="_blank" rel="noopener">https://furst-class.com/</a>`;
  const paragraphs = (I18N[currentLang] && I18N[currentLang].helpBody) || I18N.ko.helpBody;
  body.innerHTML = paragraphs
    .map(line => `<p>${escapeHtml(line).replace("{link}", link).replace(/\n/g, "<br>")}</p>`)
    .join("");
  content.appendChild(body);

  backdrop.classList.add("open");
  document.documentElement.classList.add("modal-open");
}

document.getElementById("helpBtn").addEventListener("click", () => {
  closeSettingsMenu();
  openHelpModal();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  closeSettingsMenu();
  resetAllData();
});

document.getElementById("visitFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-filter]");
  if(!btn) return;
  notesVisitFilter = btn.dataset.filter;
  renderGrid();
});

document.getElementById("sortPriorityBtn").addEventListener("click", toggleSortByPriority);

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("open");
  document.documentElement.classList.remove("modal-open");
}

document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "modalBackdrop") closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    closeCutLightbox();
    closeModal();
    closeConfirmDialog(false);
  }
});

applyStaticTexts();
renderNav();
renderGrid();

// 오프라인에서도 사이트를 열람할 수 있도록 서비스 워커 등록
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // 등록 실패해도(예: 지원 안 하는 브라우저) 사이트 자체 동작에는 지장 없음
    });
    navigator.serviceWorker.ready.then((reg) => {
      if(reg.active) reg.active.postMessage({ type: "precache-images", urls: allImageUrls() });
    });
  });
}

// 처음 접속했을 때 보지 않은 부스의 사진도 오프라인에서 보이도록 서비스 워커에 미리 받을 목록을 넘김.
// 부스컷·프로필 사진 전체(약 9MB). 이미 받아 둔 이미지는 서비스 워커가 건너뜀.
function allImageUrls(){
  const paths = new Set();
  BOOTHS.forEach(booth => {
    paths.add(boothCutUrl(booth));
    [booth.avatar || booth.twitter, ...booth.members.map(m => m.avatar || m.twitter)]
      .filter(Boolean)
      .forEach(handle => paths.add(localAvatarUrl(handle)));
  });
  return [...paths].map(path => new URL(path, location.href).href);
}
