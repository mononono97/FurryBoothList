<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://platform.twitter.com https://cdn.syndication.twimg.com https://www.gstatic.com https://apis.google.com;
  worker-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://pbs.twimg.com https://abs.twimg.com https://ton.twimg.com;
  font-src 'self' data:;
  connect-src 'self' https://api.fxtwitter.com https://cdn.syndication.twimg.com https://syndication.twitter.com https://twitter.com https://x.com https://api.open-meteo.com https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com;
  frame-src https://platform.twitter.com https://syndication.twitter.com https://www.google.com https://accounts.google.com https://boothlist-4589c.firebaseapp.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<title>Furst Class 부스 목록</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    /* Furst Class(Gambling Cat) 테마: 행사 로고의 크림슨·블랙·화이트를 눈이 편한 파스텔 톤으로 */
    --paper:#f8f0f2;      /* 배경: 연한 블러시 핑크 */
    --panel:#2b2229;      /* 상단바·팝오버: 부드러운 블랙(살짝 자주빛) */
    --panel-2:#3d3039;
    --ink:#2b2229;
    --moss:#d9637f;       /* 주 강조색: 파스텔 크림슨 */
    --moss-light:#f2a9bb; /* 어두운 배경 위 보조 글자색: 연핑크 */
    --clay:#e07a93;       /* 선택된 탭·메모 표시: 로즈 */
    --accent:#e8557a;     /* 선택된 탭/저장 버튼: 로고의 크림슨을 조금 밝게 */
    --line:#ecd3da;
    --card-bg:#fffafb;
    --muted:#9a7d88;      /* 회색 글자: 모브 그레이 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
  }

  /* 스크롤바를 사이트 테마 색상에 맞춤 */
  html{
    scrollbar-color:var(--moss) var(--paper);
    scrollbar-width:thin;
  }
  ::-webkit-scrollbar{
    width:12px;
    height:12px;
  }
  ::-webkit-scrollbar-track{
    background:var(--paper);
  }
  ::-webkit-scrollbar-thumb{
    background:var(--moss);
    border-radius:8px;
    border:3px solid var(--paper);
  }
  ::-webkit-scrollbar-thumb:hover{
    background:var(--clay);
  }
  .modal{
    scrollbar-color:rgba(255,255,255,.35) transparent;
  }
  .modal::-webkit-scrollbar-track{
    background:transparent;
  }
  .modal::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.3);
    border:3px solid var(--panel);
  }
  .modal::-webkit-scrollbar-thumb:hover{
    background:rgba(255,255,255,.5);
  }

  header.top{
    background:var(--panel);
    color:var(--paper);
    padding:22px 20px 18px;
    border-bottom:3px solid var(--accent);
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .top-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand .mark{
    font-size:26px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .brand .sub{
    font-size:12px;
    color:var(--moss-light);
    letter-spacing:.04em;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:6px;
    padding:6px 10px;
  }
  .search-box input{
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-size:13px;
    width:180px;
  }
  .search-box input::placeholder{color:#e9c6d0;}

  .lang-switch{
    display:flex;
    gap:4px;
  }
  .lang-switch button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    padding:5px 10px;
    border-radius:4px;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s;
  }
  .lang-switch button:hover{background:rgba(255,255,255,.12);}
  .lang-switch button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }

  .settings-wrap{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.35);
    background:transparent;
    color:var(--paper);
    padding:0 12px;
    height:34px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s;
  }
  .header-btn:hover{background:rgba(255,255,255,.12);}
  .settings-btn{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    width:34px;
    height:34px;
    border-radius:6px;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    transition:background .15s;
  }
  .settings-btn:hover{background:rgba(255,255,255,.12);}
  .settings-menu{
    display:none;
    position:fixed;
    z-index:50;
    width:190px;
    max-width:calc(100vw - 20px);
    background:var(--panel);
    border-radius:10px;
    padding:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .settings-menu.open{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .settings-menu .lang-switch{
    justify-content:flex-end;
  }
  .settings-item{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    padding:7px 12px;
    border-radius:6px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    text-align:left;
    transition:background .15s;
  }
  .settings-item:hover{background:rgba(255,255,255,.12);}
  .settings-item:disabled{opacity:.5; cursor:default;}
  .settings-item:disabled:hover{background:transparent;}
  .settings-item.danger{
    border-color:rgba(214,69,69,.55);
    color:#ff9a9a;
  }
  .settings-item.danger:hover{background:rgba(214,69,69,.18);}
  .auth-status{
    font-size:11px;
    color:rgba(248,240,242,.75);
    padding:0 2px;
    word-break:break-all;
  }

  .help-body p{
    margin:0 0 12px;
    line-height:1.7;
  }
  .help-body p:last-child{margin-bottom:0;}
  .help-body a{color:inherit;}

  nav.rows{
    max-width:1180px;
    margin:0 auto;
    margin-top:16px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  nav.rows button{
    appearance:none;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:var(--paper);
    width:36px;
    height:36px;
    border-radius:4px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  nav.rows button:hover{background:rgba(255,255,255,.12);}
  nav.rows button.active{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }
  nav.rows button.empty{
    opacity:.35;
  }
  nav.rows button.memo-tab-btn{
    width:auto;
    padding:0 12px;
    font-size:13px;
    font-weight:600;
    border-color:rgba(255,255,255,.35);
  }
  nav.rows button.memo-tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
  }

  .second-row{
    max-width:1180px;
    margin:10px auto 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 20px;
  }
  .tab-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .tab-group button{
    appearance:none;
    border:1px solid rgba(255,255,255,.35);
    background:transparent;
    color:var(--paper);
    padding:0 12px;
    height:36px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .tab-group button:hover{background:rgba(255,255,255,.12);}
  .tab-group button.active{
    background:var(--accent);
    border-color:var(--accent);
  }

  main{
    max-width:1180px;
    margin:0 auto;
    padding:26px 20px 80px;
  }

  .row-heading{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .row-heading .big-letter{
    font-size:42px;
    font-weight:800;
    line-height:1;
    color:var(--clay);
  }
  .row-heading .count{
    font-size:13px;
    color:#6b5561;
  }
  .sort-priority-btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 10px;
    border-radius:4px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    margin-left:auto;
    transition:background .15s, border-color .15s;
  }
  .sort-priority-btn:hover{background:#fbe8ed;}
  .sort-priority-btn.active{
    background:var(--panel);
    border-color:var(--panel);
    color:var(--paper);
  }
  .notes-extra{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin:-8px 0 18px;
  }
  .visit-filter{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .visit-filter button{
    appearance:none;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink);
    padding:5px 10px;
    border-radius:4px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .visit-filter button:hover{background:#fbe8ed;}
  .visit-filter button.active{
    background:var(--panel);
    border-color:var(--panel);
    color:var(--paper);
  }
  .budget-total{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 12px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
    gap:14px;
  }

  .booth{
    position:relative;
    z-index:1;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 8px 12px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, transform .12s;
  }
  .booth:hover{
    border-color:var(--moss);
    transform:translateY(-2px);
  }
  .booth .id{
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.03em;
    margin-bottom:6px;
  }
  .avatar-wrap{
    width:64px;
    height:64px;
    margin:0 auto 8px;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar-wrap.avatar-link{
    outline-offset:2px;
    transition:outline .12s;
  }
  .avatar-wrap.avatar-link:hover{
    outline:2px solid var(--moss);
  }
  .avatar-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar-wrap .fallback{
    color:var(--moss-light);
    font-size:20px;
    font-weight:700;
  }
  .circle-name{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .rep-name{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .no-tw-badge{
    position:absolute;
    top:6px;
    right:6px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#d9a24b;
    display:none;
  }
  .booth.no-tw .no-tw-badge{display:block;}

  /* 메모가 달린 부스 표시 */
  .booth.has-note{
    border-color:var(--clay);
    box-shadow:0 0 0 1px var(--clay) inset;
    background:#fde3ea;
  }
  .memo-flag{
    position:absolute;
    top:6px;
    left:6px;
    font-size:12px;
    line-height:1;
    display:none;
  }
  .booth.has-note .memo-flag{display:block;}

  /* 방문 예정/완료 부스 표시 (메모 표시보다 우선 적용) */
  .booth.visit-planned{
    border-color:#c99a1f;
    box-shadow:0 0 0 1px #c99a1f inset;
    background:#fff6d1;
  }
  .booth.visit-visited{
    border-color:#3f7a33;
    box-shadow:0 0 0 1px #3f7a33 inset;
    background:#e3f3df;
  }

  /* 우선순위 표시 (배경색과 겹치지 않도록 카드 테두리 outline으로 표시) */
  .booth.priority-1{ outline:3px solid #d64545; outline-offset:2px; }
  .booth.priority-2{ outline:3px solid #8b5fbf; outline-offset:2px; }
  .booth.priority-3{ outline:3px solid #3b82c4; outline-offset:2px; }

  /* 팝오버 안의 메모 입력 영역 */
  .memo-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .memo-box label{
    display:block;
    font-size:11px;
    color:var(--moss-light);
    margin-bottom:4px;
  }
  .memo-box textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    color:var(--paper);
    font-size:12px;
    font-family:inherit;
    padding:6px 8px;
    box-sizing:border-box;
  }
  .memo-box .memo-actions{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .memo-box button{
    font-size:11px;
    padding:4px 10px;
    border-radius:5px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
  }
  .memo-box button.save{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .memo-box .memo-status{
    font-size:10.5px;
    color:var(--moss-light);
    margin-left:auto;
    align-self:center;
  }

  /* 성인 부스 표시 */
  .adult-tag{
    display:inline-block;
    margin-left:4px;
    padding:0 4px;
    border-radius:4px;
    background:#d64545;
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0;
    vertical-align:1px;
  }

  /* 부스컷 (팝오버/모달 상단) */
  .booth-cut{
    margin-bottom:10px;
    border-radius:8px;
    overflow:hidden;
    background:var(--panel-2);
  }
  .booth-cut img{
    display:block;
    width:100%;
    max-height:220px;
    object-fit:contain;
    cursor:zoom-in;
  }
  .booth-cut .cut-placeholder{
    font-size:11.5px;
    color:#e9c6d0;
    border:1px dashed rgba(255,255,255,.25);
    border-radius:8px;
    padding:14px 8px;
    text-align:center;
  }
  .modal .booth-cut img{ max-height:none; }
  .cut-lightbox{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    cursor:zoom-out;
  }
  .cut-lightbox img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:6px;
  }

  /* 부스원 목록 (리더 + 부스원) */
  .member-list{
    margin:0 0 10px;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .member-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
  }
  .member-avatar{
    flex:none;
    width:30px;
    height:30px;
    border-radius:50%;
    overflow:hidden;
    background:var(--panel-2);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--moss-light);
    font-weight:700;
    font-size:13px;
  }
  .member-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .member-avatar.avatar-link{ cursor:pointer; }
  .member-avatar.avatar-link:hover{ outline:2px solid var(--moss-light); outline-offset:1px; }
  .member-text{ min-width:0; flex:1; }
  .member-name{
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .member-handle{ font-size:11px; }
  .member-handle a{ color:var(--moss-light); text-decoration:none; }
  .member-handle a:hover{ text-decoration:underline; }
  .member-handle .no-x{ color:#b99aa5; }

  /* hover / focus popover */
  .popover{
    display:none;
    position:absolute;
    z-index:200;
    left:50%;
    bottom:calc(100% + 10px);
    transform:translateX(-50%);
    width:300px;
    max-width:calc(100vw - 20px);
    background:var(--panel);
    color:var(--paper);
    border-radius:10px;
    padding:14px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
    text-align:left;
  }
  .popover.below{
    bottom:auto;
    top:calc(100% + 10px);
  }
  .pop-body{
    /* 안쪽 스크롤 때문에 가장자리가 잘리므로, 프로필 사진 마우스 오버 테두리가 들어갈 여유를 둠 */
    margin:0 -5px;
    padding:3px 5px;
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-width:thin;
  }
  .booth.show-pop{ z-index:200; }
  .booth.show-pop .popover{display:block;}
  .popover::before{
    content:"";
    position:absolute;
    bottom:-6px;
    left:var(--arrow-left, 50%);
    transform:translateX(-50%) rotate(45deg);
    width:12px;
    height:12px;
    background:var(--panel);
  }
  .popover.below::before{
    bottom:auto;
    top:-6px;
  }
  .pop-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .pop-head img{
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    background:var(--panel-2);
  }
  .pop-head img.avatar-link{
    cursor:pointer;
    outline-offset:2px;
    transition:outline .12s;
  }
  .pop-head img.avatar-link:hover{
    outline:2px solid var(--moss-light);
  }
  .pop-head .names{font-size:13px;}
  .pop-head .c-name{font-weight:700;}
  .pop-head .r-name{color:var(--moss-light);font-size:11px;}
  .pop-links{
    display:flex;
    gap:8px;
    margin-top:10px;
    font-size:11px;
  }
  .pop-links a{
    color:var(--moss-light);
    text-decoration:none;
    border:1px solid rgba(255,255,255,.25);
    padding:4px 8px;
    border-radius:5px;
  }
  .pop-links a:hover{background:rgba(255,255,255,.1);}

  /* 방문 예정/완료 표시 버튼 */
  .visit-box{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .visit-box button{

    font-weight:600;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.25);

    flex:1;
    font-size:11.5px;
    font-weight:600;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }

    background:#d64545;
    border-color:#d64545;
    color:#fff;
  }

    border-color:#8b5fbf;
    color:#fff;
  }

    border-color:#3b82c4;
    color:#fff;
  }

    font-size:11px;
    color:var(--moss-light);
    margin-bottom:4px;

  .budget-input-row{
    display:flex;
    align-items:center;
    gap:6px;

    padding:2px 8px;

    color:var(--moss-light);

  .budget-input-row input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);

    font-family:inherit;
    padding:6px 0;

  .tweet-slot{
    margin-top:2px;
    min-height:20px;
  }

    font-size:11.5px;

    border:1px dashed rgba(255,255,255,.25);
    border-radius:6px;
    padding:8px;
    line-height:1.5;
  }
  .tweet-slot iframe{border-radius:6px;}
  .official-feed{
    height:520px;
    overflow-y:auto;
    overscroll-behavior:contain;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card-bg);
    margin-bottom:8px;
  }
  .official-feed{ padding:0 10px; }
  .official-post{ max-width:550px; margin:0 auto; }
  .official-feed-more{ height:1px; }
  .official-feed .placeholder{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }
  @media (max-width:600px){ .official-feed{ height:420px; } }

  .empty-state{
    padding:60px 0;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  /* 배치도(스키매틱 맵) */
  .map-grid{

    gap:16px;

  }

    align-items:center;
    flex:0 0 auto;

    gap:2px;

    justify-content:center;

    height:22px;

    align-items:center;
    justify-content:center;

    border:1px solid var(--line);
    border-radius:3px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
  }

    border-color:transparent;
    background:transparent;
    cursor:default;
  }

  .map-cell.has-note{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
    font-weight:700;
  }
  .map-cell.visit-planned{
    background:#e0b12c;
    border-color:#e0b12c;
    color:#241b06;
    font-weight:700;
  }
  .map-cell.visit-visited{
    background:#4a8f3c;
    border-color:#4a8f3c;
    color:#eafce6;
    font-weight:700;
  }
  .map-cell.priority-1{ outline:2px solid #d64545; outline-offset:1px; }
  .map-cell.priority-2{ outline:2px solid #8b5fbf; outline-offset:1px; }
  .map-cell.priority-3{ outline:2px solid #3b82c4; outline-offset:1px; }
  .map-legend{

    gap:16px;
    font-size:12px;
    color:#6b5561;
    margin-bottom:14px;

    width:12px;
    height:12px;
    border-radius:3px;
    vertical-align:-1px;
    margin-right:5px;
  }

  .venue-address{

  .info-map-wrap{

    height:100%;

  .info-map-link{

    margin-top:8px;

  }

  .weather-hum{

  }
  .weather-empty{

  }

// 부스 번호 앞 글자(A, B, C ...)로 열을 나눔. 데이터에 있는 열만 탭으로 보여줌
const ALL_ROWS = [...new Set(BOOTHS.map(b => b.block))].sort();

const BOOTH_IDS = new Set(BOOTHS.map(b => b.id));
const byRow = {};
ALL_ROWS.forEach(r => byRow[r] = []);
BOOTHS.forEach(b => { if(byRow[b.block]) byRow[b.block].push(b); });

// 새로고침해도 보고 있던 탭(부스 열/전체/메모/배치도)이 유지되도록 저장해둠
// 브라우저(localStorage)에 저장하는 모든 키의 앞부분.
const STORAGE_PREFIX = "furstclass";

// 지난 행사(케모켓, 2026-09-20 종료) 때 이 브라우저에 저장된 "kemoket-*" 데이터는 더 이상
// 쓰지 않으므로 접속할 때 지움.
try {
  Object.keys(localStorage)
    .filter(key => key.startsWith("kemoket-"))
    .forEach(key => localStorage.removeItem(key));
} catch {}

const CURRENT_ROW_KEY = `${STORAGE_PREFIX}-current-row`;
const VALID_ROWS = new Set([...ALL_ROWS, "ALL", "NOTES", "MAP", "INFO"]);
let savedRow = null;
try { savedRow = localStorage.getItem(CURRENT_ROW_KEY); } catch {}
let currentRow = (savedRow && VALID_ROWS.has(savedRow))
  ? savedRow
  : (ALL_ROWS.find(r => byRow[r].length > 0) || "A");

function goToRow(row){
  currentRow = row;
  try { localStorage.setItem(CURRENT_ROW_KEY, row); } catch {}
  renderNav();
  renderGrid();
}

let currentQuery = "";
let widgetsLoaded = false;
let notesVisitFilter = "all"; // "all" | "planned" | "visited" — 메모 탭에서 방문 상태로 필터링

// 부스 목록을 우선순위(1→2→3→없음) 순으로 정렬할지 여부 (새로고침해도 유지)
const SORT_PRIORITY_KEY = `${STORAGE_PREFIX}-sort-priority`;
let sortByPriority = false;
try { sortByPriority = localStorage.getItem(SORT_PRIORITY_KEY) === "1"; } catch {}

function toggleSortByPriority(){
  sortByPriority = !sortByPriority;
  try { localStorage.setItem(SORT_PRIORITY_KEY, sortByPriority ? "1" : "0"); } catch {}
  renderGrid();
}

  const navLang = (navigator.language || "").toLowerCase();

  return str;
}

/* ---------- 설정 메뉴(톱니바퀴) ----------
   position:fixed로 띄우고 버튼 위치를 기준으로 화면 안쪽에 들어오도록 좌표를 계산함
   (해상도가 좁아 버튼이 화면 가장자리에 가까울 때도 메뉴가 화면 밖으로 잘리지 않게 함).
------------------------------------------------- */
function positionSettingsMenu(){
  const btn = document.getElementById("settingsBtn");
  const menu = document.getElementById("settingsMenu");
  const margin = 10;
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;
  const btnRect = btn.getBoundingClientRect();
  const menuWidth = menu.offsetWidth;
  const menuHeight = menu.offsetHeight;

  let left = btnRect.right - menuWidth;
  left = Math.max(margin, Math.min(left, viewportWidth - menuWidth - margin));

  let top = btnRect.bottom + 8;
  if(top + menuHeight + margin > viewportHeight){
    top = Math.max(margin, btnRect.top - menuHeight - 8);
  }

  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
}

function closeSettingsMenu(){
  document.getElementById("settingsMenu").classList.remove("open");
}

document.getElementById("settingsBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const menu = document.getElementById("settingsMenu");
  const willOpen = !menu.classList.contains("open");
  if(willOpen){
    menu.classList.add("open");
    positionSettingsMenu();
  } else {
    closeSettingsMenu();
  }
});
document.getElementById("settingsMenu").addEventListener("click", (e) => e.stopPropagation());
document.addEventListener("click", () => closeSettingsMenu());
window.addEventListener("resize", () => {
  if(document.getElementById("settingsMenu").classList.contains("open")){
    positionSettingsMenu();
  }
});

const MERGED_BOOTH_ALIASES = {};
BOOTHS.forEach(b => {
  if((b.nums || []).length > 1) b.nums.forEach(n => { MERGED_BOOTH_ALIASES[b.block + n] = b.id; });
});
function migrateMergedBoothIds(obj){
  let changed = false;
  Object.entries(MERGED_BOOTH_ALIASES).forEach(([oldId, newId]) => {
    if(!(oldId in obj)) return;
    if(!(newId in obj)) obj[newId] = obj[oldId];
    delete obj[oldId];
    changed = true;
  });
  return changed;
}
function migrateAllMergedBoothIds(){
  if(migrateMergedBoothIds(notes)) saveNotes();
  if(migrateMergedBoothIds(visitStatus)) saveVisitStatus();
  if(migrateMergedBoothIds(priority)) savePriority();
  if(migrateMergedBoothIds(budgets)) saveBudgets();
}

    delete budgets[boothId];
  }
  saveBudgets();
}

  loginBtn.textContent = t("loginBtn");
  logoutBtn.textContent = t("logoutBtn");
  if(!syncCooldownUntil || Date.now() >= syncCooldownUntil){
    syncNowBtn.textContent = t("syncNowBtn");
  }
  // 동기화 버튼은 로그아웃 상태여도 항상 보이되, 로그인 중이 아니거나 쿨다운 중이면 비활성화
  syncNowBtn.disabled = !currentUser || Date.now() < syncCooldownUntil;
  if(currentUser){
    loginBtn.style.display = "none";
    logoutBtn.style.display = "";
    authStatus.style.display = "";
    authStatus.textContent = t("loggedInAs", { email: currentUser.email || currentUser.displayName || "" });
  } else {
    loginBtn.style.display = firebaseReady ? "" : "none";
    logoutBtn.style.display = "none";
    authStatus.style.display = "none";
  }
}

function mergeField(local, cloud){
  // 같은 부스에 로컬/클라우드 값이 둘 다 있으면 로컬을 우선(현재 기기에서 방금 한 작업을 덮어쓰지 않기 위함)
  return Object.assign({}, cloud || {}, local || {});
}

// users/{uid} 문서 안의 행사별 필드(furstclass)에 저장함.
// merge 없이 문서 전체를 덮어쓰므로, 지난 행사(케모켓) 때 문서 최상위에 저장했던
// notes/visitStatus/budgets/priority 필드는 처음 동기화할 때 함께 지워짐.
function pushToCloud(uid){
  return firebase.firestore().collection("users").doc(uid).set({
    [STORAGE_PREFIX]: {
      notes, visitStatus, budgets, priority,
      updatedAt: new Date().toISOString(),
    },
  });
}

function pullAndMergeFromCloud(uid){
  return firebase.firestore().collection("users").doc(uid).get().then((doc) => {
    const cloud = (doc.exists && doc.data()[STORAGE_PREFIX]) || {};
    notes = mergeField(notes, cloud.notes);
    visitStatus = mergeField(visitStatus, cloud.visitStatus);
    budgets = mergeField(budgets, cloud.budgets);
    priority = mergeField(priority, cloud.priority);
    migrateAllMergedBoothIds();
    saveNotes();
    saveVisitStatus();
    saveBudgets();
    savePriority();
    renderNav();
    renderGrid();
    updateBudgetTotalDisplay();
  });
}

function syncFromCloudOnLogin(uid){
  // 로그인 시 1회만 자동으로 병합 + 재업로드함(그 외에는 "지금 동기화" 버튼을 눌러야만 동기화됨.
  // Firestore 무료 플랜의 일일 읽기/쓰기 쿼터를 아끼기 위해 편집할 때마다 자동으로 올리지 않음).
  pullAndMergeFromCloud(uid).then(() => pushToCloud(uid)).catch(() => {
    // 오프라인 등으로 실패해도 로컬 데이터로 계속 사용 가능
  });
}

/* ---------- "지금 동기화" 버튼 ----------
   자동 동기화 대신 사용자가 직접 누를 때만 클라우드와 주고받도록 함.
   연타로 무료 플랜 일일 쿼터를 낭비하지 않도록 클릭 후 일정 시간 버튼을 잠금.
------------------------------------------------ */
const SYNC_COOLDOWN_SECONDS = 10;
let syncCooldownUntil = 0;
let syncCooldownTimer = null;

function startSyncCooldown(){
  const btn = document.getElementById("syncNowBtn");
  if(!btn) return;
  syncCooldownUntil = Date.now() + SYNC_COOLDOWN_SECONDS * 1000;
  btn.disabled = true;
  clearInterval(syncCooldownTimer);
  const tick = () => {
    const remaining = Math.ceil((syncCooldownUntil - Date.now()) / 1000);
    if(remaining <= 0){
      clearInterval(syncCooldownTimer);
      btn.disabled = !currentUser;
      btn.textContent = t("syncNowBtn");
      return;
    }
    btn.textContent = t("syncNowCooldown", { s: remaining });
  };
  tick();
  syncCooldownTimer = setInterval(tick, 1000);
}

function syncNow(){
  if(!firebaseReady || !currentUser) return;
  if(Date.now() < syncCooldownUntil) return;
  startSyncCooldown();
  pullAndMergeFromCloud(currentUser.uid)
    .then(() => pushToCloud(currentUser.uid))
    .then(() => alert(t("syncSuccess")))
    .catch(() => alert(t("syncFail")));
}

function signInWithGoogle(){
  if(!firebaseReady) return;
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((err) => {
    console.error("[Firebase Auth]", err);
    // 사용자가 스스로 취소한 경우(팝업 닫음)는 실패로 안내할 필요 없음
    if(err && (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request")) return;
    alert(t("loginFail", { code: (err && err.code) || "unknown" }));
  });
}

function signOutUser(){
  if(!firebaseReady) return;
  firebase.auth().signOut();
}

if(firebaseReady){
  firebase.auth().onAuthStateChanged((user) => {
    currentUser = user;
    updateAuthUI();
    if(user) syncFromCloudOnLogin(user.uid);
  });
}

document.getElementById("loginBtn").addEventListener("click", signInWithGoogle);
document.getElementById("logoutBtn").addEventListener("click", signOutUser);
document.getElementById("syncNowBtn").addEventListener("click", syncNow);

/* ---------- 커스텀 확인 대화상자 ----------
   브라우저 기본 confirm()은 기본 포커스가 "확인" 쪽이라 엔터를 잘못 누르면
   실수로 확정될 수 있어서, 대신 "취소"에 기본 포커스가 가는 커스텀 대화상자를 사용함.
------------------------------------------------- */
let confirmResolve = null;

function showConfirmDialog(message, okLabel){
  return new Promise((resolve) => {
    confirmResolve = resolve;
    document.getElementById("confirmMessage").textContent = message;
    document.getElementById("confirmOkBtn").textContent = okLabel;
    document.getElementById("confirmCancelBtn").textContent = t("cancel");
    document.getElementById("confirmBackdrop").classList.add("open");
    document.getElementById("confirmCancelBtn").focus();
  });
}

function closeConfirmDialog(result){
  document.getElementById("confirmBackdrop").classList.remove("open");
  if(confirmResolve){
    confirmResolve(result);
    confirmResolve = null;
  }
}

document.getElementById("confirmOkBtn").addEventListener("click", () => closeConfirmDialog(true));
document.getElementById("confirmCancelBtn").addEventListener("click", () => closeConfirmDialog(false));
document.getElementById("confirmBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "confirmBackdrop") closeConfirmDialog(false);
});

/* ---------- 전체 데이터 초기화 ----------
   메모/방문상태/예산/우선순위를 전부 삭제함(로그인 중이면 클라우드에도 반영됨).
------------------------------------------------- */
async function resetAllData(){
  if(!Object.keys(notes).length && !Object.keys(visitStatus).length && !Object.keys(budgets).length && !Object.keys(priority).length){
    return;
  }
  const confirmed = await showConfirmDialog(t("resetConfirm"), t("delete"));
  if(!confirmed) return;

  notes = {};
  visitStatus = {};
  budgets = {};
  priority = {};
  saveNotes();
  saveVisitStatus();
  saveBudgets();
  savePriority();
  renderNav();
  renderGrid();
  alert(t("resetDone"));
}

function ensureTwitterWidgets(cb){
  if(window.twttr && window.twttr.widgets){ cb(); return; }
  if(widgetsLoaded){ setTimeout(()=>cb(), 300); return; }
  widgetsLoaded = true;
  const s = document.createElement("script");
  s.src = "https://platform.twitter.com/widgets.js";
  s.async = true;
  s.onload = cb;
  document.body.appendChild(s);
}

function localAvatarUrl(handle){
  // 직접 크롤링/API로 저장해둔 프로필 사진 경로.
  // avatars/ 폴더에 X 핸들명.jpg 로 저장해두면 이 경로로 그대로 표시됨.
  // 파일이 없으면 img.onerror에서 서클명 첫 글자 placeholder로 대체됨.
  return `avatars/${handle}.jpg`;
}

/* ---------- 부스컷 ----------
   booth-cuts/ 폴더에 "부스번호.jpg"(예: booth-cuts/A01.jpg) 로 넣어두면 팝오버/모달 위쪽에 표시됨.
   파일이 아직 없으면 "부스컷 준비 중"(시트 I열이 O) 또는 "부스컷 미제출" 문구로 대신 표시함.
   이미지를 누르면 화면 전체 크기로 크게 볼 수 있음.
------------------------------------------------- */
function boothCutUrl(booth){
  return `booth-cuts/${booth.id}.jpg`;
}

function closeCutLightbox(){
  document.querySelectorAll(".cut-lightbox").forEach(el => el.remove());
}

function openCutLightbox(src, alt){
  closeCutLightbox();
  const box = document.createElement("div");
  box.className = "cut-lightbox";
  const img = document.createElement("img");
  img.src = src;
  img.alt = alt;
  box.appendChild(img);
  box.addEventListener("click", (e) => {
    e.stopPropagation();
    closeCutLightbox();
  });
  document.body.appendChild(box);
}

function buildBoothCut(booth){
  const wrap = document.createElement("div");
  wrap.className = "booth-cut";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.alt = t("boothCutAlt", { id: booth.id });
  img.src = boothCutUrl(booth);
  img.onerror = () => {
    wrap.innerHTML = `<div class="cut-placeholder">${escapeHtml(t(booth.cut ? "boothCutPending" : "boothCutNotSubmitted"))}</div>`;
  };
  img.addEventListener("click", (e) => {
    e.stopPropagation();
    openCutLightbox(img.src, img.alt);
  });
  wrap.appendChild(img);
  return wrap;
}

/* ---------- 부스원 목록 ----------
   부스 리더(맨 위) + 부스원을 한 줄씩 보여줌. 리더/부스원 구분 표시는 따로 하지 않음. X 아이디가 있으면 프로필 사진/@아이디를 눌러
   X 프로필로 바로 이동, 없으면 닉네임과 "X 계정 없음"만 표시함.
------------------------------------------------- */
function openXProfile(handle){
  window.open(`https://x.com/${handle}`, "_blank", "noopener");
}

function buildMemberList(booth){
  const list = document.createElement("ul");
  list.className = "member-list";
  (booth.members || []).forEach(member => {
    const row = document.createElement("li");
    row.className = "member-row";

    const avatar = document.createElement("div");
    avatar.className = "member-avatar";
    const setFallback = () => {
      avatar.innerHTML = "";
      avatar.textContent = (member.name[0] || "?");
    };
    // 잠금(비공개) 계정은 프로필 사진(avatar)만 보이고 X 링크·아이디(twitter)는 없음
    const avatarHandle = member.avatar || member.twitter;
    if(avatarHandle){
      if(member.twitter){
        avatar.classList.add("avatar-link");
        avatar.title = t("openProfile");
        avatar.addEventListener("click", () => openXProfile(member.twitter));
      }
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = member.name;
      img.src = localAvatarUrl(avatarHandle);
      img.onerror = setFallback;
      avatar.appendChild(img);
    } else {
      setFallback();
    }
    row.appendChild(avatar);

    const text = document.createElement("div");
    text.className = "member-text";
    text.innerHTML = `
      <div class="member-name">${escapeHtml(member.name)}</div>
      ${member.twitter
        ? `<div class="member-handle"><a href="https://x.com/${encodeURIComponent(member.twitter)}" target="_blank" rel="noopener">@${escapeHtml(member.twitter)}</a></div>`
        : ""}
    `;
    row.appendChild(text);
    list.appendChild(row);
  });
  // 목록 안을 눌러도 부스 카드 클릭(팝오버 닫힘)으로 처리되지 않도록 막음
  list.addEventListener("click", (e) => e.stopPropagation());
  return list;
}

function boothSubLine(booth){

function boothRepText(booth){

    renderNav();
  });

  pop.appendChild(memoBox);

  return { pop: outer, slot };
}

function updateNoteVisuals(boothId){

    card.classList.toggle("has-note", !!getNote(boothId));

/* ---------- 팝오버 위치 보정 ----------
   화면 폭이 애매해서 카드가 왼쪽/오른쪽 가장자리에 있을 때, 가운데 정렬된
   팝오버가 화면 밖으로 잘려나가지 않도록 뷰포트 안쪽으로 위치를 조정함.
   세로 공간이 부족하면 카드 위 대신 아래로 펼침.
------------------------------------------------- */
function positionPopover(card, pop){
  const margin = 10;
  pop.style.left = "";
  pop.style.transform = "";
  pop.style.removeProperty("--arrow-left");
  pop.classList.remove("below");
  const body = pop.querySelector(".pop-body");
  if(body) body.style.maxHeight = "";

  // innerWidth/innerHeight can include scrollbar gutters that aren't actually
  // visible content area, so use clientWidth/clientHeight for the real bounds.
  const viewportWidth = document.documentElement.clientWidth;
  const viewportHeight = document.documentElement.clientHeight;

  const cardRect = card.getBoundingClientRect();
  const popWidth = pop.offsetWidth;
  const popHeight = pop.offsetHeight;
  const cardCenter = cardRect.left + cardRect.width / 2;

  if(cardRect.top < popHeight + margin * 2 && (viewportHeight - cardRect.bottom) > cardRect.top){
    pop.classList.add("below");
  }

  // 팝오버가 펼쳐지는 쪽(위/아래)의 화면 공간 안에 들어오도록 내용 높이를 제한함.
  // 트윗이 나중에 로드되어 길어져도 화면 밖으로 넘치지 않고 안쪽에서 스크롤됨.
  if(body){
    const space = pop.classList.contains("below")
      ? viewportHeight - cardRect.bottom
      : cardRect.top;
    const padding = 28; // .popover 위아래 padding(14px * 2)
    body.style.maxHeight = `${Math.max(160, space - margin * 2 - 10 - padding)}px`;
  }

  const desired = cardCenter - popWidth / 2;
  const minLeft = margin - cardRect.left;
  const maxLeft = viewportWidth - margin - popWidth - cardRect.left;
  const left = Math.max(minLeft, Math.min(desired - cardRect.left, maxLeft));

  pop.style.left = `${left}px`;
  pop.style.transform = "none";
  pop.style.setProperty("--arrow-left", `${cardCenter - cardRect.left - left}px`);
}

// 행사 안내 탭: 공식 X 계정(@FURSTCLASS_KR)의 글을 정해진 높이 안에서 스크롤로 보여줌.
// X 타임라인 위젯은 로그인하지 않은 방문자에게 막혀(429) 빈 상자만 보이므로 쓰지 않음.
// 1) FxTwitter 공개 JSON(무료·키 없음)에서 OFFICIAL_POST_SINCE 이후 글을 페이지를 넘겨 가며 받고
//    리트윗·답글(번역 글)·숨김 글을 거름
// 2) 글마다 X 개별 글 임베드(createTweet, 로그인 불필요)로 그림. 한 번에 다 그리면 무거우므로
//    처음 몇 개만 그리고, 상자 안에서 아래로 스크롤하면 이어서 그림.
// FxTwitter 가 실패하면 OFFICIAL_POST_FALLBACK_IDS(2026-10-02 기준 최근 글)를 대신 씀.
const OFFICIAL_POST_SINCE = Date.parse("2026-06-16T00:00:00+09:00");
const OFFICIAL_POST_MAX_PAGES = 8;   // 페이지당 약 20개
const OFFICIAL_POST_BATCH = 4;       // 한 번에 그리는 글 수
// 사이트에 보여주지 않을 글 (2026-10-02 사용자 요청: 8/21 게스트 관련 글)
const OFFICIAL_POST_HIDDEN_IDS = new Set(["2090723233784099271"]);
const OFFICIAL_POST_FALLBACK_IDS = [
  "2104521337406726510", "2103382992215560409", "2102277349509050694",
  "2097718475032809727", "2091465987191136588", "2089244521016197369",
];

function fetchOfficialPostIds(){
  const base = `https://api.fxtwitter.com/2/profile/${OFFICIAL_X_HANDLE}/statuses`;
  const ids = [];
  const seen = new Set();
  const page = (cursor, n) => fetch(cursor ? `${base}?cursor=${encodeURIComponent(cursor)}` : base)
    .then(res => res.ok ? res.json() : Promise.reject(res.status))
    .then(data => {
      const results = data.results || [];
      let reachedOld = false;
      results.forEach(p => {
        const ts = p.created_timestamp ? p.created_timestamp * 1000 : Date.parse(p.created_at);
        if(ts && ts < OFFICIAL_POST_SINCE){ reachedOld = true; return; }
        const id = String(p.id);
        if(seen.has(id) || p.reposted_by || p.replying_to || OFFICIAL_POST_HIDDEN_IDS.has(id)) return;
        if(String((p.author && p.author.screen_name) || "").toLowerCase() !== OFFICIAL_X_HANDLE.toLowerCase()) return;
        seen.add(id);
        ids.push(id);
      });
      const next = data.cursor && data.cursor.bottom;
      if(!reachedOld && next && results.length && n < OFFICIAL_POST_MAX_PAGES) return page(next, n + 1);
    });
  return page(null, 1)
    .catch(() => {})   // 중간 페이지가 실패해도 그때까지 받은 글은 보여줌
    .then(() => ids.length ? ids : OFFICIAL_POST_FALLBACK_IDS);
}

function loadOfficialFeed(box){
  if(!box) return;
  const showFail = () => {
    box.innerHTML = `<div class="placeholder">${escapeHtml(t("infoNewsFail"))}</div>`;
  };
  // widgets.js 자체가 막혀 있으면(광고 차단 등) 아무 응답이 없으므로 일정 시간 뒤 안내 문구로 바꿈
  setTimeout(() => {
    if(box.isConnected && !box.querySelector("iframe")) showFail();
  }, 15000);
  fetchOfficialPostIds().then(ids => {
    ensureTwitterWidgets(function start(){
      if(!box.isConnected) return;
      // widgets.js 를 부스 팝오버에서 먼저 불러오는 중이면 준비될 때까지 잠깐 기다림
      if(!window.twttr || !window.twttr.widgets){ setTimeout(start, 300); return; }
      box.innerHTML = "";
      const sentinel = document.createElement("div");
      sentinel.className = "official-feed-more";
      box.appendChild(sentinel);
      let next = 0, shown = 0, busy = false;
      // 화면에 나오는 순서를 지키려고 한 글씩 차례로 그림
      const renderBatch = () => {
        if(busy || next >= ids.length || !box.isConnected) return;
        busy = true;
        const batch = ids.slice(next, next + OFFICIAL_POST_BATCH);
        next += batch.length;
        batch.reduce((prev, id) => prev.then(() => {
          const item = document.createElement("div");
          item.className = "official-post";
          box.insertBefore(item, sentinel);
          return window.twttr.widgets.createTweet(id, item, { theme: "light", dnt: true, lang: currentLang, conversation: "none" })
            .then(el => { if(el) shown++; else item.remove(); }, () => item.remove());
        }), Promise.resolve()).then(() => {
          busy = false;
          if(next >= ids.length){
            sentinel.remove();
            if(box.isConnected && !shown) showFail();
            return;
          }
          // 그린 글이 상자 높이를 다 채우지 못했으면 바로 이어서 그림
          if(box.scrollTop + box.clientHeight > box.scrollHeight - 400) renderBatch();
        });
      };
      box.addEventListener("scroll", () => {
        if(box.scrollTop + box.clientHeight > box.scrollHeight - 400) renderBatch();
      }, { passive: true });
      renderBatch();
    });
  });
}

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

      img.loading = "lazy";
      img.src = localAvatarUrl(cardAvatar);
      img.alt = booth.name;

        // 로컬에 저장된 이미지 파일이 없으면 서클명 첫 글자로 대체

      fb.className = "fallback";
      fb.textContent = (booth.name[0] || "?");
      avatarWrap.appendChild(fb);
    }
    card.appendChild(avatarWrap);

    const nameEl = document.createElement("div");

    card.appendChild(nameEl);

    const repEl = document.createElement("div");

    repEl.textContent = boothRepText(booth);
    card.appendChild(repEl);

    const { pop, slot } = makePopover(booth);
    card.appendChild(pop);

    let timelineLoaded = false;
    const open = () => {
      // 새 부스 팝오버를 열 때는 열려 있던 다른 팝오버를 먼저 닫음(동시에 하나만 열림).

      card.classList.add("show-pop");
      positionPopover(card, pop);
      if(booth.twitter && !timelineLoaded){

        loadTimelineInto(slot, booth.twitter);

    // 스크롤로 화면을 벗어나 자동으로 닫힐 때는 작성 중인 메모 초안을 유지함(다시 열면 그대로 남아있음).
    const closeSoft = () => card.classList.remove("show-pop");

    const close = () => {

      if(textarea) textarea.value = getNote(booth.id);

    // 클릭(탭)으로 토글: PC/모바일 공통
    card.addEventListener("click", (e) => {
      e.stopPropagation();
      card.classList.contains("show-pop") ? close() : open();
    });

    grid.appendChild(card);
  });

/* ---------- 배치도(스키매틱 맵) ----------
   Furst Class 실제 부스 배치도는 아직 받지 못해서, 부스 번호 열(A, B, C ...)마다
   "왼쪽은 큰 번호부터 내려오고 오른쪽은 1번부터 올라오는" 두 줄 마주보기 구조 +
   4개마다 통로 틈으로 단순하게 표현함(실제 배치와 다를 수 있음).
   실제 배치도를 받으면 MAP_ORDER 와 buildPairedColumn 을 그에 맞게 바꾸면 됨.
------------------------------------------------------------- */
const MAP_ORDER = ALL_ROWS;

function buildPairedColumn(list){
  // 부스 하나가 차지하는 칸 수만큼 칸(slot)을 펼침. 두 칸 부스(A37-38)는 칸 2개를 차지함.
  const slots = [];
  list.forEach(booth => (booth.nums || [booth.num]).forEach(n => slots.push({ booth, n })));
  const n = slots.length;
  const half = Math.ceil(n / 2);
  // 칸 i 의 위치: 앞쪽 절반은 오른쪽 줄 위→아래(오름차순), 뒤쪽 절반은 왼쪽 줄 아래→위(내림차순)
  const pos = i => i < half ? { col: 2, row: i } : { col: 1, row: n - 1 - i };
  const rowCount = half;
  // 4줄마다 통로(빈 줄)를 넣음 → grid 줄 번호 계산
  const gridRow = r => r + Math.floor(r / 4) + 1;

  const wrap = document.createElement("div");
  wrap.className = "map-cells-pair";
  const tracks = [];
  for(let r = 0; r < rowCount; r++){
    if(r > 0 && r % 4 === 0) tracks.push("7px");
    tracks.push("22px");
  }
  wrap.style.gridTemplateRows = tracks.join(" ");

  const makeCell = (booth, parts) => {
    const cell = document.createElement("div");
    const visitCls = getVisitStatus(booth.id) === "planned" ? " visit-planned"
      : getVisitStatus(booth.id) === "visited" ? " visit-visited" : "";
    const priorityCls = getPriority(booth.id) ? ` priority-${getPriority(booth.id)}` : "";
    cell.className = "map-cell" + (getNote(booth.id) ? " has-note" : "") + visitCls + priorityCls;
    cell.dataset.boothId = booth.id;
    cell.title = `${booth.id} ${booth.name}`;
    cell.addEventListener("click", () => openBoothModal(booth.id));
    if(parts.length === 1){
      cell.textContent = parts[0].n;
    } else {
      // 두 칸을 이어 붙인 모양: 칸마다 번호를 쓰고 사이에 옅은 구분선
      const sameCol = parts.every(p => p.col === parts[0].col);
      cell.classList.add("double", sameCol ? "double-v" : "double-h");
      const ordered = sameCol ? [...parts].sort((a, b) => a.row - b.row) : [...parts].sort((a, b) => a.col - b.col);
      ordered.forEach(p => {
        const half = document.createElement("span");
        half.className = "map-cell-half";
        half.textContent = p.n;
        cell.appendChild(half);
      });
    }
    const cols = parts.map(p => p.col), rows = parts.map(p => gridRow(p.row));
    cell.style.gridColumn = `${Math.min(...cols)} / ${Math.max(...cols) + 1}`;
    cell.style.gridRow = `${Math.min(...rows)} / ${Math.max(...rows) + 1}`;
    return cell;
  };

  // 같은 부스의 칸끼리 묶음. 위아래(같은 줄)나 좌우(같은 행)로 붙어 있으면 한 도형, 아니면 칸마다 따로 그림
  let i = 0;
  while(i < n){
    const booth = slots[i].booth;
    const parts = [];
    while(i < n && slots[i].booth === booth){ parts.push({ n: slots[i].n, ...pos(i) }); i++; }
    const adjacent = parts.length > 1 && parts.every((p, k) => k === 0 ||
      (p.col === parts[k-1].col && Math.abs(p.row - parts[k-1].row) === 1) ||
      (p.row === parts[k-1].row && Math.abs(p.col - parts[k-1].col) === 1));
    if(adjacent) wrap.appendChild(makeCell(booth, parts));
    else parts.forEach(p => wrap.appendChild(makeCell(booth, [p])));
  }
  // 칸 수가 홀수면 왼쪽 줄 맨 아래가 비므로 빈 칸으로 채움
  if(n % 2 === 1){
    const blank = document.createElement("div");
    blank.className = "map-cell blank";
    blank.style.gridColumn = "1";
    blank.style.gridRow = String(gridRow(rowCount - 1));
    wrap.appendChild(blank);
  }

  return wrap;
}

function renderMapView(){
  const mapGrid = document.getElementById("mapGrid");
  mapGrid.innerHTML = "";

  MAP_ORDER.forEach(r => {
    const list = byRow[r];
    if(!list || !list.length) return;

    const col = document.createElement("div");
    col.className = "map-col";

    const label = document.createElement("div");
    label.className = "map-col-label";
    label.textContent = r;
    col.appendChild(label);

    col.appendChild(buildPairedColumn(list));
    mapGrid.appendChild(col);
  });

  if(!mapGrid.querySelector(".map-col")){
    mapGrid.innerHTML = `<div class="empty-state" style="display:block;">${escapeHtml(t("noBoothData"))}</div>`;
  }
}

/* ---------- 행사 안내 (일정 · 약도 · 날씨) ----------
   일정/장소는 공식 사이트(furst-class.com/event) 기준.
   날씨는 Open-Meteo(API 키 불필요)에서 행사 기간 예보를 그때그때 받아와 표시함.
   예보는 대략 행사 2주 전부터 제공되므로, 그 전에는 안내 문구만 보여줌.
------------------------------------------------- */
const EVENT_DATES = ["2026-11-28", "2026-11-29"];
// 날씨 예보용 좌표(청주시 기준 대략적인 위치)
const VENUE_LAT = 36.642;
const VENUE_LON = 127.489;
const VENUE_NAME = { ko: "엔포드 호텔 청주", en: "Enford Hotel Cheongju", jp: "エンフォードホテル清州" };
const VENUE_ADDRESS = "충청북도 청주시 청원구 충청대로 114";
const VENUE_MAP_QUERY = "엔포드호텔 청주";
const OFFICIAL_SITE_URL = "https://furst-class.com/event";
const OFFICIAL_X_HANDLE = "FURSTCLASS_KR";
const EVENT_PERIOD_TEXT = { ko: "2026년 11월 28일(토) ~ 29일(일)", en: "Sat, Nov 28 – Sun, Nov 29, 2026", jp: "2026年11月28日（土）〜29日（日）" };
const WEATHER_HOURS = [11, 14, 17];

function weatherIcon(code){
  if(code === 0) return "☀️";
  if(code === 1) return "🌤️";
  if(code === 2) return "⛅";
  if(code === 3) return "☁️";
  if(code === 45 || code === 48) return "🌫️";
  if([51,53,55,56,57].includes(code)) return "🌦️";
  if([61,63,65,66,67,80,81,82].includes(code)) return "🌧️";
  if([71,73,75,77,85,86].includes(code)) return "🌨️";
  if([95,96,99].includes(code)) return "⛈️";
  return "🌡️";
}

let weatherCache = null;
function fetchEventWeather(){
  if(weatherCache) return weatherCache;
  weatherCache = fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${VENUE_LAT}&longitude=${VENUE_LON}` +
    `&hourly=temperature_2m,relative_humidity_2m,weathercode&timezone=Asia%2FSeoul` +
    `&start_date=${EVENT_DATES[0]}&end_date=${EVENT_DATES[EVENT_DATES.length - 1]}`
  ).then((res) => {
    if(!res.ok) throw new Error("weather fetch failed");
    return res.json();
  }).catch((err) => {
    // 실패한 결과를 계속 캐시해두지 않도록 해서, 탭을 다시 열면 재시도되게 함
    weatherCache = null;
    throw err;
  });
  return weatherCache;
}

function renderInfoView(){
  const el = document.getElementById("infoView");
  const venueName = VENUE_NAME[currentLang] || VENUE_NAME.ko;
  el.innerHTML = `
    <section class="info-section">
      <h2>${escapeHtml(t("infoTransitTitle"))}</h2>
      <div class="venue-name">${escapeHtml(EVENT_PERIOD_TEXT[currentLang] || EVENT_PERIOD_TEXT.ko)}</div>
      <div class="venue-name">${escapeHtml(venueName)}</div>
      <div class="venue-address">${escapeHtml(VENUE_ADDRESS)}</div>
      <a class="info-map-link" href="${OFFICIAL_SITE_URL}" target="_blank" rel="noopener">${escapeHtml(t("infoOfficialSite"))}</a>
    </section>

    <section class="info-section">
      <h2>${escapeHtml(t("infoMapTitle"))}</h2>
      <div class="info-map-wrap">
        <iframe src="https://www.google.com/maps?q=${encodeURIComponent(VENUE_MAP_QUERY)}&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <a class="info-map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(VENUE_MAP_QUERY)}" target="_blank" rel="noopener">${escapeHtml(t("infoOpenMap"))}</a>
    </section>

    <section class="info-section">
      <h2>${escapeHtml(t("infoNewsTitle"))}</h2>
      <div class="official-feed" id="officialFeed">
        <div class="placeholder">${escapeHtml(t("infoNewsLoading"))}</div>
      </div>
      <a class="info-map-link" href="https://x.com/${OFFICIAL_X_HANDLE}" target="_blank" rel="noopener">${escapeHtml(t("infoNewsOpenX", { handle: OFFICIAL_X_HANDLE }))}</a>
    </section>

    <section class="info-section">
      <h2>${escapeHtml(t("infoWeatherTitle"))}</h2>
      <div id="weatherDays">${escapeHtml(t("infoWeatherLoading"))}</div>
    </section>
  `;

  loadOfficialFeed(document.getElementById("officialFeed"));

  const weatherDays = document.getElementById("weatherDays");
  const renderUnavailable = () => {
    weatherDays.innerHTML = EVENT_DATES.map((date) =>
      `<div class="weather-empty">${escapeHtml(t("infoWeatherUnavailable", { date }))}</div>`
    ).join("");
  };
  // Open-Meteo 예보는 오늘부터 약 16일 뒤까지만 제공됨. 그보다 먼 날짜를 요청하면 에러가 나므로
  // 미리 "아직 제공되지 않음" 안내만 보여줌.
  const daysUntilEvent = (new Date(`${EVENT_DATES[0]}T00:00:00+09:00`) - Date.now()) / 86400000;
  if(daysUntilEvent > 15){
    renderUnavailable();
    return;
  }
  fetchEventWeather().then((data) => {
    const times = (data && data.hourly && data.hourly.time) || [];
    const temps = (data && data.hourly && data.hourly.temperature_2m) || [];
    const hums = (data && data.hourly && data.hourly.relative_humidity_2m) || [];
    const codes = (data && data.hourly && data.hourly.weathercode) || [];

    weatherDays.innerHTML = EVENT_DATES.map((date) => {
      const cards = WEATHER_HOURS.map((hour) => {
        const idx = times.indexOf(`${date}T${String(hour).padStart(2, "0")}:00`);
        if(idx === -1 || temps[idx] == null) return null;
        return { hour, temp: temps[idx], hum: hums[idx], code: codes[idx] };
      }).filter(Boolean);

      const body = cards.length
        ? `<div class="weather-cards">${cards.map((c) => `
            <div class="weather-card">
              <div class="weather-time">${String(c.hour).padStart(2, "0")}:00</div>
              <div class="weather-icon">${weatherIcon(c.code)}</div>
              <div class="weather-temp">${Math.round(c.temp)}°C</div>
              <div class="weather-hum">💧 ${Math.round(c.hum)}%</div>
            </div>
          `).join("")}</div>`
        : `<div class="weather-empty">${escapeHtml(t("infoWeatherUnavailable", { date }))}</div>`;
      return `<div class="venue-address" style="margin-top:10px;">${escapeHtml(date)}</div>${body}`;
    }).join("");
  }).catch(() => {
    weatherDays.innerHTML = `<div class="weather-empty">${escapeHtml(t("infoWeatherError"))}</div>`;
  });
}

/* ---------- 부스 상세 모달 (배치도에서 부스를 눌렀을 때) ---------- */
function openBoothModal(boothId){
  const booth = BOOTHS.find(b => b.id === boothId);
  if(!booth) return;

  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";
  content.classList.remove("modal-wide");

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const head = document.createElement("div");
  head.className = "pop-head";
  head.style.marginTop = "6px";
  const names = document.createElement("div");
  names.className = "names";
  names.innerHTML = `<div class="c-name">${escapeHtml(booth.name)}</div><div class="r-name">${boothSubLine(booth)}</div>`;
  head.appendChild(names);
  content.appendChild(head);
  content.appendChild(buildBoothCut(booth));
  content.appendChild(buildMemberList(booth));

  const slot = document.createElement("div");
  slot.className = "tweet-slot";
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.textContent = booth.twitter ? t("tweetLoadHint") : t("noTwitterHint");
  slot.appendChild(ph);
  content.appendChild(slot);
  if(booth.twitter){
    loadTimelineInto(slot, booth.twitter);
  }

  const links = document.createElement("div");
  links.className = "pop-links";
  if(booth.twitter){
    links.innerHTML = `<a href="https://x.com/${booth.twitter}" target="_blank" rel="noopener">${escapeHtml(t("openProfile"))}</a>`;
  }
  content.appendChild(links);

  const visitBox = document.createElement("div");
  visitBox.className = "visit-box";
  visitBox.innerHTML = `
    <button type="button" class="visit-btn planned">${escapeHtml(t("visitPlanned"))}</button>
    <button type="button" class="visit-btn visited">${escapeHtml(t("visitVisited"))}</button>
  `;
  const plannedBtn = visitBox.querySelector(".planned");
  const visitedBtn = visitBox.querySelector(".visited");
  const syncVisitButtons = () => {
    const status = getVisitStatus(booth.id);
    plannedBtn.classList.toggle("active", status === "planned");
    visitedBtn.classList.toggle("active", status === "visited");
  };
  syncVisitButtons();
  const refreshVisitViews = () => {
    updateVisitVisuals(booth.id);
    if(currentRow === "MAP") renderMapView();
  };
  plannedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "planned" ? null : "planned");
    refreshVisitViews();
    syncVisitButtons();
  });
  visitedBtn.addEventListener("click", () => {
    setVisitStatus(booth.id, getVisitStatus(booth.id) === "visited" ? null : "visited");
    refreshVisitViews();
    syncVisitButtons();
  });
  content.appendChild(visitBox);

  const priorityBox = document.createElement("div");
  priorityBox.className = "priority-box";
  priorityBox.innerHTML = `
    <button type="button" class="p1">${escapeHtml(t("priority1"))}</button>
    <button type="button" class="p2">${escapeHtml(t("priority2"))}</button>
    <button type="button" class="p3">${escapeHtml(t("priority3"))}</button>
  `;
  const p1Btn = priorityBox.querySelector(".p1");
  const p2Btn = priorityBox.querySelector(".p2");
  const p3Btn = priorityBox.querySelector(".p3");
  const syncPriorityButtons = () => {
    const level = getPriority(booth.id);
    p1Btn.classList.toggle("active", level === 1);
    p2Btn.classList.toggle("active", level === 2);
    p3Btn.classList.toggle("active", level === 3);
  };
  syncPriorityButtons();
  const refreshPriorityViews = () => {
    updatePriorityVisuals(booth.id);
    if(currentRow === "MAP") renderMapView();
  };
  [[p1Btn, 1], [p2Btn, 2], [p3Btn, 3]].forEach(([btn, level]) => {
    btn.addEventListener("click", () => {
      setPriority(booth.id, getPriority(booth.id) === level ? null : level);
      refreshPriorityViews();
      syncPriorityButtons();
    });
  });
  content.appendChild(priorityBox);

  const budgetBox = document.createElement("div");
  budgetBox.className = "budget-box";
  budgetBox.innerHTML = `
    <label>${escapeHtml(t("budgetLabel"))}</label>
    <div class="budget-input-row">
      <span class="yen">₩</span>
      <input type="number" min="0" step="1000" inputmode="numeric" value="${getBudget(booth.id) || ""}" placeholder="0">
    </div>
  `;
  const budgetInput = budgetBox.querySelector("input");
  budgetInput.addEventListener("input", () => {
    setBudget(booth.id, budgetInput.value);
    updateBudgetTotalDisplay();
  });
  content.appendChild(budgetBox);

  const memoBox = document.createElement("div");
  memoBox.className = "memo-box";
  memoBox.innerHTML = `
    <label>${escapeHtml(t("memoLabel"))}</label>
    <textarea maxlength="1000" placeholder="${escapeHtml(t("memoPlaceholder"))}">${escapeHtml(getNote(booth.id))}</textarea>
    <div class="memo-actions">
      <button type="button" class="save">${escapeHtml(t("save"))}</button>
      <button type="button" class="delete">${escapeHtml(t("delete"))}</button>
      <span class="memo-status"></span>
    </div>
  `;
  const textarea = memoBox.querySelector("textarea");
  const saveBtn = memoBox.querySelector(".save");
  const deleteBtn = memoBox.querySelector(".delete");
  const status = memoBox.querySelector(".memo-status");

  saveBtn.addEventListener("click", () => {
    setNote(booth.id, textarea.value);
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP") renderMapView();
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("savedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });
  deleteBtn.addEventListener("click", () => {
    textarea.value = "";
    setNote(booth.id, "");
    updateNoteVisuals(booth.id);
    renderNav();
    if(currentRow === "MAP") renderMapView();
    if(currentRow === "NOTES") renderGrid();
    status.textContent = t("deletedStatus");
    setTimeout(() => { status.textContent = ""; }, 1500);
  });

  content.appendChild(memoBox);

  backdrop.classList.add("open");
}

function openHelpModal(){
  const backdrop = document.getElementById("modalBackdrop");
  const content = document.getElementById("modalContent");
  content.innerHTML = "";
  content.classList.add("modal-wide");

  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", closeModal);
  content.appendChild(closeBtn);

  const title = document.createElement("h2");
  title.style.margin = "6px 0 14px";
  title.textContent = t("helpTitle");
  content.appendChild(title);

  const body = document.createElement("div");
  body.className = "help-body";
  const link = `<a href="https://furst-class.com/" target="_blank" rel="noopener">https://furst-class.com/</a>`;
  const paragraphs = (I18N[currentLang] && I18N[currentLang].helpBody) || I18N.ko.helpBody;
  body.innerHTML = paragraphs
    .map(line => `<p>${escapeHtml(line).replace("{link}", link).replace(/\n/g, "<br>")}</p>`)
    .join("");
  content.appendChild(body);

  backdrop.classList.add("open");
}

document.getElementById("helpBtn").addEventListener("click", () => {
  closeSettingsMenu();
  openHelpModal();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  closeSettingsMenu();
  resetAllData();
});

document.getElementById("visitFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-filter]");
  if(!btn) return;
  notesVisitFilter = btn.dataset.filter;
  renderGrid();
});

document.getElementById("sortPriorityBtn").addEventListener("click", toggleSortByPriority);

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("open");
}

document.getElementById("modalBackdrop").addEventListener("click", (e) => {
  if(e.target.id === "modalBackdrop") closeModal();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    closeCutLightbox();
    closeModal();
    closeConfirmDialog(false);
  }
});

applyStaticTexts();
renderNav();
renderGrid();

// 오프라인에서도 사이트를 열람할 수 있도록 서비스 워커 등록

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // 등록 실패해도(예: 지원 안 하는 브라우저) 사이트 자체 동작에는 지장 없음
    });
  });
}
