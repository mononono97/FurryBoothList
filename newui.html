<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://platform.twitter.com https://cdn.syndication.twimg.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://abs.twimg.com https://ton.twimg.com;
  font-src 'self' data:;
  connect-src 'self' https://firestore.googleapis.com https://cdn.syndication.twimg.com https://syndication.twitter.com;
  frame-src https://platform.twitter.com https://syndication.twitter.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">
<meta name="robots" content="noindex">
<title>Furst Class 부스 카탈로그 (새 디자인 시험)</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script>
  // 새 디자인 시험 페이지 (2026-11-22). 기존 index.html 과 같은 데이터를 읽기만 하고, 사용자 기록에는 쓰지 않음.
  // 테마: 이 페이지에서 고른 값(fcnewui-theme) → 기존 사이트 설정(furstclass-theme, 읽기만) → 브라우저 설정 순.
  (function(){
    var t = null;
    try { t = localStorage.getItem("fcnewui-theme") || localStorage.getItem("furstclass-theme"); } catch (e) {}
    var dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f4f3f6;
    --sheet: #ffffff;
    --ink: #17151c;
    --ink-2: #4a4652;
    --muted: #6b6674;
    --rule: #d8d5de;
    --rule-strong: #17151c;
    --cover: #a3122b;
    --cover-ink: #ffffff;
    --cover-ink-2: #f6d7dc;
    --tab-a: #b3122e;
    --tab-b: #2147c4;
    --tab-c: #0d7350;
    --tab-ink: #ffffff;
    --field: #ffffff;
    --field-line: #bdb8c6;
    --focus: #2147c4;
    --adult: #a3122b;
    --mark: #fff1a8;
    --mark-ink: #3a2f00;
    --shadow: 0 18px 48px -12px rgba(23, 21, 28, .35), 0 2px 6px rgba(23, 21, 28, .12);
    --scrim: rgba(23, 21, 28, .45);
    --font: "Pretendard", "Pretendard Variable", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    --num-font: "SF Mono", "Cascadia Mono", "Consolas", "Roboto Mono", ui-monospace, monospace;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #121015;
    --sheet: #1b1920;
    --ink: #f1eff5;
    --ink-2: #c9c4d2;
    --muted: #9d97a8;
    --rule: #2f2b36;
    --rule-strong: #f1eff5;
    --cover: #5c0b1a;
    --cover-ink: #ffffff;
    --cover-ink-2: #e7b9c1;
    --tab-a: #ff5c72;
    --tab-b: #86a2ff;
    --tab-c: #4fd3a0;
    --tab-ink: #121015;
    --field: #1b1920;
    --field-line: #4a4553;
    --focus: #86a2ff;
    --adult: #ff7a8c;
    --mark: #5a4a00;
    --mark-ink: #fff3b0;
    --shadow: 0 18px 48px -12px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .4);
    --scrim: rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 132px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.5 var(--font);
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--cover); color: var(--cover-ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  html { scrollbar-color: var(--field-line) var(--paper); }
  a { color: inherit; text-underline-offset: 3px; }
  button { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- 표지(머리) ---------- */
  .cover {
    background: var(--cover);
    color: var(--cover-ink);
    padding: 22px 16px 20px;
  }
  .cover-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: flex-end; gap: 16px; }
  .cover h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; font-weight: 800; }
  .cover h1 small { display: block; font-size: 14px; font-weight: 600; letter-spacing: .02em; color: var(--cover-ink-2); margin-bottom: 6px; }
  .cover p { margin: 8px 0 0; color: var(--cover-ink-2); font-size: 14px; }
  .cover-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .cover-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
    border: 1px solid rgba(255,255,255,.4); border-radius: 6px; background: transparent; color: var(--cover-ink);
    font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
    transition: background-color .15s ease-out;
  }
  .cover-btn:hover { background: rgba(255,255,255,.12); }
  .cover-btn:focus-visible { outline-color: #fff; }

  /* ---------- 도구줄(검색·블록 탭) ---------- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--rule-strong);
  }
  .bar-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .search { position: relative; flex: 1 1 320px; min-width: 0; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 44px; padding: 0 40px 0 40px;
    border: 1px solid var(--field-line); border-radius: 6px; background: var(--field); color: var(--ink);
    font: inherit; font-size: 16px;
  }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  .search .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; background: none; border-radius: 4px; cursor: pointer; color: var(--muted);
    display: none; align-items: center; justify-content: center;
  }
  .search.has .clear { display: inline-flex; }
  .search .clear:hover { color: var(--ink); }

  .tabs { display: flex; gap: 0; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; flex: none; }
  .tab {
    --c: var(--ink);
    height: 42px; min-width: 48px; padding: 0 14px; border: 0; border-left: 1px solid var(--rule-strong);
    background: var(--sheet); cursor: pointer; font-weight: 800; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background-color .15s ease-out, color .15s ease-out;
  }
  .tab:first-child { border-left: 0; font-weight: 700; font-size: 14px; }
  .tab[data-block="A"] { --c: var(--tab-a); }
  .tab[data-block="B"] { --c: var(--tab-b); }
  .tab[data-block="C"] { --c: var(--tab-c); }
  .tab .n { font-size: 11px; font-weight: 600; color: var(--muted); font-family: var(--num-font); }
  .tab:hover { background: color-mix(in srgb, var(--c) 10%, var(--sheet)); }
  .tab[aria-pressed="true"] { background: var(--c); color: var(--tab-ink); }
  .tab[aria-pressed="true"] .n { color: inherit; opacity: .8; }
  .tab:first-child[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .opts { display: flex; align-items: center; gap: 14px; flex: none; }
  .check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--cover); }
  .count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .count b { color: var(--ink); font-family: var(--num-font); font-weight: 700; }

  /* ---------- 카탈로그 본문 ---------- */
  main { max-width: 1240px; margin: 0 auto; padding: 8px 16px 64px; }
  .block { margin-top: 28px; }
  .block-head {
    display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px;
  }
  .block-letter {
    font-size: 56px; line-height: .9; font-weight: 900; letter-spacing: -.04em; color: var(--c);
  }
  .block-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .block-head > span:not(.block-letter) { font-size: 13px; color: var(--muted); }
  .block[data-block="A"] { --c: var(--tab-a); }
  .block[data-block="B"] { --c: var(--tab-b); }
  .block[data-block="C"] { --c: var(--tab-c); }

  /* 1px 간격을 선 색으로 칠해 카탈로그의 괘선처럼 보이게 함 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 1px;
    padding: 1px 1px 0;
    border-top: 3px solid var(--c);
  }
  .cell {
    position: relative; display: flex; flex-direction: column;
    background: var(--sheet); border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer;
    min-width: 0;
    outline: 1px solid var(--rule);   /* 칸 사이 1px 간격 위에 겹쳐 그려 카탈로그 괘선처럼 */
    transition: background-color .15s ease-out;
  }
  .cell.wide { grid-column: span 2; }
  .cell:hover { background: color-mix(in srgb, var(--c) 7%, var(--sheet)); }
  .cell:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; z-index: 1; }
  .cut {
    display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; background: var(--paper);
    transition: filter .2s ease-out;
  }
  .cell.wide .cut { aspect-ratio: 3 / 2; }
  .cut-missing {
    aspect-ratio: 3 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: var(--paper); border: 1px dashed var(--field-line); color: var(--muted); font-size: 12px;
  }
  .cut-missing b { font-family: var(--num-font); font-size: 22px; color: var(--ink-2); }
  .cap { padding: 8px 10px 10px; display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline; }
  .num {
    font-family: var(--num-font); font-weight: 700; font-size: 12px; letter-spacing: .02em;
    color: var(--c); white-space: nowrap;
  }
  .name {
    font-weight: 700; font-size: 14px; line-height: 1.3; color: var(--ink);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: keep-all; overflow-wrap: anywhere;
  }
  .rep { grid-column: 2; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .flags { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
  .flag {
    height: 22px; min-width: 22px; padding: 0 6px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; font-weight: 800; line-height: 1; background: var(--sheet); color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .flag.adult { background: var(--adult); color: #fff; }
  :root[data-theme="dark"] .flag.adult { color: #121015; }
  .flag.pri { background: var(--mark); color: var(--mark-ink); font-family: var(--num-font); }
  .flag svg.i { width: 12px; height: 12px; stroke-width: 2.2; }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

  .empty { padding: 64px 16px; text-align: center; color: var(--ink-2); }
  .empty h2 { font-size: 18px; margin: 0 0 6px; color: var(--ink); }
  .empty p { margin: 0 0 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px;
    border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); color: var(--ink);
    font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none;
    transition: background-color .15s ease-out;
  }
  .btn:hover { background: var(--paper); }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: var(--ink-2); }
  .btn:disabled { opacity: .45; cursor: default; }

  .skeleton .cell { cursor: default; }
  .skeleton .cut { background: linear-gradient(90deg, var(--paper), var(--sheet), var(--paper)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  footer { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); }
  footer p { margin: 0 0 6px; }

  /* ---------- 가장자리 색인 탭 (넓은 화면) ---------- */
  .index-tabs { display: none; }
  @media (min-width: 1360px) {
    .index-tabs {
      display: flex; flex-direction: column; gap: 6px; position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 15;
    }
    .index-tabs a {
      --c: var(--ink);
      display: flex; align-items: center; justify-content: center; width: 44px; height: 64px; padding-right: 6px;
      background: var(--c); color: var(--tab-ink); text-decoration: none; font-weight: 900; font-size: 20px;
      border-radius: 6px 0 0 6px; transform: translateX(10px); transition: transform .2s cubic-bezier(.2,.8,.2,1);
      box-shadow: -2px 2px 6px rgba(0,0,0,.18);
    }
    .index-tabs a[data-block="A"] { --c: var(--tab-a); }
    .index-tabs a[data-block="B"] { --c: var(--tab-b); }
    .index-tabs a[data-block="C"] { --c: var(--tab-c); }
    .index-tabs a[hidden] { display: none; }
    .index-tabs a:hover, .index-tabs a.on { transform: translateX(0); }
    .index-tabs a.on { width: 52px; }
  }

  /* ---------- 부스 상세(오른쪽 서랍 / 휴대폰은 아래에서 올라오는 시트) ---------- */
  dialog.detail {
    --c: var(--ink);
    margin: 0 0 0 auto; padding: 0; border: 0; height: 100dvh; max-height: none; max-width: none; width: min(560px, 100vw);
    background: var(--sheet); color: var(--ink); box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  dialog.detail:not([open]) { display: none; }
  dialog.detail[data-block="A"] { --c: var(--tab-a); }
  dialog.detail[data-block="B"] { --c: var(--tab-b); }
  dialog.detail[data-block="C"] { --c: var(--tab-c); }
  dialog.detail::backdrop { background: var(--scrim); }
  dialog.detail[open] { animation: drawer-in .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes drawer-in { from { transform: translateX(40px); opacity: .4; } }
  .d-top {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 16px;
    border-bottom: 1px solid var(--rule); border-top: 4px solid var(--c);
  }
  .d-num { font-family: var(--num-font); font-weight: 800; font-size: 18px; color: var(--c); }
  .d-pos { font-size: 12px; color: var(--muted); }
  .d-top .sp { flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink);
    transition: background-color .15s ease-out;
  }
  .icon-btn:hover { background: var(--paper); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .d-body:focus { outline: none; }
  .d-body { overflow-y: auto; overscroll-behavior: contain; flex: 1; }
  .d-cut { position: relative; overflow: hidden; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .d-cut img { display: block; width: 100%; height: auto; max-height: 62dvh; object-fit: contain; margin: 0 auto; }
  .d-cut.gated img { filter: blur(28px) saturate(.6); }
  .gate {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 24px; text-align: center; background: color-mix(in srgb, var(--sheet) 55%, transparent);
  }
  .gate h3 { margin: 0; font-size: 17px; }
  .gate p { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 30ch; }
  .d-sec { padding: 18px 16px; border-bottom: 1px solid var(--rule); }
  .d-sec:last-child { border-bottom: 0; }
  .d-sec h2 { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; }
  .d-sec h3 { margin: 0 0 12px; font-size: 14px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
  .d-sec h3 span { font-weight: 500; color: var(--muted); font-size: 13px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--rule); color: var(--ink-2); }
  .tag.adult { border-color: var(--adult); color: var(--adult); }
  .members { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .member { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .ava {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; background: var(--paper);
    border: 1px solid var(--rule);
  }
  .ava.mono { display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: var(--muted); font-size: 15px; }
  .member-name { font-weight: 700; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
  .member-sub { font-size: 13px; color: var(--muted); }
  .member-sub a { color: var(--ink-2); }
  .role { font-size: 11px; font-weight: 800; color: var(--c); margin-left: 6px; }
  .mine { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
  .mine dt { color: var(--muted); }
  .mine dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .posts { display: grid; gap: 12px; }
  .post { min-height: 52px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .post.loaded { border: 0; background: none; min-height: 0; }
  .post .twitter-tweet, .post iframe { margin: 0 !important; }
  .post-fallback { display: flex; align-items: center; gap: 10px; padding: 14px; font-size: 14px; color: var(--ink-2); }
  .post-fallback a { font-weight: 700; color: var(--ink); }
  .post-wait { padding: 14px; font-size: 13px; color: var(--muted); }
  .none { color: var(--muted); font-size: 14px; margin: 0; }

  @media (max-width: 720px) {
    html { scroll-padding-top: 168px; }
    .cover { padding: 16px 16px 14px; }
    .cover h1 { font-size: 24px; }
    .cover p { font-size: 13px; margin-top: 6px; }
    .cover-btn .lbl { display: none; }
    .cover-btn { padding: 0 10px; }
    .bar-in { padding: 10px 16px; gap: 10px; }
    .search { flex-basis: 100%; }
    .tabs { flex: 1; }
    .tab { flex: 1; min-width: 0; padding: 0 6px; }
    .tab .n { display: none; }
    .opts { flex-basis: 100%; justify-content: space-between; }
    .block { margin-top: 20px; }
    .block-letter { font-size: 44px; }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cap { grid-template-columns: 1fr; padding: 6px 7px 8px; }
    .rep { grid-column: 1; }
    .name { font-size: 13px; }
    .num { font-size: 11px; }
    .flags { top: 4px; right: 4px; }
    .flag { height: 20px; min-width: 20px; font-size: 10px; padding: 0 4px; }
    dialog.detail {
      width: 100vw; height: 94dvh; margin: auto 0 0 0; border-radius: 14px 14px 0 0;
    }
    dialog.detail[open] { animation: sheet-in .24s cubic-bezier(.2,.8,.2,1); }
    .d-top { border-radius: 14px 14px 0 0; }
  }
  @media (max-width: 360px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @keyframes sheet-in { from { transform: translateY(48px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>

<script>
"use strict";
/* =========================================================================
   데이터 읽기
   - 부스 목록: index.html 의 `const BOOTHS = [...]` 한 줄과 `const BOOTH_ID_RENAMES = {...}` 줄을 그대로 읽음
     (admin.html 과 같은 방식. 데이터를 복사해 두지 않으므로 build_booths.py 로 갱신하면 여기도 같이 바뀜)
   - 상품 글: Firestore boothPosts/main 문서(공개 읽기)를 REST 로 한 번 읽음. 로그인·SDK 없음.
     기존 화면이 10분 안에 받아 둔 값(furstclass-booth-posts)이 있으면 그걸 읽어서 Firestore 읽기를 아낌.
   - 사용자 기록(우선순위·방문·메모)은 localStorage 에서 읽기만 함. 이 페이지는 furstclass-* 키에 절대 쓰지 않음.
   ========================================================================= */
const POSTS_URL = "https://firestore.googleapis.com/v1/projects/boothlist-4589c/databases/(default)/documents/boothPosts/main";
const POSTS_TTL = 10 * 60 * 1000;
const OWN_POSTS_CACHE = "fcnewui-posts";   // 이 페이지 전용 캐시(sessionStorage)

let BOOTHS = [];
let RENAMES = {};
let ALIASES = {};          // 예전 번호·두 칸 부스 낱칸 번호 → 지금 번호
let postsByBooth = {};     // 부스 번호 → [{id, handle, sensitive}] (최신 글 먼저)
let mine = { priority: {}, visit: {}, notes: {} };

const state = { q: "", block: "ALL", onlyPosts: false, list: [] };

function readJSON(storage, key){
  try { return JSON.parse(storage.getItem(key) || "null"); } catch { return null; }
}

function loadBooths(){
  return fetch("/index.html", { cache: "no-cache" }).then(r => {
    if(!r.ok) throw new Error("index.html " + r.status);
    return r.text();
  }).then(html => {
    const m = html.match(/^const BOOTHS = (.*);$/m);
    if(!m) throw new Error("BOOTHS not found");
    BOOTHS = JSON.parse(m[1]);
    const r = html.match(/^const BOOTH_ID_RENAMES = (.*);$/m);
    RENAMES = r ? JSON.parse(r[1]) : {};
    ALIASES = Object.assign({}, RENAMES);
    BOOTHS.forEach(b => {
      if((b.nums || []).length > 1) b.nums.forEach(n => { ALIASES[b.block + n] = b.id; });
    });
  });
}

// Firestore REST 값 → 일반 JS 값
function fsValue(v){
  if(!v || typeof v !== "object") return null;
  if("stringValue" in v) return v.stringValue;
  if("booleanValue" in v) return v.booleanValue;
  if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return v.doubleValue;
  if("nullValue" in v) return null;
  if("timestampValue" in v) return v.timestampValue;
  if("arrayValue" in v) return (v.arrayValue.values || []).map(fsValue);
  if("mapValue" in v){
    const o = {};
    Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => { o[k] = fsValue(x); });
    return o;
  }
  return null;
}

function loadApproved(){
  // 1) 기존 화면이 10분 안에 받아 둔 값
  const at = Number(localStorage.getItem("furstclass-booth-posts-fetched-at")) || 0;
  const shared = readJSON(localStorage, "furstclass-booth-posts");
  if(shared && Date.now() - at >= 0 && Date.now() - at < POSTS_TTL) return Promise.resolve(shared);
  // 2) 이 페이지가 10분 안에 받아 둔 값
  const own = readJSON(sessionStorage, OWN_POSTS_CACHE);
  if(own && Date.now() - own.at < POSTS_TTL) return Promise.resolve(own.approved);
  // 3) Firestore REST (15초 넘으면 포기하고 저장된 값으로)
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  return fetch(POSTS_URL, { signal: ctrl.signal }).then(r => {
    if(!r.ok) throw new Error("posts " + r.status);
    return r.json();
  }).then(doc => {
    const data = fsValue({ mapValue: { fields: doc.fields || {} } }) || {};
    const approved = data.approved || {};
    try { sessionStorage.setItem(OWN_POSTS_CACHE, JSON.stringify({ at: Date.now(), approved })); } catch {}
    return approved;
  }).catch(() => shared || (own && own.approved) || {})
    .finally(() => clearTimeout(timer));
}

function indexPosts(approved){
  const by = {};
  Object.entries(approved || {}).forEach(([id, e]) => {
    if(!e || !e.booth || !/^\d+$/.test(id)) return;
    const booth = RENAMES[e.booth] || e.booth;
    (by[booth] = by[booth] || []).push({ id, handle: e.handle || "", sensitive: !!e.sensitive });
  });
  // 글 id 는 시간이 지날수록 커지는 숫자 → 길이, 사전순으로 최신 글 먼저
  Object.values(by).forEach(arr => arr.sort((a, b) => b.id.length - a.id.length || (b.id > a.id ? 1 : -1)));
  postsByBooth = by;
}

function readMine(){
  const fix = obj => {
    const o = Object.assign({}, obj || {});
    Object.entries(ALIASES).forEach(([from, to]) => {
      if(from in o){ if(!(to in o)) o[to] = o[from]; delete o[from]; }
    });
    return o;   // 메모리 안에서만 옮김. 저장소에는 쓰지 않음
  };
  mine = {
    priority: fix(readJSON(localStorage, "furstclass-priority")),
    visit: fix(readJSON(localStorage, "furstclass-visit-status")),
    notes: fix(readJSON(localStorage, "furstclass-notes")),
  };
}

/* =========================================================================
   검색
   ========================================================================= */
function norm(s){
  return String(s || "").toLowerCase().normalize("NFKC").replace(/[\s\-_./·@]/g, "");
}
// "b12", "B-12", "b-1", "c19" 처럼 쳐도 부스 번호로 찾히게
function idKeys(b){
  const keys = [b.id];
  (b.nums || [b.num]).forEach(n => {
    keys.push(b.block + n, b.block + String(Number(n)));
  });
  return keys.map(norm);
}
function haystack(b){
  if(!b._hay){
    const parts = [b.name, b.rep, b.twitter];
    (b.members || []).forEach(m => parts.push(m.name, m.twitter));
    b._hay = norm(parts.join(" "));
    b._ids = idKeys(b);
  }
  return b._hay;
}
function matches(b, q){
  if(!q) return true;
  haystack(b);
  if(b._ids.some(k => k === q)) return true;
  return b._hay.includes(q);
}

/* =========================================================================
   그리기
   ========================================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = name => `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const PRI_MARK = { 1: "①", 2: "②", 3: "③" };

function prettyNum(b){
  // A01 → A-01, C19-20 → C-19·20
  return b.block + "-" + (b.nums && b.nums.length > 1 ? b.nums.join("·") : b.num);
}

function highlight(text, rawQ){
  const t = String(text || "");
  const q = rawQ.trim();
  if(!q) return esc(t);
  const i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(t);
  return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
}

function cellHtml(b){
  const posts = (postsByBooth[b.id] || []).length;
  const pri = mine.priority[b.id];
  const visited = mine.visit[b.id] === "visited";
  const members = (b.members || []).length;
  const wide = false;   // 두 칸짜리 그림(가로가 긴 부스컷)은 이미지를 받은 뒤 넓힘(onCutLoad)
  const flags = [];
  if(pri && PRI_MARK[pri]) flags.push(`<span class="flag pri" title="내 우선순위 ${pri}">${PRI_MARK[pri]}</span>`);
  if(visited) flags.push(`<span class="flag" title="방문함">${icon("check")}</span>`);
  if(b.adult) flags.push(`<span class="flag adult" title="성인 부스">18+</span>`);
  if(posts) flags.push(`<span class="flag" title="상품 글 ${posts}개">${icon("post")}${posts}</span>`);
  const rep = b.rep ? esc(b.rep) + (members > 1 ? ` 외 ${members - 1}명` : "") : "";
  return `<button type="button" class="cell${wide ? " wide" : ""}" data-id="${esc(b.id)}" aria-label="${esc(prettyNum(b) + " " + b.name)}">
    <img class="cut" src="/booth-cuts/thumbs/${encodeURIComponent(b.id)}.webp" alt="" loading="lazy" decoding="async" width="${wide ? 640 : 320}" height="427" data-num="${esc(prettyNum(b))}">
    <span class="cap"><span class="num">${esc(prettyNum(b))}</span><span class="name">${highlight(b.name, state.q)}</span>${rep ? `<span class="rep">${rep}</span>` : ""}</span>
    ${flags.length ? `<span class="flags">${flags.join("")}</span>` : ""}
  </button>`;
}

function blocks(){ return [...new Set(BOOTHS.map(b => b.block))].sort(); }

function render(){
  const q = norm(state.q);
  const list = BOOTHS.filter(b =>
    (state.block === "ALL" || b.block === state.block) &&
    (!state.onlyPosts || (postsByBooth[b.id] || []).length) &&
    matches(b, q));
  state.list = list;
  const main = $("main");
  $("count").innerHTML = `<b>${list.length}</b> / ${BOOTHS.length}개 부스`;
  if(!list.length){
    main.innerHTML = `<div class="empty"><h2>맞는 부스가 없어요</h2>
      <p>${state.q ? `‘${esc(state.q)}’로 찾은 결과가 없습니다. 부스 번호(예: B12)나 X 아이디로도 찾을 수 있어요.` : "상품 글이 반영된 부스가 아직 없습니다."}</p>
      <button class="btn primary" type="button" id="resetAll">조건 지우고 전체 보기</button></div>`;
    $("resetAll").onclick = resetFilters;
    main.setAttribute("aria-busy", "false");
    return;
  }
  main.innerHTML = blocks().map(bl => {
    const items = list.filter(b => b.block === bl);
    if(!items.length) return "";
    const total = BOOTHS.filter(b => b.block === bl).length;
    return `<section class="block" id="block-${bl}" data-block="${bl}" aria-labelledby="h-${bl}">
      <div class="block-head"><span class="block-letter" aria-hidden="true">${bl}</span>
        <h2 id="h-${bl}">${bl} 블록</h2><span>${items.length === total ? `${total}개 부스` : `${items.length} / ${total}개 부스`}</span></div>
      <div class="grid">${items.map(cellHtml).join("")}</div></section>`;
  }).join("");
  main.setAttribute("aria-busy", "false");
  document.querySelectorAll("#indexTabs a").forEach(a => { a.hidden = !$("block-" + a.dataset.block); });
  main.querySelectorAll("img.cut").forEach(img => {
    img.addEventListener("error", onCutError, { once: true });
    if(img.complete && img.naturalWidth) onCutLoad({ currentTarget: img });
    else img.addEventListener("load", onCutLoad, { once: true });
  });
  observeBlocks();
}

// 두 칸 부스 중 그림도 두 칸인 곳(B31-32, C19-20)은 격자 두 칸을 차지하게
function onCutLoad(e){
  const img = e.currentTarget;
  if(img.naturalWidth > img.naturalHeight * 1.2) img.closest(".cell").classList.add("wide");
}
function onCutError(e){
  const img = e.currentTarget;
  const div = document.createElement("span");
  div.className = "cut-missing";
  if(img.closest(".wide")) div.style.aspectRatio = "3 / 2";
  div.innerHTML = `<b>${esc(img.dataset.num)}</b>부스컷 준비 중`;
  img.replaceWith(div);
}

function renderTabs(){
  const bl = blocks();
  const counts = {};
  BOOTHS.forEach(b => { counts[b.block] = (counts[b.block] || 0) + 1; });
  $("tabs").innerHTML = [`<button type="button" class="tab" data-block="ALL" aria-pressed="true">전체</button>`]
    .concat(bl.map(x => `<button type="button" class="tab" data-block="${x}" aria-pressed="false">${x}<span class="n">${counts[x]}</span></button>`)).join("");
  $("indexTabs").innerHTML = bl.map(x => `<a href="#block-${x}" data-block="${x}" aria-label="${x} 블록으로">${x}</a>`).join("");
}

function setBlock(bl){
  state.block = bl;
  document.querySelectorAll("#tabs .tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.block === bl)));
  render();
  window.scrollTo({ top: 0 });
}

function resetFilters(){
  state.q = ""; $("q").value = ""; $("searchWrap").classList.remove("has");
  state.onlyPosts = false; $("onlyPosts").checked = false;
  setBlock("ALL");
}

// 넓은 화면의 가장자리 색인 탭: 지금 보고 있는 블록을 표시
let blockObserver = null;
function observeBlocks(){
  if(blockObserver) blockObserver.disconnect();
  if(!("IntersectionObserver" in window)) return;
  blockObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(en.isIntersecting){
        const bl = en.target.dataset.block;
        document.querySelectorAll("#indexTabs a").forEach(a => a.classList.toggle("on", a.dataset.block === bl));
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll(".block").forEach(s => blockObserver.observe(s));
}

/* =========================================================================
   부스 상세
   ========================================================================= */
let currentId = null;
let adultOk = false;   // 이 탭에서 성인 부스 안내를 확인했는지 (저장하지 않음)
try { adultOk = localStorage.getItem("furstclass-adult-notice-seen") === "1"; } catch {}

function boothById(id){
  id = ALIASES[id] || id;
  return BOOTHS.find(b => b.id === id);
}

function openDetail(id, fromHash){
  const b = boothById(id);
  if(!b) return;
  currentId = b.id;
  const dlg = $("detail");
  dlg.dataset.block = b.block;
  $("dNum").textContent = prettyNum(b);
  const seq = state.list.length && state.list.some(x => x.id === b.id) ? state.list : BOOTHS;
  const i = seq.findIndex(x => x.id === b.id);
  $("dPos").textContent = `${i + 1} / ${seq.length}`;
  $("dPrev").disabled = i <= 0;
  $("dNext").disabled = i >= seq.length - 1;
  $("dPrev").onclick = () => openDetail(seq[i - 1].id);
  $("dNext").onclick = () => openDetail(seq[i + 1].id);

  const posts = postsByBooth[b.id] || [];
  const p = mine.priority[b.id], v = mine.visit[b.id], memo = mine.notes[b.id];
  const visitLabel = { planned: "갈 예정", visited: "방문함" }[v];
  const gated = b.adult && !adultOk;
  const members = b.members && b.members.length ? b.members : [{ name: b.rep, twitter: b.twitter, avatar: b.avatar, role: "leader" }];

  $("dBody").innerHTML = `
    <div class="d-cut${gated ? " gated" : ""}" id="dCut">
      <img src="/booth-cuts/${encodeURIComponent(b.id)}.webp" alt="${esc(b.name)} 부스컷" decoding="async">
      ${gated ? `<div class="gate" role="note"><h3>성인 부스 안내</h3>
        <p>성인 부스는 행사 당일 추가 인증이 필요할 수 있으며, 미성년자는 구매가 어려울 수 있습니다.</p>
        <button class="btn primary" type="button" id="gateOk">확인했어요</button></div>` : ""}
    </div>
    <section class="d-sec">
      <h2 id="dName">${esc(b.name)}</h2>
      <div class="tags">
        <span class="tag">${esc(b.block)} 블록</span>
        ${(b.nums || []).length > 1 ? `<span class="tag">두 칸 부스</span>` : ""}
        ${b.adult ? `<span class="tag adult">성인 부스</span>` : ""}
      </div>
    </section>
    <section class="d-sec">
      <h3>부스원 <span>${members.length}명</span></h3>
      <ul class="members">${members.map(m => {
        const ava = m.avatar
          ? `<img class="ava" src="/avatars/${encodeURIComponent(m.avatar)}.jpg" alt="" loading="lazy" width="40" height="40">`
          : `<span class="ava mono" aria-hidden="true">${esc((m.name || "?").trim().charAt(0))}</span>`;
        const handle = m.twitter ? `<a href="https://x.com/${encodeURIComponent(m.twitter)}" target="_blank" rel="noopener">@${esc(m.twitter)}</a>` : "X 계정 없음";
        return `<li class="member">${ava}<div><div class="member-name">${esc(m.name)}${m.role === "leader" ? `<span class="role">대표</span>` : ""}</div>
          <div class="member-sub">${handle}</div></div></li>`;
      }).join("")}</ul>
    </section>
    ${(p || v || memo) ? `<section class="d-sec"><h3>내 기록 <span>읽기 전용</span></h3>
      <dl class="mine">
        ${p ? `<dt>우선순위</dt><dd>${PRI_MARK[p] || esc(p)}순위</dd>` : ""}
        ${visitLabel ? `<dt>방문</dt><dd>${visitLabel}</dd>` : ""}
        ${memo ? `<dt>메모</dt><dd>${esc(memo)}</dd>` : ""}
      </dl>
      <p class="hint">고치려면 <a href="/#${encodeURIComponent(b.id)}">기존 화면</a>에서 하세요.</p></section>` : ""}
    <section class="d-sec">
      <h3>상품 글 <span>${posts.length ? posts.length + "개" : ""}</span></h3>
      ${posts.length ? `<div class="posts" id="dPosts"></div>` : `<p class="none">아직 반영된 상품 글이 없어요. 부스원의 X 계정에서 직접 확인해 보세요.</p>`}
    </section>`;

  const ok = $("gateOk");
  if(ok) ok.onclick = () => { adultOk = true; $("dCut").classList.remove("gated"); $("dCut").querySelector(".gate").remove(); };
  const cutImg = $("dCut").querySelector("img");
  cutImg.addEventListener("error", () => { $("dCut").innerHTML = `<div class="cut-missing" style="aspect-ratio:auto;padding:48px 0"><b>${esc(prettyNum(b))}</b>부스컷 준비 중</div>`; }, { once: true });

  if(posts.length) showPosts(posts, 0);
  $("dBody").scrollTop = 0;
  if(!dlg.open) dlg.showModal();
  $("dBody").focus({ preventScroll: true });
  if(!fromHash) history.replaceState(null, "", "#" + b.id);
}

function closeDetail(){
  $("detail").close();
}

$("detail").addEventListener("close", () => {
  currentId = null;
  history.replaceState(null, "", location.pathname + location.search);
});
$("detail").addEventListener("click", e => { if(e.target === $("detail")) closeDetail(); });
$("dClose").onclick = closeDetail;
document.addEventListener("keydown", e => {
  if(!$("detail").open || e.target.closest("input, textarea")) return;
  if(e.key === "ArrowLeft" && !$("dPrev").disabled) $("dPrev").click();
  if(e.key === "ArrowRight" && !$("dNext").disabled) $("dNext").click();
});

/* ---------- X 글 임베드 ---------- */
const POST_BATCH = 3;
let widgetsPromise = null;
function loadWidgets(){
  if(window.twttr && window.twttr.widgets) return Promise.resolve(true);
  if(widgetsPromise) return widgetsPromise;
  widgetsPromise = new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "https://platform.twitter.com/widgets.js";
    s.async = true;
    s.onload = () => {
      const wait = (n) => (window.twttr && window.twttr.widgets) ? resolve(true) : n > 0 ? setTimeout(() => wait(n - 1), 100) : resolve(false);
      wait(50);
    };
    s.onerror = () => { widgetsPromise = null; resolve(false); };
    document.head.appendChild(s);
  });
  return widgetsPromise;
}

function fallbackCard(el, post){
  el.classList.remove("loaded");
  el.innerHTML = `<div class="post-fallback">${icon("ext")}<span>글을 불러오지 못했어요. <a href="https://x.com/${encodeURIComponent(post.handle || "i")}/status/${post.id}" target="_blank" rel="noopener">X에서 보기</a></span></div>`;
}

function showPosts(posts, from){
  const box = $("dPosts");
  if(!box) return;
  const more = box.querySelector(".more");
  if(more) more.remove();
  const owner = currentId;
  const slice = posts.slice(from, from + POST_BATCH);
  const els = slice.map(post => {
    const el = document.createElement("div");
    el.className = "post";
    el.innerHTML = `<div class="post-wait">X 글 불러오는 중…</div>`;
    box.appendChild(el);
    return el;
  });
  loadWidgets().then(ok => {
    slice.forEach((post, k) => {
      const el = els[k];
      if(owner !== currentId) return;
      if(!ok){ fallbackCard(el, post); return; }
      const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
      const timer = setTimeout(() => { if(!el.querySelector("iframe")) fallbackCard(el, post); }, 12000);
      window.twttr.widgets.createTweet(post.id, el, { theme, dnt: true, lang: "ko", conversation: "none" }).then(node => {
        clearTimeout(timer);
        if(node){ el.querySelector(".post-wait") && el.querySelector(".post-wait").remove(); el.classList.add("loaded"); }
        else fallbackCard(el, post);
      }).catch(() => { clearTimeout(timer); fallbackCard(el, post); });
    });
  });
  if(from + POST_BATCH < posts.length){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn more";
    btn.textContent = `글 더 보기 (${posts.length - from - POST_BATCH}개 남음)`;
    btn.onclick = () => showPosts(posts, from + POST_BATCH);
    box.appendChild(btn);
  }
}

function syncThemeBtn(){
  const dark = document.documentElement.dataset.theme === "dark";
  $("themeBtn").innerHTML = `${icon(dark ? "sun" : "moon")}<span class="lbl">${dark ? "라이트" : "다크"}</span>`;
}
$("themeBtn").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("fcnewui-theme", next); } catch {}
  syncThemeBtn();
};
