name: embed-probe
on:
  push:
    branches: [claude/project-thread-c5a74z]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 && npx playwright install --with-deps chromium >/dev/null
      - run: |
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const ids = process.argv.slice(2);
          const b = await chromium.launch();
          const p = await b.newPage();
          p.on('response', async r => { const u = r.url(); if(/tweet-result/.test(u)) { const id = new URL(u).searchParams.get('id'); let t=''; try { t = await r.text(); } catch(e){} let j=null; try{ j=JSON.parse(t);}catch(e){} console.log('result', id, r.status(), j ? JSON.stringify({t:j.__typename, sens:j.possibly_sensitive, tomb:j.tombstone && JSON.stringify(j.tombstone).slice(0,150), keys:Object.keys(j).slice(0,12)}) : t.slice(0,150)); } });
          await p.setContent('<html><body><script src="https://platform.twitter.com/widgets.js"></script></body></html>');
          await p.waitForFunction(() => window.twttr && window.twttr.widgets, null, { timeout: 20000 });
          for (const id of ids) {
            await Promise.race([
              p.evaluate(async (id) => { const d=document.createElement('div'); document.body.appendChild(d); await window.twttr.widgets.createTweet(id, d, { dnt: true, conversation: 'none' }); }, id),
              new Promise(res => setTimeout(res, 8000)),
            ]);
          }
          await p.waitForTimeout(3000);
          for (const f of p.frames()) { const m = f.url().match(/[?&]id=(\d+)/); if(!m) continue; try { console.log('frame', m[1], '=>', ((await f.evaluate(() => document.body && document.body.innerText)) || '').slice(0,80).replace(/\n/g,' | ')); } catch(e) {} }
          await b.close();
          JS
          timeout 200 node probe.mjs 2106719710876496350 2106661423615275107 2106526522777710850 2106499270732140599 2106429039938609569 2106378220639748132 2106330835066720315 2106275189667553425 2104521337406726510
          for id in 2106719710876496350 2106661423615275107 2106499270732140599; do curl -sS "https://api.fxtwitter.com/2/status/$id" | jq -c '{id: .status.id, sens: .status.possibly_sensitive, ms: .status.media.all[0].type, age: .status.age_restricted, keys: (.status|keys)}'; done
