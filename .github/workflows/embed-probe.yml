name: embed-probe
on:
  push:
    branches: [claude/project-thread-c5a74z]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 && npx playwright install --with-deps chromium >/dev/null
      - run: |
          curl -sS "https://raw.githubusercontent.com/mononono97/FurryBoothList/x-post-feed/candidates.json" | jq -r '.posts[].id' > ids.txt
          : > quotes.txt
          while read id; do
            q=$(curl -sS "https://api.fxtwitter.com/2/status/$id" | jq -r 'select(.status.quote != null and (.status.possibly_sensitive|not)) | .status.id')
            [ -n "$q" ] && echo "$q" >> quotes.txt
            sleep 0.5
          done < ids.txt
          echo "quote tweets:"; cat quotes.txt
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const ids = fs.readFileSync('quotes.txt','utf8').split('\n').filter(Boolean).slice(0,2);
          const b = await chromium.launch();
          const p = await b.newPage();
          await p.setContent('<html><body><script src="https://platform.twitter.com/widgets.js"></script></body></html>');
          await p.waitForFunction(() => window.twttr && window.twttr.widgets, null, { timeout: 20000 });
          for (const id of ids) for (const cards of ['visible', 'hidden']) {
            await Promise.race([
              p.evaluate(async ([id, cards]) => { const d=document.createElement('div'); d.dataset.k=id+'-'+cards; document.body.appendChild(d); await window.twttr.widgets.createTweet(id, d, { dnt: true, conversation: 'none', cards }); }, [id, cards]),
              new Promise(res => setTimeout(res, 10000)),
            ]);
          }
          await p.waitForTimeout(3000);
          for (const f of p.frames()) { const m = f.url().match(/hideCard=(\w+).*?[?&]id=(\d+)/); if(!m) continue; try { const txt = ((await f.evaluate(() => document.body.innerText)) || '').replace(/\n/g,' | '); console.log('id', m[2], 'hideCard', m[1], 'len', txt.length, '=>', txt.slice(0,400)); } catch(e) {} }
          await b.close();
          JS
          timeout 200 node probe.mjs
