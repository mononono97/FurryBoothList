name: fxtwitter-probe
on:
  push:
    branches: [claude/project-thread-c5a74z]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 20 "https://api.fxtwitter.com/2/profile/hijiki_daixt/statuses" > a.json
          jq -c '.results[0]' a.json | head -c 6000; echo
          jq -c '[.results[] | {id, rb: (.reposted_by!=null), rp: (.replying_to!=null), m: (.media|keys?)}]' a.json | head -c 3000; echo
          jq -c '[.results[] | select(.media!=null) | .media][0]' a.json | head -c 3000; echo
          jq -c '.cursor' a.json
