# 1시간마다 사이트를 점검하고 이상이 있을 때만 GitHub 이슈("healthcheck" 라벨)로 알림.
# 점검: 접속(첫 화면·sw.js·admin.html·부스컷·Firebase SDK), 배포가 main 과 같은지, Google 로그인 설정,
#       로그인 동기화(점검 전용 계정으로 Firestore 쓰기·읽기), Firestore·Cloudflare 무료 할당량(기본 70% 넘으면 이상).
# 같은 이상이 계속되면 이슈 본문만 조용히 갱신하고, 내용이 바뀌면 댓글, 정상으로 돌아오면 댓글 후 닫음.
# GitHub 예약 실행은 이 저장소에서 자주 빠져서 cron-job.org 가 매시간 Run workflow 를 대신 누름(예약은 예비용).
# main 이 아닌 브랜치에서 실행하면 점검 결과만 보여 주고 이슈는 건드리지 않음.
# 휴대폰 알림: 비밀값 NTFY_TOPIC 이 있으면 ntfy 앱으로도 푸시.
# 비밀값: FIREBASE_SA_KEY, CF_API_TOKEN, CF_ACCOUNT_ID, NTFY_TOPIC (없으면 그 점검만 건너뜀). 설정: docs/wiki/기능-사이트-헬스체크.md
name: 사이트 헬스체크
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  push:
    branches: [claude/project-thread-iv1a9w]

permissions:
  contents: read
  issues: write

concurrency:
  group: site-healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 배포 점검에서 main 의 index.html 이 언제 바뀌었는지 봄
          filter: blob:none     # 이미지 같은 큰 파일은 받지 않음
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests cryptography
      - name: 점검
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/site_healthcheck.py ${{ github.ref_name == 'main' && '--issue' || '' }}
      - name: TEMP ntfy 시험
        run: |
          python - <<'PY'
          import os, sys, uuid, requests
          sys.path.insert(0, "tools")
          os.environ["NTFY_TOPIC"] = "hc-selftest-" + uuid.uuid4().hex
          import site_healthcheck as h
          h.push_phone("🚨 사이트 헬스체크 이상: 첫 화면", [{"key": "첫 화면", "status": "fail", "detail": "HTTP 503"}], "https://github.com/mononono97/FurryBoothList/issues")
          r = requests.get(f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}/json?poll=1", timeout=20)
          print(r.status_code, r.text[:600])
          PY
